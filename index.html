=1-beta. Each trial gives liquid compositions from the component balances. The correct beta makes the liquid fractions sum to one.",formula:String.raw`x_i=\frac{z_i}{1+\beta(K_i-1)},\qquad \sum_i x_i=1`},{heading:"Choose the next trial",body:"A positive Rachford-Rice residual means increase beta; a negative residual means decrease beta. Bracket the root and halve the interval. After three iterations, report the next midpoint rather than pretending the solution has converged.",steps:["Calculate K-values.","Evaluate residual at beta=0 and beta=1.","Take the midpoint.","Keep the half-interval containing the sign change.","Repeat three times and suggest the fourth beta."]}],examMove:"Show a compact iteration table containing beta, q, xA, yA and the residual; the table earns method marks even before convergence.",traps:["Calling beta the liquid fraction","Iterating without checking for a sign change","Forcing a two-phase answer when every K is above or below one"],source:"Lec4; Week 3 tutorial; 2023/24 B2(d)"}),Ki({id:"vle-five-mark-language",topic:"vle",title:"Five-mark VLE definitions",eyebrow:"VLE extension",minutes:16,priority:"stretch",objective:"Turn a one-line definition into the precise five-mark answer used in older papers.",blocks:[{heading:"Use the D-E-S-U pattern",body:"Give a definition, equation, labelled sketch and useful consequence. A correct term with no relationship or consequence rarely fills a five-mark allocation."},{heading:"Relative volatility",body:"Define it as the ratio of K-values, identify the more volatile component, and explain that larger alpha gives easier separation.",formula:String.raw`\alpha_{AB}=\frac{K_A}{K_B}`},{heading:"Raoult and azeotrope",body:"Raoult links liquid composition to partial pressure in an ideal liquid. At an azeotrope x=y, so ordinary distillation loses composition driving force."}],examMove:"For “define or discuss briefly,” write five separate marking points instead of one long paragraph.",traps:["Giving only an equation","Omitting assumptions","Confusing relative volatility with vapour fraction"],source:"2022/23 Section A; 2023/24 Section A"}),Ki({id:"dist-side-draws",topic:"distillation",title:"Side draws and extra operating sections",eyebrow:"Distillation extension",minutes:34,priority:"must",objective:"Derive the two rectifying operating lines created by a saturated-liquid side draw.",blocks:[{heading:"Every draw creates another section",body:"A liquid side stream S removes both total liquid and MVC. Draw separate control volumes above and below the draw; do not reuse one operating line through the whole rectifying section."},{heading:"Above the side draw",body:"The ordinary top-section balance is unchanged.",formula:"Vy=Lx+Dx_D"},{heading:"Below a saturated-liquid draw",body:"The descending liquid becomes Ls=L-S while V is unchanged. The accumulated top products are D and S.",formula:"Vy=(L-S)x+Dx_D+Sx_S"},{heading:"Continue through the feed",body:"At the feed, apply q to the liquid and vapour flows and derive the stripping line from a fresh control volume. Check the external balances F=D+B+S and FzF=DxD+BxB+SxS."}],examMove:"Shade the control volume and label which L and V belong to each section before writing a balance.",traps:["Using F=D+B when a side stream exists","Adding S to the downward liquid below a withdrawn liquid side stream","Using one rectifying line across the draw"],source:"Lec12-Lec13; 2024/25 Q4"}),Ki({id:"dist-definition-bank",topic:"distillation",title:"The distillation definition bank",eyebrow:"Distillation extension",minutes:20,priority:"stretch",objective:"Bank the recurring five-mark terms without stealing time from graph work.",blocks:[{heading:"CMO and Trouton",body:"Constant molar overflow means L and V remain constant within a section, producing straight operating lines. Trouton estimates similar molar entropy of vaporisation for many liquids and helps justify comparable latent heats.",formula:String.raw`\Delta H_{vap}/T_b\approx 85\text{-}88\;\mathrm{J\,mol^{-1}\,K^{-1}}`},{heading:"Reflux and boilup",body:"Reflux ratio is liquid returned from the condenser per distillate withdrawn, R=L/D. Boilup ratio is vapour raised from the reboiler per bottoms withdrawn."},{heading:"Batch distillation",body:"A charged still changes composition with time and has no steady feed. The instantaneous vapour follows equilibrium with the changing still liquid."}],examMove:"Attach one diagram consequence to each definition: straight line, operating-line slope, or changing still composition.",traps:["Saying CMO means liquid equals vapour","Defining reflux as all condenser liquid","Describing batch operation as steady state"],source:"Lecture 1; Lec5-Lec6; 2022/23 A1/A5/A8; 2023/24 A2/A7"}),Ki({id:"mc-paper-speed",topic:"mccabe",title:"A 30-mark construction under time pressure",eyebrow:"McCabe extension",minutes:32,priority:"must",objective:"Complete the full 2024/25-style construction while protecting method marks.",blocks:[{heading:"Calculate before plotting",body:"Solve product flows, rectifying slope/intercept, and q-line condition first. Write those values beside the graph so a ruler slip does not erase the algebra marks."},{heading:"Use the supplied table twice",body:"Plot y against x for equilibrium; later use T against x for a liquid tray temperature. A smooth curve should pass through (0,0) and (1,1)."},{heading:"Count visibly",body:"Number each horizontal equilibrium contact. Mark the first step using the stripping line as the feed stage. State separately theoretical stages, equipment stages, theoretical trays and actual trays."}],examMove:"Budget roughly one minute per raw mark, leaving the final minutes for stage convention, axes and units.",traps:["Drawing freehand axes that are not square","Reporting an unlabelled stage number","Applying efficiency to a total condenser"],source:"Lec20 pp. 13-16; 2024/25 Q5"}),Ki({id:"mc-rmin-variants",topic:"mccabe",title:"Minimum reflux for every feed condition",eyebrow:"McCabe extension",minutes:22,priority:"stretch",objective:"Find the limiting line when the q-line is vertical, horizontal or sloped.",blocks:[{heading:"Find the physical pinch",body:"Intersect the q-line with the equilibrium curve. For a saturated liquid this is simply x=zF; for a saturated vapour it lies where y=zF."},{heading:"Make the limiting rectifying line",body:"Connect the pinch to (xD,xD), measure its slope m or y-intercept b, then recover Rmin.",formula:String.raw`R_{min}=\frac{m}{1-m}=\frac{x_D}{b}-1`},{heading:"State the design consequence",body:"At Rmin the driving force vanishes at the pinch and the required ideal stages tend to infinity. A real design uses R above Rmin."}],examMove:"Label q-line, pinch, limiting line, slope/intercept and (xD,xD); those labels are the graphical working.",traps:["Using zF as the pinch for saturated vapour","Reading Rmin directly as the slope","Calling Rmin the minimum-energy condition"],source:"Lec10; Lec20 p. 13; 2023/24 B1(d); 2024/25 Q3"}),Ki({id:"abs-design-rating",topic:"absorption",title:"Kremser: design versus rating",eyebrow:"Absorption extension",minutes:30,priority:"must",objective:"Recognise which Kremser form is needed and convert a stage requirement into available columns.",blocks:[{heading:"Rating problem",body:"Equipment stages and flows are fixed; calculate the outlet or removal. Convert real trays to ideal stages before applying Kremser."},{heading:"Design problem",body:"The required removal and operating flow are fixed; solve for ideal stages. If available columns each contain a fixed number of ideal stages, divide and round the number of columns up.",formula:String.raw`N=\frac{\log\left[1+(A-1)y_B/y_T\right]}{\log A}-1\quad(x_T=0)`},{heading:"The A=1 limit",body:"Avoid a numerical 0/0. For clean solvent, yT/yB=1/(N+1) when A=1."}],examMove:"Write DESIGN or RATING at the top, list what is fixed, and convert real equipment to ideal stages before Kremser.",traps:["Rounding a number of columns down","Using percent removal as yT","Using real trays directly in an ideal-stage equation"],source:"Lec15-Lec16; aide-memoire; 2022/23 B2; 2024/25 Q6"}),Ki({id:"abs-stripping-bulk",topic:"absorption",title:"Stripping and bulk coordinates",eyebrow:"Absorption extension",minutes:24,priority:"stretch",objective:"Switch direction and concentration basis without losing the operating-line logic.",blocks:[{heading:"Stripping reverses transfer",body:"Solute moves from liquid to gas. Minimum gas rate is the limiting analogue of minimum solvent rate in absorption."},{heading:"Use solute-free ratios for rich streams",body:"X and Y keep the inert carrier flows constant even when transferred solute is not negligible.",formula:String.raw`X=x/(1-x),\qquad Y=y/(1-y)`},{heading:"Graphical stepping still works",body:"Draw equilibrium and operating lines in the same coordinate system, then step between them in the direction of the process. State clearly whether the axes use fractions or ratios."}],examMove:"Put arrows on the column and write “gas gains solute” or “liquid gains solute” before choosing an equation.",traps:["Mixing X,Y with x,y","Using an absorption factor as a stripping factor","Keeping dilute carrier-flow assumptions for a rich stream"],source:"Lec16-Lec17; reference notation guide"})],a3=[Ve({id:"vx1",topic:"vle",kind:"mcq",priority:"must",marks:2,prompt:"For a two-phase binary flash, KA=1.8 and KB=0.55. Which statement is the correct first physical check?",options:["One K is above one and one below one, so a two-phase root may exist","Both components must be entirely vapour","The liquid fraction must equal KA/KB"],answer:"One K is above one and one below one, so a two-phase root may exist",hint:"Check the volatility of each component relative to the flash pressure.",steps:["Ki=Pi*/P.","A typical binary two-phase state has a volatile K>1 and a less volatile K<1."],marking:["Physical K-value check","Two-phase interpretation"],source:"Lec4",year:"Tutorial",skill:"flash feasibility",difficulty:"foundation"}),Ve({id:"vx2",topic:"vle",kind:"numeric",priority:"must",marks:3,prompt:"For zA=0.50, KA=1.60, KB=0.60 and beta=0.50, calculate xA from the flash component balance.",answer:.3846,tolerance:.001,unit:"mole fraction",hint:"Use xA=zA/[1+beta(KA-1)].",steps:["Denominator=1+0.5(0.6)=1.3","xA=0.50/1.3=0.3846"],marking:["Equation","Substitution","Value"],source:"Lec4 iterative method",year:"2023/24",paperPart:"B2(d)",skill:"iterative flash",difficulty:"standard"}),Ve({id:"vx3",topic:"vle",kind:"mcq",priority:"must",marks:2,prompt:"A positive Rachford-Rice residual at a trial vapour fraction means the next bisection trial should normally move which way?",options:["Toward a larger vapour fraction","Toward a smaller vapour fraction","Directly to zero liquid"],answer:"Toward a larger vapour fraction",hint:"For the normal bracket, the residual falls as beta rises.",steps:["Retain the half interval that contains the sign change."],marking:["Direction","Bisection logic"],source:"Lec4",year:"Tutorial",skill:"iteration control",difficulty:"standard"}),Ve({id:"vx4",topic:"vle",kind:"short",priority:"stretch",marks:5,prompt:"Define relative volatility as a five-mark answer.",answer:"Relative volatility is the ratio of equilibrium K-values, alphaAB=KA/KB. It compares the tendency of A and B to enter vapour. If A is the MVC then alpha>1; larger alpha means a larger equilibrium separation and easier distillation. Alpha may vary with temperature and composition.",hint:"Definition, equation, component meaning and consequence.",steps:["Define K ratio.","Identify MVC condition.","Explain separation effect.","Mention possible variation."],marking:["Definition","Equation","MVC meaning","Magnitude consequence","Limits/variation"],source:"2022/23 A2",year:"2022/23",paperPart:"A2",skill:"definition",difficulty:"standard"}),Ve({id:"vx5",topic:"vle",kind:"numeric",priority:"must",marks:3,prompt:"At 3 bar, a component has saturated vapour pressure 6.9 bar. Find its ideal K-value.",answer:2.3,tolerance:.01,hint:"Ki=Pi*/P.",steps:["K=6.9/3","K=2.3"],marking:["Equation","Substitution","Value"],source:"2023/24 B2(c) style",year:"2023/24",skill:"K-value",difficulty:"foundation"}),Ve({id:"vx6",topic:"vle",kind:"mcq",priority:"must",marks:2,prompt:"On a constant-pressure Txy plot, where is an all-liquid state?",options:["Below the bubble-point curve","Above the dew-point curve","Only on the diagonal"],answer:"Below the bubble-point curve",hint:"Heating an all-liquid mixture reaches its bubble point first.",steps:["Below bubble curve is liquid.","Between curves is two phase.","Above dew curve is vapour."],marking:["Correct region","Phase logic"],source:"2024/25 Q1(b)",year:"2024/25",paperPart:"Q1(b)",skill:"Txy reading",difficulty:"foundation"}),Ve({id:"vx7",topic:"vle",kind:"short",priority:"must",marks:4,prompt:"State four differences between flash distillation and batch distillation.",answer:"A flash is normally a continuous feed split at fixed T and P into equilibrium liquid and vapour in one stage. Batch distillation begins with a charged still, has no steady feed, removes vapour/distillate over time and the still composition changes continuously.",hint:"Compare feed mode, time dependence, products and composition.",steps:["Continuous versus charged batch.","Single simultaneous split versus removal over time.","Steady versus changing composition.","One equilibrium stage versus differential operation."],marking:["Feed mode","Time dependence","Product handling","Composition behaviour"],source:"2024/25 Q2(d)",year:"2024/25",paperPart:"Q2(d)",skill:"comparison",difficulty:"standard"}),Ve({id:"vx8",topic:"vle",kind:"numeric",priority:"stretch",marks:3,prompt:"A flash gives xA=0.40, yA=0.70 and overall zA=0.52. Find V/F.",answer:.4,tolerance:.001,unit:"vapour fraction",hint:"First find q=(y-z)/(y-x), then beta=1-q.",steps:["q=(0.70-0.52)/(0.70-0.40)=0.60","V/F=1-q=0.40"],marking:["Lever rule","Liquid fraction","Vapour fraction"],source:"Lec4",year:"Tutorial",skill:"flash quality",difficulty:"standard"}),Ve({id:"dx1",topic:"distillation",kind:"mcq",priority:"must",marks:2,prompt:"A saturated-liquid side stream S is withdrawn from a rectifying section. What is the liquid flow immediately below the draw?",options:["L-S","L+S","L"],answer:"L-S",hint:"The downward liquid entering the draw point splits into side product and continuing liquid.",steps:["Draw a balance around the side-draw stage.","L=Lbelow+S."],marking:["Correct flow","Balance logic"],source:"Lec12-Lec13",year:"2024/25",paperPart:"Q4",skill:"side draw",difficulty:"foundation"}),Ve({id:"dx2",topic:"distillation",kind:"short",priority:"must",marks:4,prompt:"D=50 kmol/h, R=2, and a saturated-liquid side draw is S=20 kmol/h. Find L, V and liquid flow below the draw.",answer:"L=100 kmol/h, V=150 kmol/h, Lbelow=80 kmol/h.",hint:"L=RD, V=L+D and Lbelow=L-S.",steps:["L=2(50)=100","V=100+50=150","Lbelow=100-20=80"],marking:["Reflux flow","Vapour flow","Side-draw balance","Units"],source:"2024/25 Q4 style",year:"Current blueprint",skill:"side-draw flows",difficulty:"standard"}),Ve({id:"dx3",topic:"distillation",kind:"short",priority:"must",marks:5,prompt:"Define constant molar overflow and state its McCabe-Thiele consequence.",answer:"Within each column section, molar liquid and vapour flow rates are constant from stage to stage. This follows approximately from similar latent heats, negligible heat loss and negligible sensible-heat effects. Constant L/V makes each operating line straight, although flows may change at feeds, side draws or heat duties.",hint:"Definition, assumptions, straight-line consequence and where flows can change.",steps:["State constant L and V per section.","Give two assumptions.","State straight operating lines.","Mention section boundaries."],marking:["Definition","Latent heat assumption","Heat/sensible assumption","Straight lines","Section qualification"],source:"2022/23 A1; 2023/24 A8",year:"2022/23",skill:"definition",difficulty:"standard"}),Ve({id:"dx4",topic:"distillation",kind:"mcq",priority:"stretch",marks:2,prompt:"Which expression is the boilup ratio for the notation used in this course?",options:["Vprime/B","L/D","D/V"],answer:"Vprime/B",hint:"Boilup compares vapour raised at the bottom with bottoms product.",steps:["Reflux belongs to the top; boilup belongs to the bottom."],marking:["Correct ratio","Bottom-section meaning"],source:"2022/23 A8; notation guide",year:"2022/23",paperPart:"A8",skill:"definition",difficulty:"foundation"}),Ve({id:"dx5",topic:"distillation",kind:"short",priority:"stretch",marks:5,prompt:"Give a five-mark explanation of Trouton’s rule and why it supports CMO.",answer:"Trouton’s rule states that many non-associating liquids have a similar molar entropy of vaporisation, so DeltaHvap/Tb is roughly 85-88 J mol-1 K-1. Components with comparable boiling points therefore often have comparable molar latent heats. Condensing one mole can approximately vaporise one mole, supporting constant molar overflow. It is an approximation and is weaker for strongly associating liquids.",hint:"Rule, numerical scale, latent-heat link, one-for-one exchange and limitation.",steps:["State entropy relation.","Give approximate value.","Connect to latent heats.","Connect to CMO.","Give limitation."],marking:["Rule","Value","Latent-heat implication","CMO consequence","Limitation"],source:"2022/23 A5",year:"2022/23",paperPart:"A5",skill:"definition",difficulty:"stretch"}),Ve({id:"dx6",topic:"distillation",kind:"numeric",priority:"must",marks:3,prompt:"F=100, zF=0.50, D=40, xD=0.90 and a side draw S=10 at xS=0.70. Find B from the total balance.",answer:50,tolerance:.001,unit:"kmol/h",hint:"F=D+B+S.",steps:["B=F-D-S","B=100-40-10=50"],marking:["Correct external balance","Substitution","Value/unit"],source:"2024/25 Q4 style",year:"2024/25",skill:"side-draw balance",difficulty:"foundation"}),Ve({id:"dx7",topic:"distillation",kind:"mcq",priority:"must",marks:2,prompt:"For a total condenser under CMO, the rectifying operating-line y-intercept is:",options:["xD/(R+1)","R/(R+1)","xB/(R+1)"],answer:"xD/(R+1)",hint:"The slope contains R; the intercept contains product composition.",steps:["y=R/(R+1)x+xD/(R+1)."],marking:["Correct intercept","Line recognition"],source:"Lec7",year:"Current blueprint",skill:"operating line",difficulty:"foundation"}),Ve({id:"dx8",topic:"distillation",kind:"short",priority:"stretch",marks:5,prompt:"Define batch distillation and distinguish it from continuous distillation.",answer:"Batch distillation starts with a finite charge in a still, normally has no continuous feed, and withdraws vapour or distillate as time proceeds. The liquid amount and composition change with time, so operation is unsteady. Continuous distillation has steady feed and product streams and is designed around approximately steady internal flows and compositions.",hint:"Charge, feed, time dependence, composition and continuous contrast.",steps:["Finite charge.","No steady feed.","Changing holdup/composition.","Unsteady operation.","Contrast continuous column."],marking:["Charge","Feed mode","Changing holdup","Changing composition","Continuous contrast"],source:"2023/24 A7",year:"2023/24",paperPart:"A7",skill:"definition",difficulty:"standard"}),Ve({id:"mx1",topic:"mccabe",kind:"numeric",priority:"must",marks:3,prompt:"For alpha=3, zF=0.50, xD=0.95 and saturated-liquid feed, calculate the pinch y-coordinate used for Rmin.",answer:.75,tolerance:.001,hint:"At q=1, pinch x=zF and y follows equilibrium.",steps:["yp=alpha zF/[1+(alpha-1)zF]","yp=1.5/2=0.75"],marking:["Pinch x","Equilibrium equation","Value"],source:"Lec10",year:"Current blueprint",skill:"minimum reflux",difficulty:"standard"}),Ve({id:"mx2",topic:"mccabe",kind:"numeric",priority:"must",marks:3,prompt:"A limiting rectifying line passes through (0.95,0.95) and (0.50,0.75). Find Rmin.",answer:.8,tolerance:.01,hint:"Find m, then R=m/(1-m).",steps:["m=(0.95-0.75)/(0.95-0.50)=0.4444","Rmin=0.4444/0.5556=0.80"],marking:["Slope","R relation","Value"],source:"Lec10",year:"Current blueprint",skill:"minimum reflux",difficulty:"standard"}),Ve({id:"mx3",topic:"mccabe",kind:"mcq",priority:"must",marks:2,prompt:"For a saturated-vapour feed, where is the q-line/equilibrium pinch located?",options:["At the equilibrium point where y=zF","At x=zF regardless of equilibrium","At the origin"],answer:"At the equilibrium point where y=zF",hint:"A saturated-vapour q-line is horizontal.",steps:["q=0 gives y=zF.","Intersect that line with equilibrium."],marking:["Horizontal q-line","Correct pinch"],source:"2024/25 Q3",year:"2024/25",paperPart:"Q3",skill:"minimum reflux",difficulty:"foundation"}),Ve({id:"mx4",topic:"mccabe",kind:"short",priority:"must",marks:5,prompt:"List five labels or calculations that protect method marks on a McCabe-Thiele graph.",answer:"Square x-y axes and MVC; equilibrium curve and diagonal; xD,zF,xB; rectifying, q and stripping lines; numerical slopes/intercepts; labelled pinch if relevant; numbered stages; feed-stage switch; explicit condenser/reboiler counting convention.",hint:"Think axes, curves, lines, compositions and stage convention.",steps:["Axes/curve.","Compositions.","Lines.","Stage numbering/feed.","Equipment convention."],marking:["Any five defensible labelled items"],source:"Lec20; all three papers",year:"Current blueprint",skill:"graph execution",difficulty:"foundation"}),Ve({id:"mx5",topic:"mccabe",kind:"numeric",priority:"must",marks:3,prompt:"A staircase gives 8 theoretical stages including a partial reboiler and partial condenser. At 70% tray efficiency, how many actual column trays are required?",answer:9,tolerance:0,unit:"trays",hint:"Remove both equilibrium equipment stages before applying tray efficiency.",steps:["Theoretical column trays=8-2=6","Actual trays=ceil(6/0.70)=ceil(8.57)=9"],marking:["Remove two equipment stages","Efficiency","Round up"],source:"2022/23 B1 style",year:"2022/23",skill:"stage convention",difficulty:"standard"}),Ve({id:"mx6",topic:"mccabe",kind:"mcq",priority:"stretch",marks:2,prompt:"If a feed changes from saturated liquid to saturated vapour at fixed reflux, what must be checked first?",options:["Whether the new horizontal q-line causes a pinch","Whether xD automatically becomes one","Whether CMO disappears everywhere"],answer:"Whether the new horizontal q-line causes a pinch",hint:"The feed intersection and stripping line change.",steps:["Redraw q-line.","Check its intersection and driving force."],marking:["Pinch check","Feed-line consequence"],source:"Lec20 worked example",year:"Current blueprint",skill:"diagram diagnosis",difficulty:"standard"}),Ve({id:"mx7",topic:"mccabe",kind:"numeric",priority:"must",marks:3,prompt:"VLE data give T=440 K at x=0.54 and T=430 K at x=0.70. Estimate tray liquid temperature at x=0.62.",answer:435,tolerance:.2,unit:"K",hint:"Linearly interpolate T against liquid x.",steps:["Fraction=(0.62-0.54)/(0.70-0.54)=0.5","T=440+0.5(430-440)=435 K"],marking:["Use x column","Interpolation fraction","Temperature"],source:"2024/25 Q5(d) style",year:"2024/25",paperPart:"Q5(d)",skill:"tray temperature",difficulty:"standard"}),Ve({id:"mx8",topic:"mccabe",kind:"short",priority:"stretch",marks:4,prompt:"Explain the capital-energy trade-off when reflux ratio is increased.",answer:"Increasing reflux raises internal liquid and vapour flows, condenser/reboiler duties and operating cost. It moves operating lines toward the diagonal, increases stagewise driving force and reduces required stages, which can reduce column height. Larger flows may increase diameter and equipment duty, so an economic optimum lies between minimum reflux and total reflux.",hint:"Mention stages, energy, flows and economic optimum.",steps:["Higher internal flows.","Higher energy.","Fewer stages.","Economic/equipment trade-off."],marking:["Flow trend","Energy trend","Stage trend","Design trade-off"],source:"Lec9 reflux lecture",year:"Current blueprint",skill:"design explanation",difficulty:"stretch"}),Ve({id:"ax1",topic:"absorption",kind:"numeric",priority:"must",marks:3,prompt:"An absorber uses L/G=0.60 with He=0.40. Find the absorption factor.",answer:1.5,tolerance:.001,hint:"A=(L/G)/He.",steps:["A=0.60/0.40","A=1.50"],marking:["Equation","Substitution","Value"],source:"Lec15",year:"Current blueprint",skill:"absorption factor",difficulty:"foundation"}),Ve({id:"ax2",topic:"absorption",kind:"mcq",priority:"must",marks:2,prompt:"A Kremser calculation requires 36 ideal stages and each available column supplies 5 ideal stages. How many columns are required?",options:["8","7.2","7"],answer:"8",hint:"Equipment counts are rounded up.",steps:["36/5=7.2.","Eight complete columns are required."],marking:["Division","Round up"],source:"2024/25 Q6(b) style",year:"2024/25",paperPart:"Q6(b)",skill:"equipment count",difficulty:"foundation"}),Ve({id:"ax3",topic:"absorption",kind:"numeric",priority:"must",marks:4,prompt:"A gas enters with yB=0.030 and 98% must be removed. Find yT.",answer:6e-4,tolerance:1e-6,unit:"mole fraction",hint:"Two percent remains.",steps:["Fraction remaining=1-0.98=0.02","yT=0.030(0.02)=0.000600"],marking:["Remaining fraction","Multiplication","Value","Units/basis"],source:"2024/25 Q6",year:"2024/25",paperPart:"Q6",skill:"removal specification",difficulty:"foundation"}),Ve({id:"ax4",topic:"absorption",kind:"short",priority:"must",marks:5,prompt:"Define the absorption factor and explain its design meaning.",answer:"The absorption factor is A=L/(GHe), the absorber operating-line slope divided by the equilibrium-line slope for the dilute linear convention. It measures the relative capacity of liquid flow to carry solute. Larger A generally improves removal for a fixed number of stages; A=1 is a special Kremser limit; the definition changes if incompatible bases are used.",hint:"Equation, slope ratio, physical meaning, trend and limitation.",steps:["Give equation.","Relate two slopes.","Explain capacity.","State performance trend.","State basis/special limit."],marking:["Equation","Slope meaning","Physical meaning","Trend","Basis/limit"],source:"Lec15-Lec16",year:"Current blueprint",skill:"definition",difficulty:"standard"}),Ve({id:"ax5",topic:"absorption",kind:"numeric",priority:"must",marks:3,prompt:"For clean solvent, yB=0.020, yT=0.002 and He=0.50. Find (L/G)min.",answer:.45,tolerance:.001,hint:"At minimum xB,max=yB/He.",steps:["xB,max=0.020/0.50=0.040","(L/G)min=(0.020-0.002)/0.040=0.45"],marking:["Equilibrium outlet","Minimum-flow balance","Value"],source:"Lec16",year:"Current blueprint",skill:"minimum solvent",difficulty:"standard"}),Ve({id:"ax6",topic:"absorption",kind:"mcq",priority:"stretch",marks:2,prompt:"Which change normally improves physical absorption of a gas into a liquid?",options:["Lower temperature and higher pressure","Higher temperature and lower pressure","Lower solvent rate"],answer:"Lower temperature and higher pressure",hint:"Favour solubility and driving force.",steps:["Gas solubility usually increases with pressure and decreases with temperature."],marking:["Temperature trend","Pressure trend"],source:"2024/25 Q6(c)",year:"2024/25",paperPart:"Q6(c)",skill:"improvement",difficulty:"foundation"}),Ve({id:"ax7",topic:"absorption",kind:"short",priority:"stretch",marks:5,prompt:"Explain why solute-free ratios X and Y are used for bulk absorption.",answer:"When solute transfer is appreciable, total gas and liquid flow rates change through the column. X=x/(1-x) and Y=y/(1-y) express solute per mole of inert liquid solvent or carrier gas. Those inert carrier flows remain constant, simplifying balances and making the operating line manageable. Equilibrium and operating relations must both use the same ratio basis.",hint:"Changing totals, constant carriers, definitions and compatible axes.",steps:["State dilute-assumption problem.","Define X.","Define Y.","Explain constant carriers.","Require compatible basis."],marking:["Changing total flows","X definition","Y definition","Carrier benefit","Consistent basis"],source:"Lec17",year:"Current blueprint",skill:"bulk absorption",difficulty:"stretch"}),Ve({id:"ax8",topic:"absorption",kind:"short",priority:"stretch",marks:4,prompt:"Give four valid ways to improve removal in a fixed absorber and link each to the physics.",answer:"Increase solvent flow to raise operating slope/A; use a better solvent or lower temperature to improve equilibrium solubility; raise pressure where appropriate; improve tray efficiency or contact; reduce gas flow; or add another column/stages.",hint:"Each change needs a reason, not just a list.",steps:["Choose four valid changes.","Link each to A, equilibrium, driving force or effective stages."],marking:["One mark for each linked change, maximum four"],source:"2022/23 B2(c); 2024/25 Q6(c)",year:"2024/25",skill:"design strategy",difficulty:"standard"})],i3=[et("vle","vfx1","Ideal flash K-value","Ki=Pi*/P."),et("vle","vfx2","Flash vapour fraction symbol","beta=V/F; q=1-beta is liquid fraction."),et("vle","vfx3","Flash trial composition","xi=zi/[1+beta(Ki-1)]."),et("vle","vfx4","Positive flash residual","Increase beta within a bracketed root search."),et("vle","vfx5","All Ki > 1","Feed tends to a single vapour phase."),et("vle","vfx6","All Ki < 1","Feed tends to a single liquid phase."),et("vle","vfx7","Five-mark definition recipe","Definition, equation, sketch and useful consequence."),et("distillation","dfx1","Side-draw external balance","F=D+B+S."),et("distillation","dfx2","Liquid below a saturated-liquid side draw","Lbelow=L-S."),et("distillation","dfx3","Below-draw operating balance","Vy=(L-S)x+DxD+SxS."),et("distillation","dfx4","Boilup ratio","Vprime/B in the course notation."),et("distillation","dfx5","Trouton scale","DeltaHvap/Tb is roughly 85-88 J mol-1 K-1 for many liquids."),et("distillation","dfx6","Batch distillation state","Unsteady; still amount and composition change with time."),et("distillation","dfx7","Where CMO flows can change","At a feed, side draw, condenser/reboiler or added heat duty."),et("mccabe","mfx1","Saturated-vapour pinch","Horizontal q-line y=zF intersects equilibrium."),et("mccabe","mfx2","Rmin from limiting intercept b","Rmin=xD/b-1."),et("mccabe","mfx3","Partial condenser as a stage","Yes if it creates an equilibrium composition change."),et("mccabe","mfx4","Two partial equipment stages","Remove both before applying tray efficiency."),et("mccabe","mfx5","Higher reflux","Fewer stages but larger internal flows and duties."),et("mccabe","mfx6","Tray temperature","Interpolate T against liquid x."),et("absorption","afx1","Kremser design unknown","Required ideal stages."),et("absorption","afx2","Kremser rating unknown","Outlet/removal or flow for fixed equipment."),et("absorption","afx3","A=1 clean-solvent limit","yT/yB=1/(N+1)."),et("absorption","afx4","Required equipment count","Nrequired/Nper-column, rounded up."),et("absorption","afx5","Bulk coordinates","X=x/(1-x), Y=y/(1-y)."),et("absorption","afx6","Minimum-flow physical meaning","Pinch, zero local driving force and infinite stages.")],n3=[{group:"Flash - understand",name:"K-value",latex:String.raw`K_i=P_i^*/P,\quad y_i=K_ix_i`,use:"Build an ideal fixed-T,P flash."},{group:"Flash - understand",name:"Rachford-Rice",latex:String.raw`\sum_i\frac{z_i(K_i-1)}{1+\beta(K_i-1)}=0`,use:"Iterate vapour fraction beta=V/F."},{group:"Distillation - derive",name:"q from enthalpy",latex:String.raw`q=\frac{H_V-H_F}{H_V-H_L}`,use:"Classify the thermal condition of feed."},{group:"Distillation - derive",name:"Liquid side-draw line",latex:String.raw`y=\frac{L-S}{V}x+\frac{Dx_D+Sx_S}{V}`,use:"Rectifying section below a saturated-liquid side draw."},{group:"Distillation - recall",name:"Trouton rule",latex:String.raw`\Delta H_{vap}/T_b\approx85\text{-}88\;\mathrm{J\,mol^{-1}\,K^{-1}}`,use:"Approximate latent-heat similarity behind CMO."},{group:"McCabe - understand",name:"Minimum reflux from slope",latex:"R_{min}=m/(1-m)",use:"Limiting rectifying line through pinch and (xD,xD)."},{group:"McCabe - understand",name:"Overall tray efficiency",latex:"E_o=N_{ideal,trays}/N_{actual,trays}",use:"Remove equilibrium equipment stages, divide, then round up."},{group:"Absorption - provided",name:"Kremser design (clean solvent)",latex:String.raw`N=\frac{\log[1+(A-1)y_B/y_T]}{\log A}-1`,use:"Required ideal stages; use the A=1 limit separately."},{group:"Absorption - derive",name:"Minimum solvent ratio",latex:String.raw`(L/G)_{min}=\frac{y_B-y_T}{y_B/H_e-x_T}`,use:"Bottom pinch for linear equilibrium."},{group:"Absorption - understand",name:"Stripping factor",latex:"S=GH_e/L=1/A",use:"Reverse-transfer analogue on the same dilute basis."},{group:"Score conversion",name:"Raw mark normalisation",latex:String.raw`\%=100\times\mathrm{raw\ score}/105`,use:"Current revision deck totals 105 raw marks."}],pl="/SEPARATION%20PROCESSES%201%20AND%20HYSYS%20(ENG2111)%20-%20SEMR1%2020256%20-%20812026%20-%201104%20PM/",P0=[{id:"paper-22-23",year:"2022/23",title:"Definitions, full McCabe and absorber rating",structure:"Eight 5-mark definitions followed by a 40-mark VLE/distillation construction and a 20-mark absorber problem.",sourceHref:`${pl}ENG2111_22-23%20exam%20paper.pdf`,solutionHref:`${pl}ENG2111%20Exam%2022-23%20numerical%20solution.docx`,sections:[{title:"Section A definition sprint",marks:40,focus:"CMO, relative volatility, stripping factor, Kremser, Trouton, Raoult, total reflux and boilup.",modelAnswer:"CMO means liquid and vapour molar flow rates remain approximately constant within a column section, producing straight operating lines. Relative volatility is alpha=KA/KB and measures ease of separation. Stripping factor is S=GHe/L=1/A. Kremser equations relate stage number, absorption/stripping factor and terminal compositions for dilute linear equilibrium. Trouton gives approximately constant entropy of vaporisation for similar liquids, supporting similar latent heats and CMO. Raoult gives pi=xi pi*. At total reflux D=B=0 and operating lines lie on y=x, giving minimum stages. State the lecturer notation for boilup, Vprime/B.",method:["Use definition-equation-sketch-consequence.","Cap each term near five minutes."]},{title:"Section B1 VLE and distillation",marks:40,focus:"Constant-alpha curve, flash lever rule, external balances, q-line, McCabe stages and efficiency.",modelAnswer:"Generate equilibrium points with y=alpha x/[1+(alpha-1)x], draw the diagonal and use a horizontal flash tie-line; the supplied numerical route gives x=0.48 and y=0.78. Solve F=D+B and FzF=DxD+BxB to obtain D=73 and B=42 kmol/h. Draw the correct q-line and both operating lines, step visibly, then state whether partial condenser/reboiler stages were counted. Remove non-tray equilibrium equipment before dividing ideal tray stages by efficiency and rounding up; the official convention gives five real plates.",method:["Plot sample calculations first.","State partial condenser/reboiler stage convention before efficiency."]},{title:"Section B2 absorber rating",marks:20,focus:"Convert real trays to ideal, test an operating solvent rate and propose improvements.",modelAnswer:"Write RATING because the equipment is known. Convert real trays to ideal stages with Nideal=Eo Nreal, calculate A=L/(GHe), then use the clean-solvent Kremser rating relation to obtain the outlet composition; the supplied key gives xB=0.00026 on its stated basis. Improve performance by increasing L, reducing G, lowering He with a better solvent/lower temperature, raising pressure where appropriate, or increasing tray/contact efficiency, and link every proposal to A, solubility or effective stages.",method:["Write RATING at the top.","Use the official equipment basis."]}],officialChecks:["Flash x=0.48 and y=0.78","D=73 and B=42 kmol/h","Five real plates in the official convention","Absorber outlet liquid xB=0.00026"]},{id:"paper-23-24",year:"2023/24",title:"Minimum reflux, internal flows and iterative flash",structure:"Eight definitions followed by one 40-mark distillation construction and one 20-mark Antoine/flash calculation.",sourceHref:`${pl}Eng2111%20exam_23-24.pdf`,solutionHref:`${pl}ENG2111%20Exam%2023-24%20numerical%20solution.docx`,sections:[{title:"Section A definition sprint",marks:40,focus:"Operating line, reflux, Nmin, azeotrope, Raoult, ternary plot, batch operation and CMO consequence.",modelAnswer:"An operating line is a section material-balance relationship between leaving vapour y and liquid x. Reflux is condensed overhead returned to the column and R=L/D. Nmin occurs at total reflux. At an azeotrope x=y, so equilibrium stages provide no enrichment. Raoult is pi=xi pi*. A ternary point represents three fractions summing to one. Batch distillation starts from a finite charge with no steady feed and changing still composition. Under CMO, L and V are constant inside a section and operating lines are straight.",method:["Give five marking points per term.","Use a small labelled sketch when helpful."]},{title:"Section B1 full column design",marks:40,focus:"Product balances, graphical Rmin, two-times-Rmin construction, theoretical stages and internal flows.",modelAnswer:"Balances give D=78 and B=42 kmol/h. Draw equilibrium and diagonal, locate the q-line pinch, join the pinch to (xD,xD), and obtain Rmin=0.5 from limiting-line slope m=Rmin/(Rmin+1). Use R=2Rmin, draw the actual rectifying and stripping lines, then step seven theoretical stages and mark the feed switch. With R=1, top flows are L=78 and V=156 kmol/h; apply the feed condition to obtain bottom L=198 and V=156 kmol/h.",method:["Calculate D/B and R before drawing.","Show all three lines and the feed switch."]},{title:"Section B2 Antoine and flash",marks:20,focus:"Boiling range, pressure effect, relative volatility and three flash iterations.",modelAnswer:"Solve the Antoine equation in the units printed on the paper to obtain the pure-component boiling limits 381.6 K and 491.0 K. Calculate Ki=Pi*/P and alpha=KA/KB, approximately 2.3. For the flash, choose beta=V/F trials, evaluate the Rachford-Rice residual sum[zi(Ki-1)/(1+beta(Ki-1))], tabulate each residual, bracket a sign change and interpolate or propose the next trial. Finish with 0<=beta<=1 and composition-sum checks.",method:["Copy Antoine units exactly.","Show a three-row iteration table and propose the fourth trial."]}],officialChecks:["D=78 and B=42 kmol/h","Rmin=0.5","Seven theoretical stages","Top L=78, V=156; bottom L=198, V=156 kmol/h","Boiling range 381.6-491.0 K; alpha about 2.3"]},{id:"paper-24-25",year:"2024/25",title:"Txy, derivations, McCabe and absorber design",structure:"Six compulsory questions totalling 100 marks, with less definition recall and more derivation/design.",sourceHref:`${pl}ENG2111%2024-25%20main%20exam.pdf`,solutionHref:`${pl}ENG2111%20Exam%2024-25%20numerical%20solution.docx`,sections:[{title:"Q1-Q2 VLE and flash",marks:20,focus:"Construct and label a Txy plot, then interpret equilibrium, azeotrope and flash quality.",modelAnswer:"At fixed pressure solve P=sum xi Pi*(T) for bubble temperatures, then calculate yi=xi Pi*/P and plot matching T-x and T-y points. Label liquid below the bubble curve, vapour above the dew curve and L+V between. Draw a horizontal tie-line to read equilibrium x and y, place z between them and calculate V/F=(z-x)/(y-x). At an azeotrope x=y and the separation driving force vanishes.",method:["Show one complete Raoult/Dalton row.","Label pure boiling points and all phase regions."]},{title:"Q3-Q4 reflux and derivations",marks:30,focus:"Graphical Rmin for saturated vapour and operating-line derivations with a liquid side draw.",modelAnswer:"For saturated vapour q=0, draw the horizontal q-line at y=zF; its equilibrium intersection is the pinch used for the limiting rectifying line and Rmin. For a saturated-liquid side draw S, above the draw Vy=Lx+DxD. Below it the descending liquid is L-S and Vy=(L-S)x+DxD+SxS. At a saturated-liquid feed, Lprime=L-S+F and Vprime=V; below the feed Vprime y=Lprime x-BxB. State each control volume and stream direction.",method:["Use the horizontal q-line for q=0.","Draw separate control volumes for each side-draw section."]},{title:"Q5 McCabe design",marks:30,focus:"Balances, supplied VLE table, stage/feed count, efficiency and tray temperature.",modelAnswer:"The official checkpoints are F=29667 and B=14667 mol/h. Plot the supplied x-y equilibrium data, diagonal, rectifying line, q-line and stripping line, then step four theoretical stages with the feed on stage 2. State the partial-equipment convention before applying efficiency; the official basis gives five actual plates. For tray temperature, use the tray liquid x on the supplied T-x data and interpolate to 430 K.",method:["Use x-y columns for equilibrium and T-x for tray temperature.","Separate equipment stages from actual trays."]},{title:"Q6 absorber design",marks:20,focus:"Minimum oil, Kremser stage requirement, available columns and improvement strategy.",modelAnswer:"Write DESIGN. Convert the outlet specification, use y=He x and the limiting bottom pinch to calculate minimum oil flow, 294 mol/h on the official basis. Choose the stated multiple above minimum, calculate A=L/(GHe), and solve the design-form Kremser equation for required ideal stages. The official continuous result is 7.3 available five-stage columns before equipment rounding, so round the number of columns upward. Link improvements to higher A, lower He, greater pressure/lower temperature or more effective stages.",method:["Write DESIGN at the top.","Round equipment count up and link improvements to A or solubility."]}],officialChecks:["F=29667 and B=14667 mol/h","Four theoretical stages, feed stage 2","Five actual plates","Tray temperature 430 K","Minimum oil 294 mol/h","7.3 five-stage columns before rounding"]}],mf=[{id:"mock-35",duration:35,title:"35-minute rescue drill",subtitle:"Four first-move questions; stop any blank-page panic.",totalMarks:30,questions:[{number:"1",topic:"vle",marks:7,title:"Build one equilibrium row",prompt:"For alpha=3 and xA=0.40, calculate yA, sketch the equilibrium point and identify the MVC-rich phase.",marking:["State the constant-alpha equation","Substitute alpha and xA","Obtain yA=0.667","Plot and label (0.40,0.667)","State that vapour is richer in MVC"],modelAnswer:"Using constant relative volatility, yA=alpha xA/[1+(alpha-1)xA]=3(0.40)/[1+2(0.40)]=0.667. Plot (xA,yA)=(0.40,0.667) above the diagonal. Because yA>xA, the equilibrium vapour is enriched in the more volatile component A.",workedSteps:["Write y=alpha x/[1+(alpha-1)x].","Substitute alpha=3 and x=0.40.","Calculate numerator 1.20 and denominator 1.80.","Report yA=0.667 and plot the labelled point.","Interpret yA>xA as MVC enrichment in the vapour."]},{number:"2",topic:"distillation",marks:8,title:"Balances and line",prompt:"For F=120, zF=0.65, xD=0.95, xB=0.10 and R=1, calculate D, B, L, V and the rectifying-line equation.",marking:["Overall and component balances","D=77.65 and B=42.35 kmol/h","L=77.65 and V=155.29 kmol/h","Rectifying slope 0.5","Intercept 0.475 and units"],modelAnswer:"Overall and MVC balances give D=77.65 kmol/h and B=42.35 kmol/h. With R=L/D=1, L=77.65 kmol/h and V=L+D=155.29 kmol/h. The rectifying line is y=[R/(R+1)]x+xD/(R+1)=0.500x+0.475.",workedSteps:["Use F=D+B and FzF=DxD+BxB.","D=120(0.65-0.10)/(0.95-0.10)=77.65 kmol/h.","B=120-77.65=42.35 kmol/h.","L=RD=77.65 and V=L+D=155.29 kmol/h.","Substitute R=1 and xD=0.95 into the rectifying-line equation."]},{number:"3",topic:"mccabe",marks:7,title:"Construction order",prompt:"From a blank square graph, list and sketch the complete McCabe construction order for saturated-liquid feed.",marking:["Square labelled axes, diagonal and equilibrium curve","xD, zF and xB identified","Rectifying line and vertical q-line","Stripping line through the intersection and xB","Correct staircase switch and count"],modelAnswer:"Draw a square x-y graph, the 45-degree diagonal and the equilibrium curve. Mark xD, zF and xB. Draw the rectifying line through (xD,xD), then the saturated-liquid q-line vertically at x=zF. Join the rectifying/q-line intersection to (xB,xB) for the stripping line. Step horizontally to equilibrium and vertically to the active operating line, switching at the q-line intersection, and state the condenser/reboiler counting convention.",workedSteps:["Label x (liquid MVC fraction) and y (vapour MVC fraction), both 0 to 1.","Draw y=x and the equilibrium curve.","Place the product/feed compositions on the diagonal.","Draw rectifying line, vertical q-line, then stripping line.","Step from xD, switch operating line at the feed intersection, and finish at xB.","Count stages and explicitly say whether partial equipment stages are included."]},{number:"4",topic:"absorption",marks:8,title:"Minimum solvent",prompt:"For yB=0.03, yT=0.003, xT=0 and He=0.50, find (L/G)min and explain why it is not a usable design rate.",marking:["Use bottom pinch at minimum flow","Find xB,max=0.060","Write the solute balance","Obtain (L/G)min=0.45","Explain zero driving force/infinite stages"],modelAnswer:"At minimum solvent flow the bottom is pinched, so xB,max=yB/He=0.03/0.50=0.060. The dilute solute balance gives (L/G)min=(yB-yT)/(xB,max-xT)=(0.030-0.003)/(0.060-0)=0.45. This is a limiting value, not a design rate: the bottom driving force is zero and infinitely many ideal stages would be required.",workedSteps:["Write the linear equilibrium relation y=He x.","At the bottom pinch, calculate xB,max=yB/He=0.060.","Use G(yB-yT)=L(xB-xT).","Calculate (L/G)min=0.027/0.060=0.45.","State pinch, zero local driving force and infinite-stage consequence."]}]},{id:"mock-60",duration:60,title:"60-minute mixed paper",subtitle:"One graphical half and one design half.",totalMarks:50,questions:[{number:"1",topic:"mccabe",marks:30,title:"Complete binary column construction",prompt:"Use alpha=2.5, F=100, zF=0.50, xD=0.95, xB=0.05, q=1 and R=2. Calculate flows, construct all lines, step stages, identify the feed stage and convert to actual trays at 70% efficiency.",marking:["D=50 and B=50 kmol/h","Equilibrium curve and diagonal","Rectifying line y=0.667x+0.317","Vertical q-line and stripping line y=1.333x-0.0167","Approximately 11 ideal stages with feed near stage 5","Clearly stated equipment-stage convention","15 actual trays if one partial reboiler is excluded before applying 70% efficiency"],modelAnswer:"Balances give D=B=50 kmol/h. Above the feed, L=RD=100 and V=L+D=150 kmol/h, so y=0.667x+0.3167. For q=1 the q-line is vertical at x=0.50 and meets the rectifying line at (0.50,0.650). The stripping line through that point and (0.05,0.05) is y=1.333x-0.0167. A constant-alpha staircase gives about 11 ideal stages and a feed switch near stage 5. If those 11 include one partial reboiler, the ideal tray section is 10 stages and Nactual=ceil(10/0.70)=15 trays.",workedSteps:["Solve D=F(zF-xB)/(xD-xB)=50; B=50 kmol/h.","Use L=RD=100 and V=L+D=150 kmol/h.","Plot y*=2.5x/[1+1.5x] and y=x.","Draw y=0.667x+0.3167 and the vertical q-line x=0.50.","Join (0.50,0.650) to (0.05,0.05) for the stripping line.","Step about 11 ideal stages, switching near stage 5.","State the equipment convention, remove one partial reboiler, divide 10 by 0.70 and round up to 15 trays."]},{number:"2",topic:"absorption",marks:20,title:"Rate and improve an absorber",prompt:"A nine-ideal-stage absorber has yB=0.005, clean solvent, L=50, G=130 and He=0.21. Calculate A and rated yT, then explain two improvements.",marking:["A=1.832","Correct fresh-solvent Kremser rating equation","yT approximately 9.8×10^-6","Interpret very high predicted removal","Two improvements linked to A, equilibrium or effective stages"],modelAnswer:"This is a rating problem because the nine ideal stages already exist. A=L/(GHe)=50/[130(0.21)]=1.832. For clean solvent, yT/yB=(A-1)/(A^(N+1)-1), so yT=0.005(1.832-1)/(1.832^10-1)≈9.8×10^-6. Improvements include increasing L or reducing G to raise A, selecting a more soluble solvent/lowering temperature to reduce He, or improving contact efficiency so the equipment supplies more ideal stages.",workedSteps:["Write RATING and calculate A=1.832.","Use N=9 in yT/yB=(A-1)/(A^(N+1)-1).","Calculate the remaining fraction at A=1.832.","Multiply by yB=0.005 to obtain yT≈9.8×10^-6.","Link each proposed improvement to A, He, driving force or effective ideal stages."]}]},{id:"mock-120",duration:120,title:"Predicted August-resit mock",subtitle:"Current four-block blueprint; 105 raw marks normalised to a percentage.",totalMarks:105,questions:[{number:"1",topic:"vle",marks:25,title:"Construct and interpret binary equilibrium",prompt:"From supplied-style vapour-pressure information, explain and demonstrate construction of a constant-pressure Txy diagram. Include bubble/dew curves, phase regions, tie-lines, one Raoult/Dalton calculation, flash quality and the physical iteration check.",marking:["Find pure-component boiling limits at the specified pressure","Show at least one bubble-point Raoult calculation","Use Dalton to obtain the matching vapour composition","Draw and label bubble/dew curves and all phase regions","Use a horizontal tie-line and lever rule correctly","State K-value/flash physical checks and an iteration residual"],modelAnswer:"At the fixed pressure, first solve Pi*(T)=P for each pure-component boiling point. For each chosen liquid composition xA, find the bubble temperature from P=xA PA*(T)+(1-xA)PB*(T), then calculate yA=xA PA*(T)/P. Plot bubble points as T against x and the matching dew points as T against y. The region below the bubble curve is liquid, above the dew curve is vapour, and between them is liquid+vapour. A horizontal tie-line joins equilibrium x and y; for overall z between them, V/F=(z-x)/(y-x) and L/F=(y-z)/(y-x). For a fixed-T,P flash use Ki=Pi*/P and test the Rachford-Rice residual: a two-phase root normally requires an appropriate sign change with at least one K above one and one below one.",workedSteps:["Calculate or identify the two pure boiling temperatures.","Choose xA values and solve the bubble-pressure equation for T.","Calculate matching yA values with Dalton/Raoult.","Plot T-x bubble and T-y dew curves and label liquid, L+V and vapour regions.","Draw a horizontal tie-line and apply the lever rule on the correct segments.","For iteration, compute K values, bracket beta=V/F and drive the residual to zero."]},{number:"2",topic:"distillation",marks:25,title:"Derive every active operating section",prompt:"For a CMO binary column with a saturated-liquid feed and an intermediate saturated-liquid side draw, derive the operating relationships above the draw, below the draw and below the feed. Define reflux, boilup, CMO and both limiting reflux conditions.",marking:["Label independent control volumes and stream directions","Derive top line Vy=Lx+DxD","Derive below-draw line Vy=(L-S)x+DxD+SxS","Apply saturated-liquid feed changes Lprime=L-S+F and Vprime=V","Derive stripping line Vprime y=Lprime x-BxB","Define R=L/D and the boilup ratio on the stated course basis","Explain total-reflux and minimum-reflux limits"],modelAnswer:"Above the liquid side draw, a total and MVC balance gives V=L+D and Vy=Lx+DxD, hence y=(L/V)x+DxD/V. The saturated-liquid draw removes S from the descending liquid, so below it Ls=L-S while V is unchanged; the MVC balance is Vy=(L-S)x+DxD+SxS. At a saturated-liquid feed q=1, Lprime=Ls+F and Vprime=V. Below the feed, Vprime y=Lprime x-BxB, or y=(Lprime/Vprime)x-BxB/Vprime. Reflux ratio is R=L/D; use the lecturer’s stated Vprime/B convention for boilup. At total reflux D=B=0 and operating lines coincide with the diagonal, giving minimum stages. At minimum reflux a pinch gives zero driving force and infinitely many stages.",workedSteps:["Draw one control volume for each constant-flow section.","Use V=L+D above the draw and derive the ordinary rectifying line.","Withdraw saturated liquid S: Ls=L-S and retain the SxS solute term.","At q=1 add the full feed to liquid: Lprime=Ls+F; keep Vprime=V.","Use a fresh bottom control volume to derive the stripping line.","Finish with precise reflux, boilup, total-reflux and minimum-reflux definitions."]},{number:"3",topic:"mccabe",marks:30,title:"Perform a full McCabe-Thiele design",prompt:"Use alpha=2.5, F=100 kmol/h, zF=0.50, xD=0.95, xB=0.05, saturated-liquid feed and R=2. Calculate D/B, construct all lines, step stages, state feed stage and convert to actual trays at 70% efficiency.",marking:["D=50 and B=50 kmol/h","Correct constant-alpha equilibrium curve and diagonal","Rectifying line y=0.667x+0.317","Vertical q-line and stripping line y=1.333x-0.0167","Approximately 11 ideal stages and feed near stage 5","Explicit partial-equipment convention","15 actual trays if one equipment stage is excluded"],modelAnswer:"D=B=50 kmol/h. With R=2, L=100 and V=150 kmol/h, giving y=0.667x+0.3167. The q-line is vertical at x=0.50 and intersects at y=0.650. The stripping line through (0.50,0.650) and (0.05,0.05) is y=1.333x-0.0167. Stepping against y*=2.5x/[1+1.5x] gives about 11 ideal stages with the feed switch near stage 5. If one counted stage is a partial reboiler, ten ideal tray stages require ceil(10/0.70)=15 actual trays.",workedSteps:["Complete overall/MVC balances.","Calculate internal top flows from R.","Draw equilibrium curve, diagonal and compositions.","Draw rectifying line, vertical q-line and stripping line.","Step stages and identify the first switch below the feed intersection.","State what was counted, remove the partial equipment stage, divide by efficiency and round up."]},{number:"4",topic:"absorption",marks:25,title:"Design, rate and improve",prompt:"A gas with yB=0.030 must leave at yT=0.0006 using clean solvent with He=0.50. Find minimum L/G, choose 1.5 times minimum, determine the Kremser stage requirement and propose defensible improvements if only five-stage columns are available.",marking:["Recognise 98% removal","Bottom-pinch xB,max=0.060","(L/G)min=0.490","Operating L/G=0.735 and A=1.470","Kremser requirement 7.30, rounded to 8 ideal stages","Two five-stage columns in series","Improvements linked to A, He, pressure, temperature or efficiency"],modelAnswer:"The remaining fraction is yT/yB=0.0006/0.030=0.02, so removal is 98%. At minimum flow xB,max=yB/He=0.060 and (L/G)min=(0.030-0.0006)/0.060=0.490. Choose L/G=1.5(0.490)=0.735, giving A=(L/G)/He=1.470. For clean solvent, N=log[1+(A-1)yB/yT]/log A-1=7.30, so eight ideal stages are required. Five stages are insufficient; two five-stage columns in series provide ten ideal stages. Alternatives include increasing solvent rate, reducing gas rate, using a better solvent/lower He, lowering temperature, increasing pressure where appropriate, or improving contact efficiency.",workedSteps:["Convert the outlet specification to 98% removal.","Use the bottom pinch to calculate xB,max.","Calculate minimum L/G=0.490, then operating L/G=0.735.","Calculate A=0.735/0.50=1.470.","Substitute into the clean-solvent Kremser design equation to get N=7.30.","Round stages and equipment up: eight ideal stages and two five-stage columns.","Link each improvement to absorption factor, solubility, driving force or effective stages."]}]}],l3=["v4","v5","vx1","vx5","d1","d4","dx1","dx7","m1","m2","mx3","mx5","a2","a3","ax1","ax3"],kn=[...J5,...t3],Ua=[...I5,...a3],ff=[...$5,...i3],pf=[...P5,...n3],Yt=({children:r,...i})=>o.jsx("svg",{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"1.8",strokeLinecap:"round",strokeLinejoin:"round","aria-hidden":"true",...i,children:r}),vf=r=>o.jsxs(Yt,{...r,children:[o.jsx("path",{d:"M4 18a8 8 0 1 1 16 0"}),o.jsx("path",{d:"m12 14 4-4"}),o.jsx("path",{d:"M7 18h10"})]}),r3=r=>o.jsxs(Yt,{...r,children:[o.jsx("path",{d:"M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5z"}),o.jsx("path",{d:"M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"})]}),s3=r=>o.jsxs(Yt,{...r,children:[o.jsx("path",{d:"M9 3h6l1 3H8z"}),o.jsx("path",{d:"M6 6h12v15H6z"}),o.jsx("path",{d:"m9 13 2 2 4-5"})]}),o3=r
