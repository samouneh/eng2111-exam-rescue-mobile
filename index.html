e the equilibrium slope He; and improve tray efficiency or add stages/contact area. Each change increases liquid carrying capacity, improves equilibrium/operating driving force or supplies more ideal stages.",method:["Choose one flow change: increase L or reduce G, then say this raises A.","Choose one equilibrium change: better solvent, lower temperature or higher pressure, then say this reduces He / improves solubility.","Choose one equipment change: improve efficiency or add stages, then say this increases effective ideal contacts."],marking:["First linked improvement","Second linked improvement","Third linked improvement"]}],officialChecks:["Key: flash graph reads x about 0.48 and y about 0.78; algebra gives x=0.463 and y=0.775","D=73 and B=42 kmol/h after sensible rounding","Five real plates on the supplied equipment-count convention","Absorber verdict: No; saturated liquid xB about 0.00024 (key prints 0.00026)"]},{id:"paper-23-24",year:"2023/24",title:"Minimum reflux, internal flows and iterative flash",structure:"Eight definitions followed by one 40-mark distillation construction and one 20-mark Antoine/flash calculation.",sourceHref:`${pr}Eng2111%20exam_23-24.pdf`,solutionHref:`${pr}ENG2111%20Exam%2023-24%20numerical%20solution.docx`,sections:[{title:"A1 · Top operating line",marks:5,focus:"Define the rectifying operating line and show where its slope/intercept come from.",modelAnswer:"The top or rectifying operating line is the component-balance relationship between vapour y and liquid x in the column section above the feed. For a total condenser under CMO, V=L+D and Vy=Lx+DxD. Therefore y=(L/V)x+(D/V)xD=[R/(R+1)]x+xD/(R+1), where R=L/D. It passes through (xD,xD), and changing reflux changes its slope and intercept.",method:["Draw a control volume around the top section and total condenser.","Write total balance V=L+D.","Write MVC balance Vy=Lx+DxD.","Divide by V and substitute R=L/D.","State slope R/(R+1), intercept xD/(R+1) and point (xD,xD)."],marking:["Control volume","Total balance","Component balance","Equation in R form","Graph features"]},{title:"A2 · Reflux ratio",marks:5,focus:"Define reflux physically and mathematically and state the design trade-off.",modelAnswer:"Reflux is the part of the condensed overhead liquid returned to the top tray. The reflux ratio is R=L/D, where L is returned liquid and D is distillate product. Increasing R raises internal L and V, condenser/reboiler duty and operating cost, but moves operating lines toward the diagonal and usually reduces the required stages. Rmin gives infinite stages; total reflux gives minimum stages but no product.",method:["Define returned condensed liquid.","Write R=L/D and define L and D.","State that higher R raises internal flows and energy duty.","State that higher R usually reduces stage count.","Place practical operation between Rmin and total reflux."],marking:["Physical definition","Equation/symbols","Flow trend","Stage/energy trade-off","Limits"]},{title:"A3 · Minimum number of stages",marks:5,focus:"State the operating condition for Nmin and explain the graph.",modelAnswer:"The minimum number of theoretical stages Nmin occurs at total reflux. At total reflux D=B=0, all condensed overhead is returned, and both operating lines coincide with the diagonal y=x. This maximises separation per ideal stage, so the McCabe staircase reaches the product specifications in the fewest steps. The energy and internal flows are limiting/high and no net product is withdrawn.",method:["Name the condition: total reflux.","State D=B=0 and all condensate returned.","State that operating lines lie on y=x.","Explain maximum stagewise separation and minimum staircase count.","State that it is a limiting, non-producing condition."],marking:["Total reflux","No products","Diagonal lines","Minimum-stage explanation","Limit consequence"]},{title:"A4 · Azeotrope",marks:5,focus:"Define x=y and explain the distillation limit.",modelAnswer:"An azeotrope is a mixture composition at which the equilibrium vapour and liquid have the same composition, x=y. On an x-y plot the equilibrium curve crosses the diagonal; on a Txy plot the bubble and dew curves meet at an internal temperature extremum. Relative volatility is effectively one at that composition, so an equilibrium stage gives no enrichment and ordinary distillation cannot cross the azeotropic composition.",method:["Define the equality x=y.","Identify the x-y diagonal crossing.","Identify the Txy bubble/dew meeting point.","State alpha=1 / no composition driving force.","State the ordinary-distillation separation limit."],marking:["Definition","x-y feature","Txy feature","No enrichment","Separation consequence"]},{title:"A5 · Raoult’s law",marks:5,focus:"State and combine Raoult and Dalton for an ideal mixture.",modelAnswer:"For an ideal liquid mixture, p_i=x_i p_i*(T). Dalton’s law gives P=sum p_i and y_i=p_i/P, so y_i=x_i p_i*/P. Here x_i and y_i are liquid and vapour mole fractions, p_i* is pure-component vapour pressure and P is total pressure. The relation assumes an ideal liquid phase and is most accurate for similar molecules.",method:["Write p_i=x_i p_i*.","Define partial pressure, liquid fraction and saturated vapour pressure.","Sum partial pressures to obtain total P.","Calculate y_i=p_i/P.","State the ideal-mixture limitation."],marking:["Raoult equation","Symbols","Dalton sum","Vapour composition","Assumption"]},{title:"A6 · Ternary phase diagram",marks:5,focus:"Explain how three compositions are represented and read.",modelAnswer:"A ternary phase diagram represents the compositions of a three-component mixture in an equilateral triangle. Each vertex is one pure component, the opposite side contains zero of that component, and lines parallel to a side give constant composition. At every point xA+xB+xC=1. In a two-phase region a tie-line joins equilibrium phase compositions, and the lever rule gives their relative amounts.",method:["State that three-component composition is plotted in a triangle.","Label each vertex as 100% of one component.","Explain that the opposite edge is 0% of that component.","State xA+xB+xC=1 and how parallel grid lines are read.","Mention tie-lines and lever rule in a two-phase region."],marking:["Triangle meaning","Vertices","Edges/grid","Sum constraint","Tie-line/lever rule"]},{title:"A7 · Batch distillation",marks:5,focus:"Define batch operation and contrast it with a continuous column.",modelAnswer:"Batch distillation begins with a finite liquid charge in a still, normally with no continuous feed. Vapour or distillate is withdrawn with time, so the liquid holdup falls and its composition and boiling temperature change; the process is unsteady. Continuous distillation instead has ongoing feed and products and is designed around approximately steady flows and compositions.",method:["State finite initial charge.","State no steady continuous feed.","State distillate is removed over time.","State liquid amount/composition/temperature change with time.","Contrast with steady continuous feed and products."],marking:["Charge","Feed mode","Time-dependent withdrawal","Changing still state","Continuous contrast"]},{title:"A8 · Consequence of CMO",marks:5,focus:"Explain exactly what CMO changes on McCabe-Thiele axes.",modelAnswer:"Under constant molar overflow, the internal liquid and vapour molar flows L and V are constant within each section of the column. Therefore L/V is constant, so the material-balance operating relationships are straight lines on the McCabe-Thiele plot. Their slopes and intercepts change only when a feed, side stream or heat duty creates a new constant-flow section. CMO does not mean L=V.",method:["State constant L and V within a section.","Explain that L/V is therefore constant.","Connect constant coefficients to straight operating lines.","State that a feed/side draw can create a different line.","Reject the common error: constant flows does not mean L equals V."],marking:["Constant flows","Section qualification","Constant ratio","Straight lines","Boundary/error clarification"]},{title:"B1(a-c) · Equilibrium curve, products and column sketch",marks:14,focus:"Use alpha=3, F=120, zF(A)=0.65, xD=0.95 and xB(A)=0.10.",modelAnswer:"Plot y=3x/[1+2x] with sample calculations and the diagonal. Convert the feed statement from 35% B to zF(A)=0.65 and the bottoms from 90% B to xB(A)=0.10. Product balances give D=120(0.65-0.10)/(0.95-0.10)=77.65 approximately 78 kmol/h and B=120-D=42.35 approximately 42 kmol/h. The sketch must show feed F,zF, top D,xD, bottom B,xB, condenser, reflux and reboiler.",method:["Write the constant-alpha equation y=alpha x/[1+(alpha-1)x].","For example, at x=0.50: y=1.5/[1+1]=0.75; show several points and draw a smooth curve.","Convert B fractions to A fractions before balancing: zF=1-0.35=0.65 and xB=1-0.90=0.10.","Write F=D+B and FzF=DxD+BxB.","Use D=F(zF-xB)/(xD-xB).","Substitute D=120(0.65-0.10)/(0.95-0.10)=77.65 kmol/h.","Calculate B=120-77.65=42.35 kmol/h.","Draw and label all external streams and auxiliary condenser/reboiler units."],marking:["Equilibrium equation/sample values","Labelled curve and diagonal","Composition conversions","Two balances","D and B","Complete column sketch"]},{title:"B1(d-g) · Rmin, working reflux, stages and internal flows",marks:26,focus:"Use saturated-liquid feed, graphical Rmin=0.5 and operation at twice minimum reflux.",modelAnswer:"For q=1, draw the vertical feed line x=zF=0.65. Its equilibrium intersection is the pinch. Join the pinch to (xD,xD); the limiting-line slope gives Rmin=m/(1-m)=0.5. The operating reflux is R=2Rmin=1.0. Draw y=0.5x+0.475, the q-line and the stripping line through their intersection and (0.10,0.10), then step seven theoretical stages. Top flows are L=RD=78 and V=L+D=156 kmol/h. Saturated-liquid feed adds fully to liquid, so bottom Lprime=L+F=198 and Vprime=V=156 kmol/h.",method:["Draw the vertical q-line x=0.65 because q=1.","Locate its intersection with the equilibrium curve and label it pinch P.","Draw the limiting rectifying line from P to (0.95,0.95), measure m, then calculate Rmin=m/(1-m)=0.5.","Set the actual reflux R=2(0.5)=1.0.","Calculate rectifying line y=[1/(1+1)]x+0.95/(1+1)=0.5x+0.475.","Draw the stripping line through the rectifying/q intersection and (0.10,0.10).","Step from xD to xB, changing operating line at the feed intersection; number seven equilibrium stages.","Calculate top L=RD=1(78)=78 kmol/h.","Use V=L+D=78+78=156 kmol/h.","For q=1, Lprime=L+qF=78+120=198 and Vprime=V-(1-q)F=156 kmol/h."],marking:["q-line/pinch","Limiting line","Rmin calculation","Working R","All operating lines","Stage staircase/feed switch","Seven-stage result","Top flows","Bottom flows"]},{title:"B2(a-c) · Antoine range, pressure and volatility",marks:10,focus:"Invert Antoine at 3 bar, explain pressure trend and calculate alpha near 400 K.",modelAnswer:"From log10(P)=A-B/(T+C), rearrange T=B/[A-log10(P)]-C. At P=3 bar, hexane boils at 1171.5/[4-log10(3)]-(-48.8)=381.6 K and heptane at 1268.6/[4-log10(3)]-(-56.2)=491.0 K, so a suitable range is about 381.6-491.0 K. Raising pressure raises both boiling temperatures. At 400 K, p*hex=4.616 bar and p*hept=2.042 bar, so alpha=Khex/Khept=p*hex/p*hept=2.26 approximately 2.3.",method:["Copy the base-10 Antoine equation and its bar/K units.","Rearrange before substituting: T=B/[A-log10(P)]-C.","Hexane: T=1171.5/[4-log10(3)]+48.8=381.6 K.","Heptane: T=1268.6/[4-log10(3)]+56.2=491.0 K.","State the operating range between the two pure boiling points.","For higher P, a larger p* is needed and p* rises with T, so the range shifts upward.","At 400 K calculate both p* values from Antoine.","Because both K values divide by the same P, alpha=p*hex/p*hept=4.616/2.042=2.26 about 2.3."],marking:["Antoine rearrangement","Two boiling temperatures/range","Pressure trend with reason","Two vapour pressures/K values","Relative volatility and interpretation"]},{title:"B2(d) · Three flash iterations",marks:10,focus:"At 3 bar and 400 K, flash an equimolar hexane/heptane feed and suggest the fourth q trial.",modelAnswer:"At 400 K and 3 bar, Khex=4.616/3=1.5388 and Khept=2.042/3=0.6807, so a two-phase root is possible. Let beta=V/F and use f(beta)=sum[zi(Ki-1)/(1+beta(Ki-1))]. Starting with beta=0 and 1 brackets a sign change. Three midpoint trials give beta=0.5000, f=+0.02222; beta=0.7500, f=-0.01808; beta=0.6250, f=+0.00206. The next midpoint is beta4=0.6875, so the requested fourth liquid fraction is q4=1-beta4=0.3125. The converged check is beta about 0.6378, q about 0.3622, xhex about 0.3721 and yhex about 0.5726.",method:["Calculate Khex=1.5388 and Khept=0.6807; one is above 1 and one below 1.","Define beta=V/F and q=L/F=1-beta so the requested q is not confused with beta.","Use xi=zi/[1+beta(Ki-1)] and yi=Ki xi.","Trial 1 beta=0.5000: xhex=0.39389, xhept=0.59500, f=+0.02222.","Positive residual means move beta upward inside the bracket.","Trial 2 beta=0.7500: xhex=0.35611, xhept=0.65745, f=-0.01808.","The root is now between 0.5000 and 0.7500.","Trial 3 beta=0.6250: xhex=0.37405, xhept=0.62467, f=+0.00206.","The next beta midpoint is (0.6250+0.7500)/2=0.6875; therefore q4=1-0.6875=0.3125.","As a check only, full convergence gives beta=0.6378, q=0.3622 and both phase compositions sum to 1."],marking:["Vapour pressures/K values","Two-phase physical check","Correct residual/equations","Three visible trials","Sign-based bracketing","Fourth q suggestion","Composition-sum check"]}],officialChecks:["D=78 and B=42 kmol/h","Rmin=0.5 and working R=1.0","Seven theoretical stages","Top L=78, V=156; bottom L=198, V=156 kmol/h","Boiling range 381.6-491.0 K; alpha about 2.3","Flash converged check: q about 0.362, but show only the requested three trials and propose q4"]},{id:"paper-24-25",year:"2024/25",title:"Txy, derivations, McCabe and absorber design",structure:"Six compulsory questions totalling 100 marks, with less definition recall and more derivation/design.",sourceHref:`${pr}ENG2111%2024-25%20main%20exam.pdf`,solutionHref:`${pr}ENG2111%20Exam%2024-25%20numerical%20solution.docx`,sections:[{title:"Q1 · Build the full benzene-toluene Txy diagram",marks:10,focus:"Use the supplied vapour-pressure table at 760 mmHg and label every phase region.",modelAnswer:"For each temperature solve 760=xBenz p*Benz+(1-xBenz)p*Tol, so xBenz=(760-p*Tol)/(p*Benz-p*Tol), then yBenz=xBenz p*Benz/760. The resulting (T,x,y) rows are: 80.1 C, (1.000,1.000); 85 C, (0.780,0.900); 90 C, (0.581,0.777); 95 C, (0.411,0.632); 100 C, (0.258,0.456); 105 C, (0.130,0.261); 110.6 C, (0.000,0.000). Plot T against x for the bubble curve and T against y for the dew curve. Label liquid below the bubble curve, liquid+vapour between, vapour above the dew curve, benzene boiling point 80.1 C and toluene boiling point 110.6 C.",method:["Use benzene as component A/MVC: x=xBenz and xTol=1-x.","At 85 C write 760=x(877)+(1-x)(345).","Expand: 760=877x+345-345x=345+532x.","Solve x=(760-345)/532=0.7801.","Calculate benzene partial pressure pBenz=x p*Benz=0.7801(877)=684.1 mmHg.","Use Dalton: y=pBenz/P=684.1/760=0.9002.","Repeat the same two equations for every table row; use the listed final pairs to check calculator entries.","Plot T-x as the lower/bubble boundary and T-y as the upper/dew boundary at intermediate composition.","Label all three phase regions and both pure boiling points.","Explain usefulness: a horizontal tie-line at a chosen T reads equilibrium liquid x and vapour y and supports a flash lever rule."],marking:["Raoult total-pressure equation","Rearrangement for x","Dalton calculation for y","Sample arithmetic","All points/curves","Pure boiling points","Three phase labels","Usefulness/tie-line"]},{title:"Q2 · Interpret Txy, azeotrope and flash",marks:10,focus:"Explain what the curves mean and how a flash split is read without deriving equations.",modelAnswer:"The bubble curve gives the temperature at which a liquid of composition x forms its first bubble; the dew curve gives the temperature at which a vapour of composition y forms its first liquid drop. At a temperature inside the two-phase region, a horizontal tie-line meets the bubble curve at the equilibrium liquid x and the dew curve at the equilibrium vapour y. An azeotrope is an internal point where bubble and dew curves meet and x=y, so an equilibrium stage gives no enrichment and ordinary distillation cannot cross it. For a flash, locate overall composition z between x and y on the tie-line; the opposite tie-line lengths give L/F=(y-z)/(y-x) and V/F=(z-x)/(y-x). A flash drum is a single equilibrium-stage split at specified temperature and pressure, unlike a time-varying charged batch still.",method:["Define the bubble curve using “first bubble from liquid”.","Define the dew curve using “first drop from vapour”.","Draw a horizontal tie-line and label its liquid x and vapour y ends.","Define azeotrope with x=y and no separation driving force.","Put overall z between x and y.","State the lever-rule phase fractions and confirm they add to one.","Define a flash drum as one equilibrium stage at fixed T and P.","Contrast batch: finite initial charge, no steady feed and composition changes with time."],marking:["Bubble meaning","Dew meaning","Tie-line compositions","Azeotrope definition","Distillation consequence","Flash phase quality","Flash definition","Batch contrast"]},{title:"Q3 · Minimum reflux for saturated vapour feed",marks:15,focus:"Give a five-mark definition, then a complete labelled graphical construction for q=0.",modelAnswer:"The minimum reflux ratio Rmin is the smallest reflux ratio at which the specified products are theoretically reachable. At this limiting condition an operating line meets the equilibrium curve at a pinch, the local composition driving force is zero and infinitely many stages are required. For saturated vapour q=0, draw the horizontal q-line y=zF. Its intersection P=(xp,zF) with the equilibrium curve is the normal pinch. Join P to (xD,xD) to form the limiting rectifying line. Measure m=(xD-zF)/(xD-xp), then calculate Rmin=m/(1-m), or use the intercept b and Rmin=xD/b-1.",method:["Draw square x-y axes, diagonal y=x and equilibrium curve.","Mark xD on the diagonal.","State q=0 for saturated vapour.","Use q-line equation y=q/(q-1)x-zF/(q-1); substituting q=0 gives y=zF.","Draw the horizontal q-line and label its equilibrium intersection P as the pinch.","Join P to (xD,xD) to make the limiting rectifying line.","Calculate or measure its slope m=(xD-zF)/(xD-xp).","Use m=Rmin/(Rmin+1), rearranged to Rmin=m/(1-m).","Explain pinch means zero driving force and infinitely many stages.","State a real column must operate at R>Rmin."],marking:["Definition","Limiting consequence","Correct horizontal q-line","Pinch","Limiting line","Slope/intercept working","Rmin equation","Fully labelled graph"]},{title:"Q4 · Derive side-draw operating sections",marks:15,focus:"Use a new control volume above the draw, below the liquid draw and below the saturated-liquid feed.",modelAnswer:"Above the side draw, V=L+D and Vy=Lx+DxD, so y=(L/V)x+(D/V)xD=[R/(R+1)]x+xD/(R+1). A saturated-liquid side draw S removes liquid, so immediately below it Ls=L-S while V is unchanged. A component balance around the top plus side product gives Vy=(L-S)x+DxD+SxS. The saturated-liquid feed has q=1, so below the feed Lprime=L-S+F and Vprime=V. The stripping-section balance is Lprime x=Vprime y+BxB, hence y=(Lprime/Vprime)x-(B/Vprime)xB. The external balances are F=D+S+B and FzF=DxD+SxS+BxB.",method:["Draw arrows and label F,zF; D,xD; B,xB; liquid side draw S,xS; L,V above and primed flows below.","Above the draw, write total condenser balance V=L+D.","Write component balance Vy=Lx+DxD and divide by V.","Use R=L/D to obtain y=R/(R+1)x+xD/(R+1).","At the liquid draw write L=Ls+S, so Ls=L-S; saturated liquid adds no vapour.","For the section below the draw write Vy=Ls x+DxD+SxS.","At saturated-liquid feed q=1: Lprime=Ls+F=L-S+F and Vprime=V.","Around the bottom section write Lprime x=Vprime y+BxB.","Rearrange to y=(Lprime/Vprime)x-(B/Vprime)xB.","Close with F=D+S+B and the external MVC balance."],marking:["Diagram/stream labels","Top total balance","Top component balance/line","Side-draw liquid change","Below-draw component line","Feed flow changes","Stripping balance/line","External checks"]},{title:"Q5 · Full McCabe design and tray conversion",marks:30,focus:"Use D=15000, zF=0.50, xD=0.94, xB=0.05, q=1, R=1.3 and 60% efficiency.",modelAnswer:"The balances give F=29666.7 mol/h and B=14666.7 mol/h. Top flows are L=RD=19500 and V=L+D=34500 mol/h. The rectifying line is y=0.56522x+0.40870. The saturated-liquid q-line is vertical at x=0.50 and intersects the rectifying line at (0.50,0.69130). The stripping line through that point and (0.05,0.05) is y=1.42512x-0.02126. Plot the supplied x-y equilibrium data and step four theoretical stages, switching at feed stage 2. On the supplied convention, remove the partial reboiler before efficiency: Nactual=ceil[(4-1)/0.60]=5 actual plates. At tray liquid x=0.70, the T-x table gives T=430 K directly.",method:["Use the bottoms relation B=F-D because D is given.","Write FzF=DxD+BxB and replace B by F-D.","Rearrange F(zF-xB)=D(xD-xB).","Substitute F=15000(0.94-0.05)/(0.50-0.05)=29666.7 mol/h.","Calculate B=29666.7-15000=14666.7 mol/h and check the component balance.","Calculate L=RD=1.3(15000)=19500 mol/h and V=L+D=34500 mol/h.","Rectifying line: y=[1.3/2.3]x+0.94/2.3=0.56522x+0.40870.","Because the feed is at bubble point, q=1 and the q-line is x=0.50.","At x=0.50, y=0.56522(0.50)+0.40870=0.69130.","Stripping slope=(0.69130-0.05)/(0.50-0.05)=1.42512; intercept=0.05-1.42512(0.05)=-0.02126.","Plot equilibrium data, diagonal and all lines; step horizontally to equilibrium and vertically to the active operating line.","Number four stages and mark the line switch as feed stage 2.","State the equipment convention, then calculate ceil[(4-1)/0.60]=ceil(5)=5 actual trays.","For temperature, read the liquid x column: x=0.70 corresponds exactly to 430 K."],marking:["F/B balances and results","Internal top flows","Equilibrium/diagonal","Rectifying equation","q-line","Stripping equation","Four-stage staircase","Feed stage 2","Equipment convention","Five real trays","Correct T-x reading and 430 K"]},{title:"Q6 · Minimum oil, Kremser stages and one-column rescue",marks:20,focus:"Use G=100 mol/h, yB=0.030, 98% removal, clean oil, T=20 C, P=1 bar and y*=0.015(T/P)x.",modelAnswer:"The cleaned-gas target is yT=0.030(1-0.98)=0.000600. The equilibrium slope is He=0.015(20)/1=0.300. At minimum solvent the bottom is pinched, so xB,max=yB/He=0.030/0.300=0.100. Therefore Lmin=G(yB-yT)/(xB,max-xT)=100(0.030-0.000600)/(0.100-0)=29.4 mol/h. At 1.5Lmin, L=44.1 mol/h and A=L/(GHe)=44.1/[100(0.300)]=1.470. The clean-solvent Kremser design equation gives N=log[1+(A-1)yB/yT]/log(A)-1=7.30 ideal stages, so two available five-stage columns are required. If only one five-stage column is available, solving the rating relation for N=5 gives A about 1.889 and L about 56.7 mol/h (about 1.93Lmin); alternatively improve solubility by lowering temperature, raising pressure or selecting a better oil.",method:["Translate 98% removed into 2% remaining: yT=0.030(0.02)=0.000600.","Calculate equilibrium slope He=0.015T/P=0.015(20)/1=0.300.","At minimum flow impose the bottom pinch yB=He xB,max.","Calculate xB,max=0.030/0.300=0.100.","Use G(yB-yT)=Lmin(xB,max-xT), with fresh oil xT=0.","Substitute Lmin=100(0.0294)/0.100=29.4 mol/h.","Operating oil rate L=1.5(29.4)=44.1 mol/h.","Calculate A=L/(GHe)=44.1/[100(0.300)]=1.470.","Use N=log[1+(A-1)yB/yT]/log(A)-1.","Substitute yB/yT=0.030/0.000600=50 to obtain N=7.3026 ideal stages.","Two columns are needed because ceil(7.3026/5)=2; never round equipment down.","For one five-stage column, target A about 1.889, so L=A G He=1.889(100)(0.300)=56.7 mol/h, or change T/P/solvent to reduce He."],marking:["Outlet specification","Equilibrium slope","Minimum-flow pinch","Lmin calculation","Operating L and A","Kremser equation","7.3-stage result","Two-column rounding","Defensible one-column strategy with physical link"],warning:"The supplied numerical key prints Q6(a) as 294 mol/h. The printed question gives 29.4 mol/h by direct substitution, and 29.4 is the value that produces the key’s Q6(b) result of 7.3 ideal stages. The key is internally inconsistent by a factor of ten; show the full substitution in the exam."}],officialChecks:["F=29667 and B=14667 mol/h","Four theoretical stages; feed stage 2","Five actual plates on the stated partial-reboiler convention","Tray liquid x=0.70 gives 430 K","Printed equation gives minimum oil 29.4 mol/h; key prints inconsistent 294 mol/h","7.3 ideal stages, so two five-stage columns"]}],ff=[{id:"mock-35",duration:35,title:"35-minute rescue drill",subtitle:"Four first-move questions; stop any blank-page panic.",totalMarks:30,questions:[{number:"1",topic:"vle",marks:7,title:"Build one equilibrium row",prompt:"For alpha=3 and xA=0.40, calculate yA, sketch the equilibrium point and identify the MVC-rich phase.",marking:["State the constant-alpha equation","Substitute alpha and xA","Obtain yA=0.667","Plot and label (0.40,0.667)","State that vapour is richer in MVC"],modelAnswer:"Using constant relative volatility, yA=alpha xA/[1+(alpha-1)xA]=3(0.40)/[1+2(0.40)]=0.667. Plot (xA,yA)=(0.40,0.667) above the diagonal. Because yA>xA, the equilibrium vapour is enriched in the more volatile component A.",workedSteps:["Write y=alpha x/[1+(alpha-1)x].","Substitute alpha=3 and x=0.40.","Calculate numerator 1.20 and denominator 1.80.","Report yA=0.667 and plot the labelled point.","Interpret yA>xA as MVC enrichment in the vapour."]},{number:"2",topic:"distillation",marks:8,title:"Balances and line",prompt:"For F=120, zF=0.65, xD=0.95, xB=0.10 and R=1, calculate D, B, L, V and the rectifying-line equation.",marking:["Overall and component balances","D=77.65 and B=42.35 kmol/h","L=77.65 and V=155.29 kmol/h","Rectifying slope 0.5","Intercept 0.475 and units"],modelAnswer:"Overall and MVC balances give D=77.65 kmol/h and B=42.35 kmol/h. With R=L/D=1, L=77.65 kmol/h and V=L+D=155.29 kmol/h. The rectifying line is y=[R/(R+1)]x+xD/(R+1)=0.500x+0.475.",workedSteps:["Use F=D+B and FzF=DxD+BxB.","D=120(0.65-0.10)/(0.95-0.10)=77.65 kmol/h.","B=120-77.65=42.35 kmol/h.","L=RD=77.65 and V=L+D=155.29 kmol/h.","Substitute R=1 and xD=0.95 into the rectifying-line equation."]},{number:"3",topic:"mccabe",marks:7,title:"Construction order",prompt:"From a blank square graph, list and sketch the complete McCabe construction order for saturated-liquid feed.",marking:["Square labelled axes, diagonal and equilibrium curve","xD, zF and xB identified","Rectifying line and vertical q-line","Stripping line through the intersection and xB","Correct staircase switch and count"],modelAnswer:"Draw a square x-y graph, the 45-degree diagonal and the equilibrium curve. Mark xD, zF and xB. Draw the rectifying line through (xD,xD), then the saturated-liquid q-line vertically at x=zF. Join the rectifying/q-line intersection to (xB,xB) for the stripping line. Step horizontally to equilibrium and vertically to the active operating line, switching at the q-line intersection, and state the condenser/reboiler counting convention.",workedSteps:["Label x (liquid MVC fraction) and y (vapour MVC fraction), both 0 to 1.","Draw y=x and the equilibrium curve.","Place the product/feed compositions on the diagonal.","Draw rectifying line, vertical q-line, then stripping line.","Step from xD, switch operating line at the feed intersection, and finish at xB.","Count stages and explicitly say whether partial equipment stages are included."]},{number:"4",topic:"absorption",marks:8,title:"Minimum solvent",prompt:"For yB=0.03, yT=0.003, xT=0 and He=0.50, find (L/G)min and explain why it is not a usable design rate.",marking:["Use bottom pinch at minimum flow","Find xB,max=0.060","Write the solute balance","Obtain (L/G)min=0.45","Explain zero driving force/infinite stages"],modelAnswer:"At minimum solvent flow the bottom is pinched, so xB,max=yB/He=0.03/0.50=0.060. The dilute solute balance gives (L/G)min=(yB-yT)/(xB,max-xT)=(0.030-0.003)/(0.060-0)=0.45. This is a limiting value, not a design rate: the bottom driving force is zero and infinitely many ideal stages would be required.",workedSteps:["Write the linear equilibrium relation y=He x.","At the bottom pinch, calculate xB,max=yB/He=0.060.","Use G(yB-yT)=L(xB-xT).","Calculate (L/G)min=0.027/0.060=0.45.","State pinch, zero local driving force and infinite-stage consequence."]}]},{id:"mock-60",duration:60,title:"60-minute mixed paper",subtitle:"One graphical half and one design half.",totalMarks:50,questions:[{number:"1",topic:"mccabe",marks:30,title:"Complete binary column construction",prompt:"Use alpha=2.5, F=100, zF=0.50, xD=0.95, xB=0.05, q=1 and R=2. Calculate flows, construct all lines, step stages, identify the feed stage and convert to actual trays at 70% efficiency.",marking:["D=50 and B=50 kmol/h","Equilibrium curve and diagonal","Rectifying line y=0.667x+0.317","Vertical q-line and stripping line y=1.333x-0.0167","Approximately 11 ideal stages with feed near stage 5","Clearly stated equipment-stage convention","15 actual trays if one partial reboiler is excluded before applying 70% efficiency"],modelAnswer:"Balances give D=B=50 kmol/h. Above the feed, L=RD=100 and V=L+D=150 kmol/h, so y=0.667x+0.3167. For q=1 the q-line is vertical at x=0.50 and meets the rectifying line at (0.50,0.650). The stripping line through that point and (0.05,0.05) is y=1.333x-0.0167. A constant-alpha staircase gives about 11 ideal stages and a feed switch near stage 5. If those 11 include one partial reboiler, the ideal tray section is 10 stages and Nactual=ceil(10/0.70)=15 trays.",workedSteps:["Solve D=F(zF-xB)/(xD-xB)=50; B=50 kmol/h.","Use L=RD=100 and V=L+D=150 kmol/h.","Plot y*=2.5x/[1+1.5x] and y=x.","Draw y=0.667x+0.3167 and the vertical q-line x=0.50.","Join (0.50,0.650) to (0.05,0.05) for the stripping line.","Step about 11 ideal stages, switching near stage 5.","State the equipment convention, remove one partial reboiler, divide 10 by 0.70 and round up to 15 trays."]},{number:"2",topic:"absorption",marks:20,title:"Rate and improve an absorber",prompt:"A nine-ideal-stage absorber has yB=0.005, clean solvent, L=50, G=130 and He=0.21. Calculate A and rated yT, then explain two improvements.",marking:["A=1.832","Correct fresh-solvent Kremser rating equation","yT approximately 9.8×10^-6","Interpret very high predicted removal","Two improvements linked to A, equilibrium or effective stages"],modelAnswer:"This is a rating problem because the nine ideal stages already exist. A=L/(GHe)=50/[130(0.21)]=1.832. For clean solvent, yT/yB=(A-1)/(A^(N+1)-1), so yT=0.005(1.832-1)/(1.832^10-1)≈9.8×10^-6. Improvements include increasing L or reducing G to raise A, selecting a more soluble solvent/lowering temperature to reduce He, or improving contact efficiency so the equipment supplies more ideal stages.",workedSteps:["Write RATING and calculate A=1.832.","Use N=9 in yT/yB=(A-1)/(A^(N+1)-1).","Calculate the remaining fraction at A=1.832.","Multiply by yB=0.005 to obtain yT≈9.8×10^-6.","Link each proposed improvement to A, He, driving force or effective ideal stages."]}]},{id:"mock-120",duration:120,title:"Predicted August-resit mock",subtitle:"Current four-block blueprint; 105 raw marks normalised to a percentage.",totalMarks:105,questions:[{number:"1",topic:"vle",marks:25,title:"Construct and interpret binary equilibrium",prompt:"From supplied-style vapour-pressure information, explain and demonstrate construction of a constant-pressure Txy diagram. Include bubble/dew curves, phase regions, tie-lines, one Raoult/Dalton calculation, flash quality and the physical iteration check.",marking:["Find pure-component boiling limits at the specified pressure","Show at least one bubble-point Raoult calculation","Use Dalton to obtain the matching vapour composition","Draw and label bubble/dew curves and all phase regions","Use a horizontal tie-line and lever rule correctly","State K-value/flash physical checks and an iteration residual"],modelAnswer:"At the fixed pressure, first solve Pi*(T)=P for each pure-component boiling point. For each chosen liquid composition xA, find the bubble temperature from P=xA PA*(T)+(1-xA)PB*(T), then calculate yA=xA PA*(T)/P. Plot bubble points as T against x and the matching dew points as T against y. The region below the bubble curve is liquid, above the dew curve is vapour, and between them is liquid+vapour. A horizontal tie-line joins equilibrium x and y; for overall z between them, V/F=(z-x)/(y-x) and L/F=(y-z)/(y-x). For a fixed-T,P flash use Ki=Pi*/P and test the Rachford-Rice residual: a two-phase root normally requires an appropriate sign change with at least one K above one and one below one.",workedSteps:["Calculate or identify the two pure boiling temperatures.","Choose xA values and solve the bubble-pressure equation for T.","Calculate matching yA values with Dalton/Raoult.","Plot T-x bubble and T-y dew curves and label liquid, L+V and vapour regions.","Draw a horizontal tie-line and apply the lever rule on the correct segments.","For iteration, compute K values, bracket beta=V/F and drive the residual to zero."]},{number:"2",topic:"distillation",marks:25,title:"Derive every active operating section",prompt:"For a CMO binary column with a saturated-liquid feed and an intermediate saturated-liquid side draw, derive the operating relationships above the draw, below the draw and below the feed. Define reflux, boilup, CMO and both limiting reflux conditions.",marking:["Label independent control volumes and stream directions","Derive top line Vy=Lx+DxD","Derive below-draw line Vy=(L-S)x+DxD+SxS","Apply saturated-liquid feed changes Lprime=L-S+F and Vprime=V","Derive stripping line Vprime y=Lprime x-BxB","Define R=L/D and the boilup ratio on the stated course basis","Explain total-reflux and minimum-reflux limits"],modelAnswer:"Above the liquid side draw, a total and MVC balance gives V=L+D and Vy=Lx+DxD, hence y=(L/V)x+DxD/V. The saturated-liquid draw removes S from the descending liquid, so below it Ls=L-S while V is unchanged; the MVC balance is Vy=(L-S)x+DxD+SxS. At a saturated-liquid feed q=1, Lprime=Ls+F and Vprime=V. Below the feed, Vprime y=Lprime x-BxB, or y=(Lprime/Vprime)x-BxB/Vprime. Reflux ratio is R=L/D; use the lecturer’s stated Vprime/B convention for boilup. At total reflux D=B=0 and operating lines coincide with the diagonal, giving minimum stages. At minimum reflux a pinch gives zero driving force and infinitely many stages.",workedSteps:["Draw one control volume for each constant-flow section.","Use V=L+D above the draw and derive the ordinary rectifying line.","Withdraw saturated liquid S: Ls=L-S and retain the SxS solute term.","At q=1 add the full feed to liquid: Lprime=Ls+F; keep Vprime=V.","Use a fresh bottom control volume to derive the stripping line.","Finish with precise reflux, boilup, total-reflux and minimum-reflux definitions."]},{number:"3",topic:"mccabe",marks:30,title:"Perform a full McCabe-Thiele design",prompt:"Use alpha=2.5, F=100 kmol/h, zF=0.50, xD=0.95, xB=0.05, saturated-liquid feed and R=2. Calculate D/B, construct all lines, step stages, state feed stage and convert to actual trays at 70% efficiency.",marking:["D=50 and B=50 kmol/h","Correct constant-alpha equilibrium curve and diagonal","Rectifying line y=0.667x+0.317","Vertical q-line and stripping line y=1.333x-0.0167","Approximately 11 ideal stages and feed near stage 5","Explicit partial-equipment convention","15 actual trays if one equipment stage is excluded"],modelAnswer:"D=B=50 kmol/h. With R=2, L=100 and V=150 kmol/h, giving y=0.667x+0.3167. The q-line is vertical at x=0.50 and intersects at y=0.650. The stripping line through (0.50,0.650) and (0.05,0.05) is y=1.333x-0.0167. Stepping against y*=2.5x/[1+1.5x] gives a
