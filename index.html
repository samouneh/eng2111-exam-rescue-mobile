 liquid there. Below the lower curve is liquid, above the upper curve is vapour, and between them are two phases.",steps:["Draw a horizontal tie-line at the stated temperature.","Read liquid x from the bubble curve.","Read vapour y from the dew curve.","Use the lever rule only after x, z and y are marked."]},{heading:"Why the vapour is richer",body:"For an ordinary zeotropic mixture, the MVC has the larger saturated vapour pressure, so the equilibrium vapour is richer in MVC than the liquid: y > x. The equilibrium curve therefore lies above y = x."}],examMove:"On any phase diagram question, label axes, MVC, both pure boiling points, both curves and all three regions before doing arithmetic.",traps:["Swapping x and y","Calling the upper Txy curve the bubble curve","Using mass fraction when the plot uses mole fraction"],source:"Lecture 2; Lec3a; Lec20 pp. 2-6; 2024/25 Q1-Q2"},{id:"vle-raoult",topic:"vle",title:"Raoult + Dalton without panic",eyebrow:"VLE 2 of 4",minutes:25,priority:"must",objective:"Calculate bubble pressure and equilibrium vapour composition for an ideal binary mixture.",blocks:[{heading:"The chain that earns the marks",body:"Raoult gives a component partial pressure from the liquid. Dalton adds partial pressures and converts them to vapour fractions.",formula:"p_i=x_iP_i^*,\\quad P=\\sum p_i,\\quad y_i=\\frac{p_i}{P}"},{heading:"Binary shortcut",body:"For component A with xB = 1 - xA, substitute directly. Keep all pressures in the same unit.",formula:"P=x_AP_A^*+(1-x_A)P_B^*"},{heading:"Worked micro-example",body:"At 70 C, take pA*=0.734 bar, pB*=0.116 bar and xA=0.30. P=0.30(0.734)+0.70(0.116)=0.301 bar. Then yA=0.30(0.734)/0.301=0.731.",note:"Sanity: P lies between the two pure vapour pressures and yA > xA."}],examMove:"Show one complete row of sample calculations before tabulating points for a Pxy or Txy plot.",traps:["Mixing bar and mmHg","Forgetting xB=1-xA","Using total pressure where saturated vapour pressure is required"],source:"Week 1 tutorial; Lecture 2; aide-memoire p. 1"},{id:"vle-antoine-alpha",topic:"vle",title:"Antoine, relative volatility and azeotropes",eyebrow:"VLE 3 of 4",minutes:24,priority:"must",objective:"Use the supplied Antoine form correctly and move between x and y with relative volatility.",blocks:[{heading:"Copy the exact Antoine convention",body:"The notes use more than one coefficient convention. Inspect whether the equation uses log10 or ln, and whether T is C or K. Never mix coefficients from one form with another.",formula:"\\log_{10}P=A-\\frac{B}{T+C}"},{heading:"Constant relative volatility",body:"Alpha measures how much more readily A enters vapour than B. If alpha > 1 and A is the MVC, use the binary equilibrium relation to build an xy curve.",formula:"\\alpha_{AB}=\\frac{K_A}{K_B},\\qquad y_A=\\frac{\\alpha x_A}{1+(\\alpha-1)x_A}"},{heading:"Azeotrope",body:"At an azeotrope, x=y and liquid and vapour have the same composition. Ordinary distillation cannot cross that composition because the driving force disappears.",note:"A curve crossing y=x is not a harmless detail; it is a separation limit."}],examMove:"Write the Antoine convention and units above the first calculation; then test pure-component boiling points where P*=column pressure.",traps:["Assuming every Antoine table uses log10","Calling alpha a vapour fraction","Claiming more stages can cross an azeotrope"],source:"Week 2 tutorial; Lec3a; 2023/24 B2; 2024/25 Q2"},{id:"vle-flash",topic:"vle",title:"Flash calculation: one stage, one picture",eyebrow:"VLE 4 of 4",minutes:28,priority:"must",objective:"Find outlet phase compositions and liquid fraction from a flash drum.",blocks:[{heading:"What a flash drum does",body:"A feed is brought to a pressure and temperature where it partially vaporises, then the equilibrium liquid and vapour are separated. It is one equilibrium stage, unlike a multistage distillation column."},{heading:"The feed balance",body:"q is the liquid fraction L/F and 1-q is V/F. Overall composition lies between x and y.",formula:"z_F=qx+(1-q)y,\\qquad q=\\frac{y-z_F}{y-x}"},{heading:"Graphical method",body:"At a specified T and P, read x and y from the tie-line on Txy, then apply the lever rule. If q and z are given, draw the flash/q line through (z,z) with slope q/(q-1) and intersect equilibrium.",steps:["Check whether the feed point is inside the two-phase envelope.","Read or calculate equilibrium x and y.","Use the lever rule for q.","Report L=qF and V=(1-q)F if a flow is supplied."]}],examMove:"State the physical phase check before iterating. If the trial q leaves [0,1], the assumed two-phase state is wrong.",traps:["Using q as vapour fraction","Reporting x and y without L and V when F is given","Confusing flash with differential batch distillation"],source:"Lec4; Week 3 tutorial; 2022/23 B1(b-c); 2023/24 B2(d)"},{id:"dist-column",topic:"distillation",title:"Column anatomy and the two balances",eyebrow:"Distillation 1 of 4",minutes:20,priority:"must",objective:"Sketch a column and calculate distillate and bottoms flows immediately.",blocks:[{heading:"Sketch first",body:"Draw feed F,zF; top distillate D,xD; bottom product B,xB; condenser and reboiler. Use MVC composition everywhere. This sketch prevents most sign and stream errors."},{heading:"Two equations solve two product flows",body:"Use the total balance and the MVC component balance together.",formula:"F=D+B,\\qquad Fz_F=Dx_D+Bx_B"},{heading:"Fast solution",body:"Eliminate B to get D directly, then B=F-D.",formula:"D=F\\frac{z_F-x_B}{x_D-x_B}"}],examMove:"Write units on every flow and verify D+B=F plus xB<zF<xD.",traps:["Using the bottoms fraction of the less volatile component without conversion","Mixing zF and xF notation","Skipping the labelled process sketch"],source:"Lec5; Week 4 tutorial; all three past papers"},{id:"dist-cmo-flows",topic:"distillation",title:"CMO, reflux and internal flows",eyebrow:"Distillation 2 of 4",minutes:28,priority:"must",objective:"Translate reflux ratio and feed condition into every internal flow.",blocks:[{heading:"Constant molar overflow",body:"Equal molar latent heats, negligible heat losses and sensible-heat effects imply constant L and V within each column section. That makes operating lines straight."},{heading:"Above the feed",body:"For a total condenser, reflux ratio R=L/D. A condenser balance gives V=L+D.",formula:"L=RD,\\qquad V=(R+1)D"},{heading:"Across the feed stage",body:"A fraction q of feed joins liquid and 1-q joins vapour. Primed flows denote below-feed values.",formula:"L'=L+qF,\\qquad V'=V-(1-q)F"},{heading:"Thermal-condition memory",body:"q>1 cold liquid; q=1 saturated liquid; 0<q<1 two-phase; q=0 saturated vapour; q<0 superheated vapour."}],examMove:"Make a four-row table for L, V, L-prime and V-prime rather than trying to remember directions mid-answer.",traps:["Using R=V/D","Adding vapour feed to V-prime with the wrong sign","Assuming q always lies between zero and one"],source:"Lec6; Lec7; Lec9; Week 4 tutorial"},{id:"dist-lines",topic:"distillation",title:"Operating lines and the q-line",eyebrow:"Distillation 3 of 4",minutes:32,priority:"must",objective:"Construct and derive rectifying, stripping and feed lines.",blocks:[{heading:"Rectifying line",body:"A balance around the condenser and stages above the feed gives a line through (xD,xD). Its slope is R/(R+1).",formula:"y=\\frac{R}{R+1}x+\\frac{x_D}{R+1}"},{heading:"Feed line",body:"The q-line always passes through (zF,zF). Its slope identifies feed condition.",formula:"y=\\frac{q}{q-1}x-\\frac{z_F}{q-1}"},{heading:"Stripping line",body:"Under CMO the lower line is y=(L-prime/V-prime)x-(B/V-prime)xB. Graphically, connect (xB,xB) to the rectifying/q-line intersection.",formula:"y=\\frac{L'}{V'}x-\\frac{B}{V'}x_B"},{heading:"Five q-line shapes",body:"q=1 vertical; q=0 horizontal; 0<q<1 negative slope; q>1 slope greater than one; q<0 positive slope below one."}],examMove:"For a derivation, draw the control volume, state CMO, write total and component balances, then rearrange. A memorised final line alone will not earn derivation marks.",traps:["Wrong q-line intercept sign","Forgetting both operating lines meet on the q-line","Drawing a saturated-vapour feed vertically"],source:"Lec7; Lec12-Lec13; aide-memoire p. 2; 2024/25 Q3-Q4"},{id:"dist-limits",topic:"distillation",title:"Limits, efficiency and energy",eyebrow:"Distillation 4 of 4",minutes:26,priority:"stretch",objective:"Explain minimum reflux, total reflux, real trays and heat duties.",blocks:[{heading:"Two opposite limits",body:"At total reflux, no products are withdrawn and both operating lines become y=x; stages are minimum but energy is maximum. At minimum reflux, a pinch creates an infinite-stage requirement."},{heading:"From ideal stages to real trays",body:"First remove equilibrium stages supplied by a partial reboiler or partial condenser if the question calls them stages, then divide column trays by overall efficiency and round up.",formula:"N_{actual}=\\left\\lceil\\frac{N_{ideal,trays}}{E_o}\\right\\rceil"},{heading:"Fenske at total reflux",body:"For constant relative volatility, the supplied handout gives the minimum theoretical stages.",formula:"N_{min}=\\frac{\\log\\left[\\frac{x_D(1-x_B)}{(1-x_D)x_B}\\right]}{\\log\\alpha}"},{heading:"Energy under CMO",body:"With latent heat lambda and vapour rate V, idealised condenser and reboiler duties are approximately V lambda, with signs depending on the energy convention."}],examMove:"State which condenser/reboiler counts as an equilibrium stage before reporting stage and plate totals.",traps:["Rounding down actual trays","Counting a total condenser as a theoretical stage","Saying minimum reflux means minimum energy"],source:"Lec9-Lec11; Week 5 tutorial; aide-memoire p. 2"},{id:"mc-setup",topic:"mccabe",title:"The construction recipe",eyebrow:"McCabe 1 of 4",minutes:25,priority:"must",objective:"Reproduce the complete construction in the correct order.",blocks:[{heading:"The non-negotiable plot",body:"Use square axes from 0 to 1. Plot equilibrium y*(x), the 45-degree diagonal, and mark xD, zF and xB. Accuracy here controls every later mark."},{heading:"Build lines in order",body:"Draw the rectifying line from (xD,xD), then the q-line through (zF,zF), then the stripping line from their intersection to (xB,xB).",steps:["Equilibrium curve and diagonal","Product/feed compositions","Rectifying line","q-line","Stripping line","Stage staircase and feed-stage switch"]},{heading:"Step stages",body:"Start at (xD,xD). Move horizontally to equilibrium, vertically to the active operating line, and repeat. Switch lines at the feed intersection. Stop when the horizontal step reaches or passes xB."}],examMove:"Use a ruler, label every line, and write the calculated slope/intercept beside it. Construction marks survive even if the final count is off by one.",traps:["Starting at xB","Stepping between the operating line and diagonal","Changing operating line at zF rather than at the line intersection"],source:"Lec8; Lec20 pp. 8-16; Week 5 tutorial"},{id:"mc-rmin",topic:"mccabe",title:"Minimum reflux and the pinch",eyebrow:"McCabe 2 of 4",minutes:22,priority:"must",objective:"Find Rmin graphically and explain its physical meaning.",blocks:[{heading:"The pinch construction",body:"Draw the feed q-line. Find its relevant intersection with the equilibrium curve. Connect that pinch point to (xD,xD); this is the limiting rectifying line."},{heading:"Read Rmin from slope",body:"If the limiting line slope is m, compare it with m=R/(R+1).",formula:"R_{min}=\\frac{m}{1-m}"},{heading:"Why not operate there?",body:"At the pinch the operating and equilibrium lines meet, the local mass-transfer driving force tends to zero, and infinitely many ideal stages are needed. Design R is commonly a multiple of Rmin."}],examMove:"Mark and name the pinch point; a line with no physical explanation leaves definition marks behind.",traps:["Using the slope itself as Rmin","Connecting the pinch to the origin","Calling total reflux and minimum reflux the same condition"],source:"Lec10; 2023/24 B1(d-e); 2024/25 Q3"},{id:"mc-read",topic:"mccabe",title:"Read hidden data from a diagram",eyebrow:"McCabe 3 of 4",minutes:30,priority:"must",objective:"Extract R, q, flows, feed condition and feed position from coordinates.",blocks:[{heading:"Recover reflux ratio",body:"Take two points on the rectifying line, calculate slope m, then use R=m/(1-m). Its y-intercept should also equal xD/(R+1)."},{heading:"Recover q",body:"Take two q-line points to find slope s. Since s=q/(q-1), rearrange.",formula:"q=\\frac{s}{s-1}"},{heading:"Recover flows",body:"Use product balances for D and B, then L=RD and V=(R+1)D. Feed condition gives L-prime and V-prime."},{heading:"Diagnose feed location",body:"The optimal feed stage is where the staircase naturally changes from the rectifying to stripping operating line. A drawn switch elsewhere represents non-optimal feed placement."}],examMove:"Write coordinates used for every slope; that turns a ruler reading into auditable working.",traps:["Reading q directly from q-line slope","Using a visually estimated intercept without coordinates","Counting the feed stage twice"],source:"Week 4 and Week 5 tutorials; Lec20 pp. 15-16"},{id:"mc-design",topic:"mccabe",title:"A full design answer",eyebrow:"McCabe 4 of 4",minutes:38,priority:"must",objective:"Combine balances, lines, stages, efficiency and temperatures in exam order.",blocks:[{heading:"The seven-part answer",body:"A full design usually asks for product flows, equilibrium plot, operating lines, stage count, feed stage, real plates and perhaps temperature/energy.",steps:["Solve D and B.","Plot equilibrium data smoothly.","Construct rectifying and q-lines.","Construct stripping line.","Step and count stages/feed stage.","Apply efficiency only to real trays.","Interpolate temperature from VLE data if requested."]},{heading:"Use the table twice",body:"An x-y-T table supplies both the equilibrium curve and liquid bubble-point temperature. For a liquid plate composition, interpolate T against x, not y."},{heading:"Reasonableness",body:"A feasible result should have positive product/internal flows, operating lines below equilibrium for ordinary distillation, and more real trays than ideal trays when efficiency is below 100%."}],examMove:"Box separate answers for stages, column trays, actual trays and feed tray. Ambiguous counting is an avoidable mark loss.",traps:["Interpolating plate temperature against vapour composition","Applying efficiency to a total condenser","Omitting the partial reboiler from stage count when it is an equilibrium stage"],source:"Lec11; 2024/25 Q5 and official numerical key"},{id:"abs-language",topic:"absorption",title:"Absorption versus stripping",eyebrow:"Absorption 1 of 4",minutes:18,priority:"must",objective:"Identify flow directions, solute transfer and the correct basis.",blocks:[{heading:"Direction of transfer",body:"Absorption transfers soluble gas into liquid; stripping transfers dissolved solute from liquid into gas. Counter-current columns maximise driving force."},{heading:"Dilute versus bulk coordinates",body:"Dilute problems often use mole fractions x and y with nearly constant carrier flows. Bulk systems use solute-free mole ratios X=x/(1-x) and Y=y/(1-y) so carrier flow rates remain constant.",formula:"X=\\frac{x}{1-x},\\qquad Y=\\frac{y}{1-y}"},{heading:"Henry equilibrium",body:"For a linear dilute system, equilibrium is y*=He x. The operating line and equilibrium line must use compatible concentration coordinates.",formula:"y^*=H_e x"}],examMove:"Draw arrows and label gas bottom-to-top, liquid top-to-bottom before writing a balance.",traps:["Calling stripping absorption","Mixing mole ratios and mole fractions on one line","Treating Henry constant as automatically dimensional or dimensionless"],source:"Lec14; Lec17; reference notation guide"},{id:"abs-lines",topic:"absorption",title:"Operating lines and minimum solvent",eyebrow:"Absorption 2 of 4",minutes:28,priority:"must",objective:"Construct the absorber line and identify the limiting liquid flow.",blocks:[{heading:"Operating-line slope",body:"For dilute counter-current absorption with constant carrier flows, a solute balance gives an operating-line slope L/G. The equilibrium-line slope is He.",formula:"G(y_B-y_T)=L(x_B-x_T)"},{heading:"Absorption factor",body:"A compares operating-line slope with equilibrium-line slope. Larger A generally means easier absorption.",formula:"A=\\frac{L}{G H_e}"},{heading:"Minimum L/G",body:"Reducing L rotates the operating line toward equilibrium. At minimum flow, the line touches equilibrium at a pinch and an infinite stage count results.",formula:"\\left(\\frac{L}{G}\\right)_{min}=\\frac{y_B-y_T}{x_B^*-x_T}"}],examMove:"For clean solvent xT=0 and linear equilibrium, calculate xB*=yB/He before the minimum-flow balance.",traps:["Using G/L for an absorber plot drawn y versus x","Operating exactly at minimum flow","Using outlet gas rather than inlet gas for bottom equilibrium"],source:"Lec14-Lec16; Lec20 pp. 17-19; 2024/25 Q6"},{id:"abs-kremser",topic:"absorption",title:"Kremser design and rating",eyebrow:"Absorption 3 of 4",minutes:34,priority:"must",objective:"Choose the right Kremser form and distinguish design from rating.",blocks:[{heading:"Design problem",body:"Use when inlet/outlet targets and flow conditions are known but the ideal stage count N is required. Evaluate logarithms with a consistent base.",formula:"N=\\frac{\\log\\left[(1-A^{-1})\\frac{y_B-y_T^*}{y_T-y_T^*}+A^{-1}\\right]}{\\log A}"},{heading:"Rating problem",body:"Use when N is fixed and you need achieved removal, absorption factor or flow.",formula:"\\frac{y_B-y_T}{y_B-y_T^*}=\\frac{A-A^{N+1}}{1-A^{N+1}}"},{heading:"At A near one",body:"Direct calculator evaluation suffers cancellation when A is nearly one. Use the limiting stage relation or a stable calculator implementation."},{heading:"Real trays",body:"Convert physical trays to ideal stages with efficiency when rating an existing column: ideal stages = real trays times fractional efficiency."}],examMove:"Write “design” or “rating” above the chosen equation and define yT* before substituting.",traps:["Using real trays as N in Kremser","Forgetting N+1 in the rating exponent","Using percent removal as a mole fraction"],source:"Lec15; aide-memoire pp. 1-2; Week 8 tutorial; 2022/23 B2"},{id:"abs-improve",topic:"absorption",title:"Make an absorber work harder",eyebrow:"Absorption 4 of 4",minutes:22,priority:"stretch",objective:"Propose physically defensible improvements when a fixed column misses its target.",blocks:[{heading:"Four levers",body:"Increase solvent flow, increase effective stages/efficiency, choose a solvent with stronger affinity, or change pressure/temperature to favour absorption."},{heading:"Pressure and temperature",body:"Gas solubility usually improves at higher pressure and lower temperature, but always interpret the given Henry-law convention: a smaller equilibrium y at a given x means stronger absorption driving force."},{heading:"Multiple columns",body:"If available columns each have a fixed ideal-stage capacity, divide the required ideal stages by stages per column and round up. Series operation increases total stages."},{heading:"Explain, do not list",body:"Tie each proposal to A, the operating-line distance from equilibrium, or the effective stage count. A bare list earns fewer marks than cause and effect."}],examMove:"For “propose a strategy,” give the change, the equation/diagram term it alters, and why removal increases.",traps:["Suggesting operation at the pinch","Increasing temperature without checking Henry behaviour","Rounding the number of columns down"],source:"Lec16-Lec17; 2022/23 B2(c); 2024/25 Q6(c)"}],_e=r=>r,I5=[_e({id:"v1",topic:"vle",kind:"mcq",priority:"must",marks:1,prompt:"On a constant-pressure Txy diagram, which curve is normally lower?",options:["Bubble-point curve","Dew-point curve","They always coincide"],answer:"Bubble-point curve",hint:"Imagine heating a liquid from a low temperature.",steps:["The liquid first reaches its bubble point.","Further heating through the two-phase region reaches the dew curve."],marking:["Correct curve"],source:"Lecture 2"}),_e({id:"v2",topic:"vle",kind:"numeric",priority:"must",marks:3,prompt:"At 70 C, pA*=0.734 bar and pB*=0.116 bar. Find total pressure for xA=0.30.",answer:.3014,tolerance:.002,unit:"bar",hint:"Use xA pA* + (1-xA)pB*.",steps:["xB=0.70","P=0.30(0.734)+0.70(0.116)","P=0.3014 bar"],marking:["Binary composition","Raoult sum","Correct value and unit"],source:"Week 1 tutorial"}),_e({id:"v3",topic:"vle",kind:"numeric",priority:"must",marks:2,prompt:"Using the previous mixture, find yA at xA=0.30.",answer:.7306,tolerance:.003,hint:"Divide A partial pressure by total pressure.",steps:["pA=0.30(0.734)=0.2202 bar","yA=0.2202/0.3014=0.731"],marking:["Partial pressure","Vapour fraction"],source:"Week 1 tutorial"}),_e({id:"v4",topic:"vle",kind:"numeric",priority:"must",marks:2,prompt:"For alpha=3 and xA=0.40, find equilibrium yA.",answer:.6667,tolerance:.003,hint:"Use alpha x/[1+(alpha-1)x].",steps:["Numerator=1.2","Denominator=1+2(0.4)=1.8","yA=0.667"],marking:["Correct relation","Correct result"],source:"2023/24 B1 style"}),_e({id:"v5",topic:"vle",kind:"numeric",priority:"must",marks:3,prompt:"A flash has x=0.334, y=0.551 and zF=0.45. Find liquid fraction q.",answer:.4654,tolerance:.005,hint:"q=(y-z)/(y-x).",steps:["q=(0.551-0.450)/(0.551-0.334)","q=0.465"],marking:["Lever rule","Correct substitution","Liquid fraction"],source:"Week 3 tutorial"}),_e({id:"v6",topic:"vle",kind:"mcq",priority:"must",marks:1,prompt:"What equipment performs a single equilibrium-stage vapour-liquid separation?",options:["Flash drum","Packed absorber","Total condenser"],answer:"Flash drum",hint:"The feed partially vaporises at a set T and P.",steps:["A flash drum separates the equilibrium phases after partial vaporisation."],marking:["Correct equipment"],source:"2022/23 B1(c)"}),_e({id:"v7",topic:"vle",kind:"short",priority:"must",marks:3,prompt:"Why can ordinary distillation not cross an azeotropic composition?",answer:"At an azeotrope x equals y, so vapour and liquid compositions are identical and the separation driving force vanishes.",hint:"State what happens to x and y.",steps:["Define azeotrope: x=y.","No enrichment occurs in an equilibrium stage.","Ordinary distillation cannot pass that composition."],marking:["x=y","No enrichment/driving force","Separation limit"],source:"2024/25 Q2; 2023/24 A4"}),_e({id:"v8",topic:"vle",kind:"mcq",priority:"stretch",marks:2,prompt:"At higher column pressure, what generally happens to the boiling-temperature range?",options:["It shifts upward","It shifts downward","It becomes exactly zero"],answer:"It shifts upward",hint:"A pure component boils when its vapour pressure reaches system pressure.",steps:["Higher system pressure requires higher saturated vapour pressure.","Saturated vapour pressure rises with temperature."],marking:["Correct trend","Physical reason"],source:"2023/24 B2(b)"}),_e({id:"d1",topic:"distillation",kind:"numeric",priority:"must",marks:4,prompt:"F=120 kmol/h, zF=0.65, xD=0.95 and xB=0.10. Find D.",answer:77.647,tolerance:.1,unit:"kmol/h",hint:"D=F(zF-xB)/(xD-xB).",steps:["D=120(0.65-0.10)/(0.95-0.10)","D=77.65 kmol/h","B=42.35 kmol/h"],marking:["Total balance","Component balance","D","Units"],source:"2023/24 B1(b)"}),_e({id:"d2",topic:"distillation",kind:"numeric",priority:"must",marks:2,prompt:"If D=78 kmol/h and R=1.0, find rectifying-section liquid flow L.",answer:78,tolerance:.01,unit:"kmol/h",hint:"R=L/D.",steps:["L=RD=1(78)","L=78 kmol/h"],marking:["Relation","Value"],source:"2023/24 numerical key"}),_e({id:"d3",topic:"distillation",kind:"numeric",priority:"must",marks:2,prompt:"For the same case, find rectifying vapour flow V.",answer:156,tolerance:.01,unit:"kmol/h",hint:"Total-condenser balance gives V=L+D.",steps:["V=(R+1)D","V=2(78)=156 kmol/h"],marking:["Condenser balance","Value"],source:"2023/24 numerical key"}),_e({id:"d4",topic:"distillation",kind:"mcq",priority:"must",marks:1,prompt:"What is the q-line for saturated liquid feed?",options:["Vertical at x=zF","Horizontal at y=zF","The 45-degree diagonal"],answer:"Vertical at x=zF",hint:"Set q=1, where the usual slope expression tends to infinity.",steps:["q=1 corresponds to an infinite q-line slope."],marking:["Correct orientation"],source:"Lec7"}),_e({id:"d5",topic:"distillation",kind:"numeric",priority:"must",marks:3,prompt:"A column needs 12 ideal stages including one partial reboiler. Overall tray efficiency is 70%. How many actual column trays?",answer:16,tolerance:0,unit:"trays",hint:"Remove the reboiler stage before dividing by efficiency.",steps:["Ideal column trays=12-1=11","Actual trays=ceil(11/0.70)","Actual trays=16"],marking:["Stage convention","Efficiency division","Round up"],source:"Lec20 worked example"}),_e({id:"d6",topic:"distillation",kind:"short",priority:"must",marks:3,prompt:"State the consequence of constant molar overflow for a McCabe-Thiele plot.",answer:"Liquid and vapour molar flow rates are constant within each column section, so the operating lines are straight.",hint:"Mention both internal flows and line shape.",steps:["L and V are constant within a section.","Their ratio is constant.","Operating lines are straight."],marking:["Constant internal flows","Within each section","Straight operating lines"],source:"2023/24 A8"}),_e({id:"d7",topic:"distillation",kind:"mcq",priority:"must",marks:2,prompt:"Which limit has the minimum number of stages?",options:["Total reflux","Minimum reflux","Zero boil-up"],answer:"Total reflux",hint:"All condensed liquid returns and operating lines collapse to the diagonal.",steps:["At total reflux the separation driving force per stage is maximised."],marking:["Correct limit","Explanation"],source:"2022/23 A7; aide-memoire"}),_e({id:"d8",topic:"distillation",kind:"numeric",priority:"stretch",marks:3,prompt:"F=250, q=0.67, D=100 and R=1.23 kmol/h basis. Find L-prime below the feed.",answer:290.5,tolerance:1,unit:"kmol/h",hint:"L-prime=RD+qF.",steps:["L=RD=123","qF=167.5","L-prime=290.5 kmol/h"],marking:["Upper liquid flow","Feed liquid contribution","Lower flow"],source:"Lec20 worked example"}),_e({id:"m1",topic:"mccabe",kind:"mcq",priority:"must",marks:2,prompt:"After plotting equilibrium and the diagonal, which operating line is normally constructed first?",options:["Rectifying line","Stripping line","An arbitrary stage line"],answer:"Rectifying line",hint:"Its endpoint and slope follow directly from xD and R.",steps:["Rectifying line uses known (xD,xD) and R.","q-line is then intersected with it.","Stripping line uses that intersection."],marking:["Correct line","Correct construction logic"],source:"Lec8"}),_e({id:"m2",topic:"mccabe",kind:"numeric",priority:"must",marks:2,prompt:"A limiting rectifying line has slope 1/3. Find Rmin.",answer:.5,tolerance:.001,hint:"R=m/(1-m).",steps:["Rmin=(1/3)/(2/3)","Rmin=0.5"],marking:["Slope relation","Correct value"],source:"2023/24 numerical key"}),_e({id:"m3",topic:"mccabe",kind:"short",priority:"must",marks:4,prompt:"Explain why operation at minimum reflux requires infinitely many stages.",answer:"The operating line touches the equilibrium curve at a pinch. The local driving force becomes zero, so stage steps become vanishingly small and an infinite number is required.",hint:"Use the words pinch and driving force.",steps:["Limiting line touches equilibrium.","This is a pinch point.","Mass-transfer driving force tends to zero.","Stage count tends to infinity."],marking:["Touch/intersection","Pinch","Zero driving force","Infinite stages"],source:"Lec10; 2024/25 Q3"}),_e({id:"m4",topic:"mccabe",kind:"mcq",priority:"must",marks:2,prompt:"Where should the staircase switch from rectifying to stripping operating line?",options:["At the operating-line/q-line intersection","Exactly at x=zF on the diagonal","At the first stage only"],answer:"At the operating-line/q-line intersection",hint:"That intersection represents the feed-stage balance.",steps:["The rectifying and stripping lines meet on the q-line.","Switching there gives the optimal feed stage."],marking:["Correct location","Feed-stage link"],source:"Lec8; Week 5 tutorial"}),_e({id:"m5",topic:"mccabe",kind:"mcq",priority:"must",marks:2,prompt:"If R increases while specifications stay fixed, what usually happens?",options:["Fewer stages but higher energy duty","More stages and lower energy duty","No change"],answer:"Fewer stages but higher energy duty",hint:"The operating lines move toward the diagonal.",steps:["Higher reflux increases internal flows and energy.","It also increases separation per stage, reducing stages."],marking:["Stage trend","Energy trend"],source:"Lec9 reflux lecture"}),_e({id:"m6",topic:"mccabe",kind:"numeric",priority:"must",marks:2,prompt:"The ideal construction gives 4 theoretical stages including a partial reboiler. At 60% tray efficiency, how many actual trays are required?",answer:5,tolerance:0,unit:"trays",hint:"There are 3 theoretical column trays.",steps:["Ideal column trays=4-1=3","Actual trays=ceil(3/0.60)=5"],marking:["Remove reboiler","Divide and round up"],source:"2024/25 Q5 numerical key"}),_e({id:"m7",topic:"mccabe",kind:"short",priority:"must",marks:3,prompt:"How do you find liquid temperature on a tray when x-y-T data are supplied?",answer:"Use the tray liquid composition x and interpolate temperature against the liquid/bubble-point x data, not against vapour y.",hint:"Which column of the table represents liquid?",steps:["Identify tray liquid composition x.","Locate adjacent x values in the table.","Interpolate corresponding T."],marking:["Use x","Use bubble-point/liquid data","Interpolate"],source:"2024/25 Q5(d)"}),_e({id:"m8",topic:"mccabe",kind:"short",priority:"stretch",marks:4,prompt:"List the construction order for a complete McCabe-Thiele answer.",answer:"Equilibrium curve and diagonal; mark xD,zF,xB; rectifying line; q-line; stripping line; staircase and feed-stage switch.",hint:"There are six visible construction elements.",steps:["Equilibrium and diagonal","Compositions","Rectifying line","q-line","Stripping line","Stages/feed stage"],marking:["Any four correct ordered elements"],source:"Lec8 revision"}),_e({id:"a1",topic:"absorption",kind:"mcq",priority:"must",marks:1,prompt:"In absorption, where does the solute move?",options:["Gas to liquid","Liquid to gas","Neither phase"],answer:"Gas to liquid",hint:"A solvent scrubs a solute from gas.",steps:["Absorption dissolves gaseous solute in liquid."],marking:["Correct direction"],source:"Lec14"}),_e({id:"a2",topic:"absorption",kind:"numeric",priority:"must",marks:2,prompt:"Find absorption factor for L=50, G=130 and He=0.21.",answer:1.8315,tolerance:.01,hint:"A=L/(G He).",steps:["GHe=130(0.21)=27.3","A=50/27.3=1.83"],marking:["Correct equation","Correct result"],source:"2022/23 B2 style"}),_e({id:"a3",topic:"absorption",kind:"numeric",priority:"must",marks:2,prompt:"A column has 12 real trays at 75% efficiency. How many ideal stages does the tray section supply?",answer:9,tolerance:0,unit:"ideal stages",hint:"Rating: ideal stages=real trays times efficiency.",steps:["Nideal=12(0.75)","Nideal=9"],marking:["Efficiency conversion","Value"],source:"2022/23 B2"}),_e({id:"a4",topic:"absorption",kind:"numeric",priority:"must",marks:3,prompt:"For clean solvent, yIn=0.030, yOut=0.003 and He=0.50. Find (L/G)min.",answer:.45,tolerance:.005,hint:"At minimum, xBottom*=yIn/He.",steps:["xBottom*=0.03/0.50=0.06","(L/G)min=(0.03-0.003)/(0.06-0)","(L/G)min=0.45"],marking:["Equilibrium bottom liquid","Solute balance","Ratio"],source:"Lec16"}),_e({id:"a5",topic:"absorption",kind:"numeric",priority:"stretch",marks:3,prompt:"Fresh solvent absorber: yIn=0.01, A=2 and N=3 ideal stages. Estimate yOut using the Kremser rating relation.",answer:667e-6,tolerance:2e-5,hint:"Use the supplied rating relation with yT*=0.",steps:["Fraction removed=(2-2^4)/(1-2^4)=14/15","yOut=yIn(1-14/15)","yOut=0.000667"],marking:["Rating form","Exponent N+1","Outlet"],source:"Aide-memoire p. 1"}),_e({id:"a6",topic:"absorption",kind:"short",priority:"must",marks:4,prompt:"Give two ways to increase absorption in a fixed five-stage column and explain why.",answer:"Examples: increase solvent flow to raise absorption factor and driving force; lower temperature or raise pressure when this improves solubility; use a better solvent; improve tray efficiency.",hint:"Link each action to A, solubility or effective stages.",steps:["Choose an operating or equipment change.","Name the affected term or driving force.","Explain why removal rises.","Repeat for a second change."],marking:["First valid change","First explanation","Second valid change","Second explanation"],source:"2024/25 Q6(c)"}),_e({id:"a7",topic:"absorption",kind:"mcq",priority:"must",marks:2,prompt:"At minimum absorbent flow, what happens to required ideal stages?",options:["They tend to infinity","They become one","They become zero"],answer:"They tend to infinity",hint:"The operating line reaches a pinch.",steps:["Minimum flow makes the operating line touch equilibrium.","Driving force vanishes at the pinch."],marking:["Correct trend","Pinch reason"],source:"Lec16"}),_e({id:"a8",topic:"absorption",kind:"short",priority:"stretch",marks:3,prompt:"Why use mole ratios X and Y for bulk absorption?",answer:"They express solute relative to solute-free carrier, whose flow is constant, so balances and operating lines remain manageable when solute transfer is not dilute.",hint:"What stays constant?",steps:["Define solute-free basis.","Carrier flows remain constant.","Useful when solute is not dilute."],marking:["Solute-free basis","Constant carrier flow","Bulk-system reason"],source:"Lec17"})],ce=(r,i,l,s,c="must")=>({topic:r,id:i,front:l,back:s,priority:c}),$5=[ce("vle","vf1","What do x, y and z mean?","Liquid, vapour and overall/feed mole fractions."),ce n factor","A=L/(GHe)."),ce("absorption","af6","Stripping factor","S=GHe/L=1/A for the same dilute convention."),ce("absorption","af7","Minimum solvent condition","Operating line pinches/touches equilibrium."),ce("absorption","af8","Stages at minimum solvent","Tend to infinity."),ce("absorption","af9","Design problem","Unknown ideal stage count."),ce("absorption","af10","Rating problem","Fixed equipment; find achieved removal or required flow."),ce("absorption","af11","Bulk liquid ratio","X=x/(1-x)."),ce("absorption","af12","Bulk gas ratio","Y=y/(1-y)."),ce("absorption","af13","Ideal stages from real trays","Nideal=Nreal times fractional efficiency."),ce("absorption","af14","Increase absorption factor","Increase L, decrease G, or improve equilibrium affinity."),ce("absorption","af15","Pressure trend","Higher pressure usually favours gas absorption."),ce("absorption","af16","Temperature trend","Lower temperature usually favours gas solubility.")],P5=[{group:"VLE",name:"Antoine",latex:"\\log_{10}P=A-\\frac{B}{T+C}",use:"Copy the exact coefficient convention and units supplied."},{group:"VLE",name:"Raoult + Dalton",latex:"p_i=x_iP_i^*,\\quad P=\\sum p_i,\\quad y_i=p_i/P",use:"Ideal-mixture phase equilibrium."},{group:"VLE",name:"Relative volatility curve",latex:"y=\\frac{\\alpha x}{1+(\\alpha-1)x}",use:"Build xy data from constant alpha."},{group:"Flash",name:"Lever rule",latex:"z_F=qx+(1-q)y,\\quad q=\\frac{y-z_F}{y-x}",use:"Liquid fraction in a one-stage flash."},{group:"Distillation",name:"Product balances",latex:"F=D+B,\\quad Fz_F=Dx_D+Bx_B",use:"Always solve external flows first."},{group:"Distillation",name:"Rectifying line",latex:"y=\\frac{R}{R+1}x+\\frac{x_D}{R+1}",use:"Total condenser under CMO."},{group:"Distillation",name:"Feed line",latex:"y=\\frac{q}{q-1}x-\\frac{z_F}{q-1}",use:"Remember special vertical q=1 case."},{group:"Distillation",name:"Stripping line",latex:"y=\\frac{L'}{V'}x-\\frac{B}{V'}x_B",use:"Or connect (xB,xB) to feed intersection."},{group:"
