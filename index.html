 liquid there. Below the lower curve is liquid, above the upper curve is vapour, and between them are two phases.",steps:["Draw a horizontal tie-line at the stated temperature.","Read liquid x from the bubble curve.","Read vapour y from the dew curve.","Use the lever rule only after x, z and y are marked."]},{heading:"Why the vapour is richer",body:"For an ordinary zeotropic mixture, the MVC has the larger saturated vapour pressure, so the equilibrium vapour is richer in MVC than the liquid: y > x. The equilibrium curve therefore lies above y = x."}],examMove:"On any phase diagram question, label axes, MVC, both pure boiling points, both curves and all three regions before doing arithmetic.",traps:["Swapping x and y","Calling the upper Txy curve the bubble curve","Using mass fraction when the plot uses mole fraction"],source:"Lecture 2; Lec3a; Lec20 pp. 2-6; 2024/25 Q1-Q2"},{id:"vle-raoult",topic:"vle",title:"Raoult + Dalton without panic",eyebrow:"VLE 2 of 4",minutes:25,priority:"must",objective:"Calculate bubble pressure and equilibrium vapour composition for an ideal binary mixture.",blocks:[{heading:"The chain that earns the marks",body:"Raoult gives a component partial pressure from the liquid. Dalton adds partial pressures and converts them to vapour fractions.",formula:"p_i=x_iP_i^*,\\quad P=\\sum p_i,\\quad y_i=\\frac{p_i}{P}"},{heading:"Binary shortcut",body:"For component A with xB = 1 - xA, substitute directly. Keep all pressures in the same unit.",formula:"P=x_AP_A^*+(1-x_A)P_B^*"},{heading:"Worked micro-example",body:"At 70 C, take pA*=0.734 bar, pB*=0.116 bar and xA=0.30. P=0.30(0.734)+0.70(0.116)=0.301 bar. Then yA=0.30(0.734)/0.301=0.731.",note:"Sanity: P lies between the two pure vapour pressures and yA > xA."}],examMove:"Show one complete row of sample calculations before tabulating points for a Pxy or Txy plot.",traps:["Mixing bar and mmHg","Forgetting xB=1-xA","Using total pressure where saturated vapour pressure is required"],source:"Week 1 tutorial; Lecture 2; aide-memoire p. 1"},{id:"vle-antoine-alpha",topic:"vle",title:"Antoine, relative volatility and azeotropes",eyebrow:"VLE 3 of 4",minutes:24,priority:"must",objective:"Use the supplied Antoine form correctly and move between x and y with relative volatility.",blocks:[{heading:"Copy the exact Antoine convention",body:"The notes use more than one coefficient convention. Inspect whether the equation uses log10 or ln, and whether T is C or K. Never mix coefficients from one form with another.",formula:"\\log_{10}P=A-\\frac{B}{T+C}"},{heading:"Constant relative volatility",body:"Alpha measures how much more readily A enters vapour than B. If alpha > 1 and A is the MVC, use the binary equilibrium relation to build an xy curve.",formula:"\\alpha_{AB}=\\frac{K_A}{K_B},\\qquad y_A=\\frac{\\alpha x_A}{1+(\\alpha-1)x_A}"},{heading:"Azeotrope",body:"At an azeotrope, x=y and liquid and vapour have the same composition. Ordinary distillation cannot cross that composition because the driving force disappears.",note:"A curve crossing y=x is not a harmless detail; it is a separation limit."}],examMove:"Write the Antoine convention and units above the first calculation; then test pure-component boiling points where P*=column pressure.",traps:["Assuming every Antoine table uses log10","Calling alpha a vapour fraction","Claiming more stages can cross an azeotrope"],source:"Week 2 tutorial; Lec3a; 2023/24 B2; 2024/25 Q2"},{id:"vle-flash",topic:"vle",title:"Flash calculation: one stage, one picture",eyebrow:"VLE 4 of 4",minutes:28,priority:"must",objective:"Find outlet phase compositions and liquid fraction from a flash drum.",blocks:[{heading:"What a flash drum does",body:"A feed is brought to a pressure and temperature where it partially vaporises, then the equilibrium liquid and vapour are separated. It is one equilibrium stage, unlike a multistage distillation column."},{heading:"The feed balance",body:"q is the liquid fraction L/F and 1-q is V/F. Overall composition lies between x and y.",formula:"z_F=qx+(1-q)y,\\qquad q=\\frac{y-z_F}{y-x}"},{heading:"Graphical method",body:"At a specified T and P, read x and y from the tie-line on Txy, then apply the lever rule. If q and z are given, draw the flash/q line through (z,z) with slope q/(q-1) and intersect equilibrium.",steps:["Check whether the feed point is inside the two-phase envelope.","Read or calculate equilibrium x and y.","Use the lever rule for q.","Report L=qF and V=(1-q)F if a flow is supplied."]}],examMove:"State the physical phase check before iterating. If the trial q leaves [0,1], the assumed two-phase state is wrong.",traps:["Using q as vapour fraction","Reporting x and y without L and V when F is given","Confusing flash with differential batch distillation"],source:"Lec4; Week 3 tutorial; 2022/23 B1(b-c); 2023/24 B2(d)"},{id:"dist-column",topic:"distillation",title:"Column anatomy and the two balances",eyebrow:"Distillation 1 of 4",minutes:20,priority:"must",objective:"Sketch a column and calculate distillate and bottoms flows immediately.",blocks:[{heading:"Sketch first",body:"Draw feed F,zF; top distillate D,xD; bottom product B,xB; condenser and reboiler. Use MVC composition everywhere. This sketch prevents most sign and stream errors."},{heading:"Two equations solve two product flows",body:"Use the total balance and the MVC component balance together.",formula:"F=D+B,\\qquad Fz_F=Dx_D+Bx_B"},{heading:"Fast solution",body:"Eliminate B to get D directly, then B=F-D.",formula:"D=F\\frac{z_F-x_B}{x_D-x_B}"}],examMove:"Write units on every flow and verify D+B=F plus xB<zF<xD.",traps:["Using the bottoms fraction of the less volatile component without conversion","Mixing zF and xF notation","Skipping the labelled process sketch"],source:"Lec5; Week 4 tutorial; all three past papers"},{id:"dist-cmo-flows",topic:"distillation",title:"CMO, reflux and internal flows",eyebrow:"Distillation 2 of 4",minutes:28,priority:"must",objective:"Translate reflux ratio and feed condition into every internal flow.",blocks:[{heading:"Constant molar overflow",body:"Equal molar latent heats, negligible heat losses and sensible-heat effects imply constant L and V within each column section. That makes operating lines straight."},{heading:"Above the feed",body:"For a total condenser, reflux ratio R=L/D. A condenser balance gives V=L+D.",formula:"L=RD,\\qquad V=(R+1)D"},{heading:"Across the feed stage",body:"A fraction q of feed joins liquid and 1-q joins vapour. Primed flows denote below-feed values.",formula:"L'=L+qF,\\qquad V'=V-(1-q)F"},{heading:"Thermal-condition memory",body:"q>1 cold liquid; q=1 saturated liquid; 0<q<1 two-phase; q=0 saturated vapour; q<0 superheated vapour."}],examMove:"Make a four-row table for L, V, L-prime and V-prime rather than trying to remember directions mid-answer.",traps:["Using R=V/D","Adding vapour feed to V-prime with the wrong sign","Assuming q always lies between zero and one"],source:"Lec6; Lec7; Lec9; Week 4 tutorial"},{id:"dist-lines",topic:"distillation",title:"Operating lines and the q-line",eyebrow:"Distillation 3 of 4",minutes:32,priority:"must",objective:"Construct and derive rectifying, stripping and feed lines.",blocks:[{heading:"Rectifying line",body:"A balance around the condenser and stages above the feed gives a line through (xD,xD). Its slope is R/(R+1).",formula:"y=\\frac{R}{R+1}x+\\frac{x_D}{R+1}"},{heading:"Feed line",body:"The q-line always passes through (zF,zF). Its slope identifies feed condition.",formula:"y=\\frac{q}{q-1}x-\\frac{z_F}{q-1}"},{heading:"Stripping line",body:"Under CMO the lower line is y=(L-prime/V-prime)x-(B/V-prime)xB. Graphically, connect (xB,xB) to the rectifying/q-line intersection.",formula:"y=\\frac{L'}{V'}x-\\frac{B}{V'}x_B"},{heading:"Five q-line shapes",body:"q=1 vertical; q=0 horizontal; 0<q<1 negative slope; q>1 slope greater than one; q<0 positive slope below one."}],examMove:"For a derivation, draw the control volume, state CMO, write total and component balances, then rearrange. A memorised final line alone will not earn derivation marks.",traps:["Wrong q-line intercept sign","Forgetting both operating lines meet on the q-line","Drawing a saturated-vapour feed vertically"],source:"Lec7; Lec12-Lec13; aide-memoire p. 2; 2024/25 Q3-Q4"},{id:"dist-limits",topic:"distillation",title:"Limits, efficiency and energy",eyebrow:"Distillation 4 of 4",minutes:26,priority:"stretch",objective:"Explain minimum reflux, total reflux, real trays and heat duties.",blocks:[{heading:"Two opposite limits",body:"At total reflux, no products are withdrawn and both operating lines become y=x; stages are minimum but energy is maximum. At minimum reflux, a pinch creates an infinite-stage requirement."},{heading:"From ideal stages to real trays",body:"First remove equilibrium stages supplied by a partial reboiler or partial condenser if the question calls them stages, then divide column trays by overall efficiency and round up.",formula:"N_{actual}=\\left\\lceil\\frac{N_{ideal,trays}}{E_o}\\right\\rceil"},{heading:"Fenske at total reflux",body:"For constant relative volatility, the supplied handout gives the minimum theoretical stages.",formula:"N_{min}=\\frac{\\log\\left[\\frac{x_D(1-x_B)}{(1-x_D)x_B}\\right]}{\\log\\alpha}"},{heading:"Energy under CMO",body:"With latent heat lambda and vapour rate V, idealised condenser and reboiler duties are approximately V lambda, with signs depending on the energy convention."}],examMove:"State which condenser/reboiler counts as an equilibrium stage before reporting stage and plate totals.",traps:["Rounding down actual trays","Counting a total condenser as a theoretical stage","Saying minimum reflux means minimum energy"],source:"Lec9-Lec11; Week 5 tutorial; aide-memoire p. 2"},{id:"mc-setup",topic:"mccabe",title:"The construction recipe",eyebrow:"McCabe 1 of 4",minutes:25,priority:"must",objective:"Reproduce the complete construction in the correct order.",blocks:[{heading:"The non-negotiable plot",body:"Use square axes from 0 to 1. Plot equilibrium y*(x), the 45-degree diagonal, and mark xD, zF and xB. Accuracy here controls every later mark."},{heading:"Build lines in order",body:"Draw the rectifying line from (xD,xD), then the q-line through (zF,zF), then the stripping line from their intersection to (xB,xB).",steps:["Equilibrium curve and diagonal","Product/feed compositions","Rectifying line","q-line","Stripping line","Stage staircase and feed-stage switch"]},{heading:"Step stages",body:"Start at (xD,xD). Move horizontally to equilibrium, vertically to the active operating line, and repeat. Switch lines at the feed intersection. Stop when the horizontal step reaches or passes xB."}],examMove:"Use a ruler, label every line, and write the calculated slope/intercept beside it. Construction marks survive even if the final count is off by one.",traps:["Starting at xB","Stepping between the operating line and diagonal","Changing operating line at zF rather than at the line intersection"],source:"Lec8; Lec20 pp. 8-16; Week 5 tutorial"},{id:"mc-rmin",topic:"mccabe",title:"Minimum reflux and the pinch",eyebrow:"McCabe 2 of 4",minutes:22,priority:"must",objective:"Find Rmin graphically and explain its physical meaning.",blocks:[{heading:"The pinch construction",body:"Draw the feed q-line. Find its relevant intersection with the equilibrium curve. Connect that pinch point to (xD,xD); this is the limiting rectifying line."},{heading:"Read Rmin from slope",body:"If the limiting line slope is m, compare it with m=R/(R+1).",formula:"R_{min}=\\frac{m}{1-m}"},{heading:"Why not operate there?",body:"At the pinch the operating and equilibrium lines meet, the local mass-transfer driving force tends to zero, and infinitely many ideal stages are needed. Design R is commonly a multiple of Rmin."}],examMove:"Mark and name the pinch point; a line with no physical explanation leaves definition marks behind.",traps:["Using the slope itself as Rmin","Connecting the pinch to the origin","Calling total reflux and minimum reflux the same condition"],source:"Lec10; 2023/24 B1(d-e); 2024/25 Q3"},{id:"mc-read",topic:"mccabe",title:"Read hidden data from a diagram",eyebrow:"McCabe 3 of 4",minutes:30,priority:"must",objective:"Extract R, q, flows, feed condition and feed position from coordinates.",blocks:[{heading:"Recover reflux ratio",body:"Take two points on the rectifying line, calculate slope m, then use R=m/(1-m). Its y-intercept should also equal xD/(R+1)."},{heading:"Recover q",body:"Take two q-line points to find slope s. Since s=q/(q-1), rearrange.",formula:"q=\\frac{s}{s-1}"},{heading:"Recover flows",body:"Use product balances for D and B, then L=RD and V=(R+1)D. Feed condition gives L-prime and V-prime."},{heading:"Diagnose feed location",body:"The optimal feed stage is where the staircase naturally changes from the rectifying to stripping operating line. A drawn switch elsewhere represents non-optimal feed placement."}],examMove:"Write coordinates used for every slope; that turns a ruler reading into auditable working.",traps:["Reading q directly from q-line slope","Using a visually estimated intercept without coordinates","Counting the feed stage twice"],source:"Week 4 and Week 5 tutorials; Lec20 pp. 15-16"},{id:"mc-design",topic:"mccabe",title:"A full design answer",eyebrow:"McCabe 4 of 4",minutes:38,priority:"must",objective:"Combine balances, lines, stages, efficiency and temperatures in exam order.",blocks:[{heading:"The seven-part answer",body:"A full design usually asks for product flows, equilibrium plot, operating lines, stage count, feed stage, real plates and perhaps temperature/energy.",steps:["Solve D and B.","Plot equilibrium data smoothly.","Construct rectifying and q-lines.","Construct stripping line.","Step and count stages/feed stage.","Apply efficiency only to real trays.","Interpolate temperature from VLE data if requested."]},{heading:"Use the table twice",body:"An x-y-T table supplies both the equilibrium curve and liquid bubble-point temperature. For a liquid plate composition, interpolate T against x, not y."},{heading:"Reasonableness",body:"A feasible result should have positive product/internal flows, operating lines below equilibrium for ordinary distillation, and more real trays than ideal trays when efficiency is below 100%."}],examMove:"Box separate answers for stages, column trays, actual trays and feed tray. Ambiguous counting is an avoidable mark loss.",traps:["Interpolating plate temperature against vapour composition","Applying efficiency to a total condenser","Omitting the partial reboiler from stage count when it is an equilibrium stage"],source:"Lec11; 2024/25 Q5 and official numerical key"},{id:"abs-language",topic:"absorption",title:"Absorption versus stripping",eyebrow:"Absorption 1 of 4",minutes:18,priority:"must",objective:"Identify flow directions, solute transfer and the correct basis.",blocks:[{heading:"Direction of transfer",body:"Absorption transfers soluble gas into liquid; stripping transfers dissolved solute from liquid into gas. Counter-current columns maximise driving force."},{heading:"Dilute versus bulk coordinates",body:"Dilute problems often use mole fractions x and y with nearly constant carrier flows. Bulk systems use solute-free mole ratios X=x/(1-x) and Y=y/(1-y) so carrier flow rates remain constant.",formula:"X=\\frac{x}{1-x},\\qquad Y=\\frac{y}{1-y}"},{heading:"Henry equilibrium",body:"For a linear dilute system, equilibrium is y*=He x. The operating line and equilibrium line must use compatible concentration coordinates.",formula:"y^*=H_e x"}],examMove:"Draw arrows and label gas bottom-to-top, liquid top-to-bottom before writing a balance.",traps:["Calling stripping absorption","Mixing mole ratios and mole fractions on one line","Treating Henry constant as automatically dimensional or dimensionless"],source:"Lec14; Lec17; reference notation guide"},{id:"abs-lines",topic:"absorption",title:"Operating lines and minimum solvent",eyebrow:"Absorption 2 of 4",minutes:28,priority:"must",objective:"Construct the absorber line and identify the limiting liquid flow.",blocks:[{heading:"Operating-line slope",body:"For dilute counter-current absorption with constant carrier flows, a solute balance gives an operating-line slope L/G. The equilibrium-line slope is He.",formula:"G(y_B-y_T)=L(x_B-x_T)"},{heading:"Absorption factor",body:"A compares operating-line slope with equilibrium-line slope. Larger A generally means easier absorption.",formula:"A=\\frac{L}{G H_e}"},{heading:"Minimum L/G",body:"Reducing L rotates the operating line toward equilibrium. At minimum flow, the line touches equilibrium at a pinch and an infinite stage count results.",formula:"\\left(\\frac{L}{G}\\right)_{min}=\\frac{y_B-y_T}{x_B^*-x_T}"}],examMove:"For clean solvent xT=0 and linear equilibrium, calculate xB*=yB/He before the minimum-flow balance.",traps:["Using G/L for an absorber plot drawn y versus x","Operating exactly at minimum flow","Using outlet gas rather than inlet gas for bottom equilibrium"],source:"Lec14-Lec16; Lec20 pp. 17-19; 2024/25 Q6"},{id:"abs-kremser",topic:"absorption",title:"Kremser design and rating",eyebrow:"Absorption 3 of 4",minutes:34,priority:"must",objective:"Choose the right Kremser form and distinguish design from rating.",blocks:[{heading:"Design problem",body:"Use when inlet/outlet targets and flow conditions are known but the ideal stage count N is required. Evaluate logarithms with a consistent base.",formula:"N=\\frac{\\log\\left[(1-A^{-1})\\frac{y_B-y_T^*}{y_T-y_T^*}+A^{-1}\\right]}{\\log A}"},{heading:"Rating problem",body:"Use when N is fixed and you need achieved removal, absorption factor or flow.",formula:"\\frac{y_B-y_T}{y_B-y_T^*}=\\frac{A-A^{N+1}}{1-A^{N+1}}"},{heading:"At A near one",body:"Direct calculator evaluation suffers cancellation when A is nearly one. Use the limiting stage relation or a stable calculator implementation."},{heading:"Real trays",body:"Convert physical trays to ideal stages with efficiency when rating an existing column: ideal stages = real trays times fractional efficiency."}],examMove:"Write “design” or “rating” above the chosen equation and define yT* before substituting.",traps:["Using real trays as N in Kremser","Forgetting N+1 in the rating exponent","Using percent removal as a mole fraction"],source:"Lec15; aide-memoire pp. 1-2; Week 8 tutorial; 2022/23 B2"},{id:"abs-improve",topic:"absorption",title:"Make an absorber work harder",eyebrow:"Absorption 4 of 4",minutes:22,priority:"stretch",objective:"Propose physically defensible improvements when a fixed column misses its target.",blocks:[{heading:"Four levers",body:"Increase solvent flow, increase effective stages/efficiency, choose a solvent with stronger affinity, or change pressure/temperature to favour absorption."},{heading:"Pressure and temperature",body:"Gas solubility usually improves at higher pressure and lower temperature, but always interpret the given Henry-law convention: a smaller equilibrium y at a given x means stronger absorption driving force."},{heading:"Multiple columns",body:"If available columns each have a fixed ideal-stage capacity, divide the required ideal stages by stages per column and round up. Series operation increases total stages."},{heading:"Explain, do not list",body:"Tie each proposal to A, the operating-line distance from equilibrium, or the effective stage count. A bare list earns fewer marks than cause and effect."}],examMove:"For “propose a strategy,” give the change, the equation/diagram term it alters, and why removal increases.",traps:["Suggesting operation at the pinch","Increasing temperature without checking Henry behaviour","Rounding the number of columns down"],source:"Lec16-Lec17; 2022/23 B2(c); 2024/25 Q6(c)"}],Ve=l=>l,P5=[Ve({id:"v1",topic:"vle",kind:"mcq",priority:"must",marks:1,prompt:"On a constant-pressure Txy diagram, which curve is normally lower?",options:["Bubble-point curve","Dew-point curve","They always coincide"],answer:"Bubble-point curve",hint:"Imagine heating a liquid from a low temperature.",steps:["The liquid first reaches its bubble point.","Further heating through the two-phase region reaches the dew curve."],marking:["Correct curve"],source:"Lecture 2"}),Ve({id:"v2",topic:"vle",kind:"numeric",priority:"must",marks:3,prompt:"At 70 C, pA*=0.734 bar and pB*=0.116 bar. Find total pressure for xA=0.30.",answer:.3014,tolerance:.002,unit:"bar",hint:"Use xA pA* + (1-xA)pB*.",steps:["xB=0.70","P=0.30(0.734)+0.70(0.116)","P=0.3014 bar"],marking:["Binary composition","Raoult sum","Correct value and unit"],source:"Week 1 tutorial"}),Ve({id:"v3",topic:"vle",kind:"numeric",priority:"must",marks:2,prompt:"Using the previous mixture, find yA at xA=0.30.",answer:.7306,tolerance:.003,hint:"Divide A partial pressure by total pressure.",steps:["pA=0.30(0.734)=0.2202 bar","yA=0.2202/0.3014=0.731"],marking:["Partial pressure","Vapour fraction"],source:"Week 1 tutorial"}),Ve({id:"v4",topic:"vle",kind:"numeric",priority:"must",marks:2,prompt:"For alpha=3 and xA=0.40, find equilibrium yA.",answer:.6667,tolerance:.003,hint:"Use alpha x/[1+(alpha-1)x].",steps:["Numerator=1.2","Denominator=1+2(0.4)=1.8","yA=0.667"],marking:["Correct relation","Correct result"],source:"2023/24 B1 style"}),Ve({id:"v5",topic:"vle",kind:"numeric",priority:"must",marks:3,prompt:"A flash has x=0.334, y=0.551 and zF=0.45. Find liquid fraction q.",answer:.4654,tolerance:.005,hint:"q=(y-z)/(y-x).",steps:["q=(0.551-0.450)/(0.551-0.334)","q=0.465"],marking:["Lever rule","Correct substitution","Liquid fraction"],source:"Week 3 tutorial"}),Ve({id:"v6",topic:"vle",kind:"mcq",priority:"must",marks:1,prompt:"What equipment performs a single equilibrium-stage vapour-liquid separation?",options:["Flash drum","Packed absorber","Total condenser"],answer:"Flash drum",hint:"The feed partially vaporises at a set T and P.",steps:["A flash drum separates the equilibrium phases after partial vaporisation."],marking:["Correct equipment"],source:"2022/23 B1(c)"}),Ve({id:"v7",topic:"vle",kind:"short",priority:"must",marks:3,prompt:"Why can ordinary distillation not cross an azeotropic composition?",answer:"At an azeotrope x equals y, so vapour and liquid compositions are identical and the separation driving force vanishes.",hint:"State what happens to x and y.",steps:["Define azeotrope: x=y.","No enrichment occurs in an equilibrium stage.","Ordinary distillation cannot pass that composition."],marking:["x=y","No enrichment/driving force","Separation limit"],source:"2024/25 Q2; 2023/24 A4"}),Ve({id:"v8",topic:"vle",kind:"mcq",priority:"stretch",marks:2,prompt:"At higher column pressure, what generally happens to the boiling-temperature range?",options:["It shifts upward","It shifts downward","It becomes exactly zero"],answer:"It shifts upward",hint:"A pure component boils when its vapour pressure reaches system pressure.",steps:["Higher system pressure requires higher saturated vapour pressure.","Saturated vapour pressure rises with temperature."],marking:["Correct trend","Physical reason"],source:"2023/24 B2(b)"}),Ve({id:"d1",topic:"distillation",kind:"numeric",priority:"must",marks:4,prompt:"F=120 kmol/h, zF=0.65, xD=0.95 and xB=0.10. Find D.",answer:77.647,tolerance:.1,unit:"kmol/h",hint:"D=F(zF-xB)/(xD-xB).",steps:["D=120(0.65-0.10)/(0.95-0.10)","D=77.65 kmol/h","B=42.35 kmol/h"],marking:["Total balance","Component balance","D","Units"],source:"2023/24 B1(b)"}),Ve({id:"d2",topic:"distillation",kind:"numeric",priority:"must",marks:2,prompt:"If D=78 kmol/h and R=1.0, find rectifying-section liquid flow L.",answer:78,tolerance:.01,unit:"kmol/h",hint:"R=L/D.",steps:["L=RD=1(78)","L=78 kmol/h"],marking:["Relation","Value"],source:"2023/24 numerical key"}),Ve({id:"d3",topic:"distillation",kind:"numeric",priority:"must",marks:2,prompt:"For the same case, find rectifying vapour flow V.",answer:156,tolerance:.01,unit:"kmol/h",hint:"Total-condenser balance gives V=L+D.",steps:["V=(R+1)D","V=2(78)=156 kmol/h"],marking:["Condenser balance","Value"],source:"2023/24 numerical key"}),Ve({id:"d4",topic:"distillation",kind:"mcq",priority:"must",marks:1,prompt:"What is the q-line for saturated liquid feed?",options:["Vertical at x=zF","Horizontal at y=zF","The 45-degree diagonal"],answer:"Vertical at x=zF",hint:"Set q=1, where the usual slope expression tends to infinity.",steps:["q=1 corresponds to an infinite q-line slope."],marking:["Correct orientation"],source:"Lec7"}),Ve({id:"d5",topic:"distillation",kind:"numeric",priority:"must",marks:3,prompt:"A column needs 12 ideal stages including one partial reboiler. Overall tray efficiency is 70%. How many actual column trays?",answer:16,tolerance:0,unit:"trays",hint:"Remove the reboiler stage before dividing by efficiency.",steps:["Ideal column trays=12-1=11","Actual trays=ceil(11/0.70)","Actual trays=16"],marking:["Stage convention","Efficiency division","Round up"],source:"Lec20 worked example"}),Ve({id:"d6",topic:"distillation",kind:"short",priority:"must",marks:3,prompt:"State the consequence of constant molar overflow for a McCabe-Thiele plot.",answer:"Liquid and vapour molar flow rates are constant within each column section, so the operating lines are straight.",hint:"Mention both internal flows and line shape.",steps:["L and V are constant within a section.","Their ratio is constant.","Operating lines are straight."],marking:["Constant internal flows","Within each section","Straight operating lines"],source:"2023/24 A8"}),Ve({id:"d7",topic:"distillation",kind:"mcq",priority:"must",marks:2,prompt:"Which limit has the minimum number of stages?",options:["Total reflux","Minimum reflux","Zero boil-up"],answer:"Total reflux",hint:"All condensed liquid returns and operating lines collapse to the diagonal.",steps:["At total reflux the separation driving force per stage is maximised."],marking:["Correct limit","Explanation"],source:"2022/23 A7; aide-memoire"}),Ve({id:"d8",topic:"distillation",kind:"numeric",priority:"stretch",marks:3,prompt:"F=250, q=0.67, D=100 and R=1.23 kmol/h basis. Find L-prime below the feed.",answer:290.5,tolerance:1,unit:"kmol/h",hint:"L-prime=RD+qF.",steps:["L=RD=123","qF=167.5","L-prime=290.5 kmol/h"],marking:["Upper liquid flow","Feed liquid contribution","Lower flow"],source:"Lec20 worked example"}),Ve({id:"m1",topic:"mccabe",kind:"mcq",priority:"must",marks:2,prompt:"After plotting equilibrium and the diagonal, which operating line is normally constructed first?",options:["Rectifying line","Stripping line","An arbitrary stage line"],answer:"Rectifying line",hint:"Its endpoint and slope follow directly from xD and R.",steps:["Rectifying line uses known (xD,xD) and R.","q-line is then intersected with it.","Stripping line uses that intersection."],marking:["Correct line","Correct construction logic"],source:"Lec8"}),Ve({id:"m2",topic:"mccabe",kind:"numeric",priority:"must",marks:2,prompt:"A limiting rectifying line has slope 1/3. Find Rmin.",answer:.5,tolerance:.001,hint:"R=m/(1-m).",steps:["Rmin=(1/3)/(2/3)","Rmin=0.5"],marking:["Slope relation","Correct value"],source:"2023/24 numerical key"}),Ve({id:"m3",topic:"mccabe",kind:"short",priority:"must",marks:4,prompt:"Explain why operation at minimum reflux requires infinitely many stages.",answer:"The operating line touches the equilibrium curve at a pinch. The local driving force becomes zero, so stage steps become vanishingly small and an infinite number is required.",hint:"Use the words pinch and driving force.",steps:["Limiting line touches equilibrium.","This is a pinch point.","Mass-transfer driving force tends to zero.","Stage count tends to infinity."],marking:["Touch/intersection","Pinch","Zero driving force","Infinite stages"],source:"Lec10; 2024/25 Q3"}),Ve({id:"m4",topic:"mccabe",kind:"mcq",priority:"must",marks:2,prompt:"Where should the staircase switch from rectifying to stripping operating line?",options:["At the operating-line/q-line intersection","Exactly at x=zF on the diagonal","At the first stage only"],answer:"At the operating-line/q-line intersection",hint:"That intersection represents the feed-stage balance.",steps:["The rectifying and stripping lines meet on the q-line.","Switching there gives the optimal feed stage."],marking:["Correct location","Feed-stage link"],source:"Lec8; Week 5 tutorial"}),Ve({id:"m5",topic:"mccabe",kind:"mcq",priority:"must",marks:2,prompt:"If R increases while specifications stay fixed, what usually happens?",options:["Fewer stages but higher energy duty","More stages and lower energy duty","No change"],answer:"Fewer stages but higher energy duty",hint:"The operating lines move toward the diagonal.",steps:["Higher reflux increases internal flows and energy.","It also increases separation per stage, reducing stages."],marking:["Stage trend","Energy trend"],source:"Lec9 reflux lecture"}),Ve({id:"m6",topic:"mccabe",kind:"numeric",priority:"must",marks:2,prompt:"The ideal construction gives 4 theoretical stages including a partial reboiler. At 60% tray efficiency, how many actual trays are required?",answer:5,tolerance:0,unit:"trays",hint:"There are 3 theoretical column trays.",steps:["Ideal column trays=4-1=3","Actual trays=ceil(3/0.60)=5"],marking:["Remove reboiler","Divide and round up"],source:"2024/25 Q5 numerical key"}),Ve({id:"m7",topic:"mccabe",kind:"short",priority:"must",marks:3,prompt:"How do you find liquid temperature on a tray when x-y-T data are supplied?",answer:"Use the tray liquid composition x and interpolate temperature against the liquid/bubble-point x data, not against vapour y.",hint:"Which column of the table represents liquid?",steps:["Identify tray liquid composition x.","Locate adjacent x values in the table.","Interpolate corresponding T."],marking:["Use x","Use bubble-point/liquid data","Interpolate"],source:"2024/25 Q5(d)"}),Ve({id:"m8",topic:"mccabe",kind:"short",priority:"stretch",marks:4,prompt:"List the construction order for a complete McCabe-Thiele answer.",answer:"Equilibrium curve and diagonal; mark xD,zF,xB; rectifying line; q-line; stripping line; staircase and feed-stage switch.",hint:"There are six visible construction elements.",steps:["Equilibrium and diagonal","Compositions","Rectifying line","q-line","Stripping line","Stages/feed stage"],marking:["Any four correct ordered elements"],source:"Lec8 revision"}),Ve({id:"a1",topic:"absorption",kind:"mcq",priority:"must",marks:1,prompt:"In absorption, where does the solute move?",options:["Gas to liquid","Liquid to gas","Neither phase"],answer:"Gas to liquid",hint:"A solvent scrubs a solute from gas.",steps:["Absorption dissolves gaseous solute in liquid."],marking:["Correct direction"],source:"Lec14"}),Ve({id:"a2",topic:"absorption",kind:"numeric",priority:"must",marks:2,prompt:"Find absorption factor for L=50, G=130 and He=0.21.",answer:1.8315,tolerance:.01,hint:"A=L/(G He).",steps:["GHe=130(0.21)=27.3","A=50/27.3=1.83"],marking:["Correct equation","Correct result"],source:"2022/23 B2 style"}),Ve({id:"a3",topic:"absorption",kind:"numeric",priority:"must",marks:2,prompt:"A column has 12 real trays at 75% efficiency. How many ideal stages does the tray section supply?",answer:9,tolerance:0,unit:"ideal stages",hint:"Rating: ideal stages=real trays times efficiency.",steps:["Nideal=12(0.75)","Nideal=9"],marking:["Efficiency conversion","Value"],source:"2022/23 B2"}),Ve({id:"a4",topic:"absorption",kind:"numeric",priority:"must",marks:3,prompt:"For clean solvent, yIn=0.030, yOut=0.003 and He=0.50. Find (L/G)min.",answer:.45,tolerance:.005,hint:"At minimum, xBottom*=yIn/He.",steps:["xBottom*=0.03/0.50=0.06","(L/G)min=(0.03-0.003)/(0.06-0)","(L/G)min=0.45"],marking:["Equilibrium bottom liquid","Solute balance","Ratio"],source:"Lec16"}),Ve({id:"a5",topic:"absorption",kind:"numeric",priority:"stretch",marks:3,prompt:"Fresh solvent absorber: yIn=0.01, A=2 and N=3 ideal stages. Estimate yOut using the Kremser rating relation.",answer:667e-6,tolerance:2e-5,hint:"Use the supplied rating relation with yT*=0.",steps:["Fraction removed=(2-2^4)/(1-2^4)=14/15","yOut=yIn(1-14/15)","yOut=0.000667"],marking:["Rating form","Exponent N+1","Outlet"],source:"Aide-memoire p. 1"}),Ve({id:"a6",topic:"absorption",kind:"short",priority:"must",marks:4,prompt:"Give two ways to increase absorption in a fixed five-stage column and explain why.",answer:"Examples: increase solvent flow to raise absorption factor and driving force; lower temperature or raise pressure when this improves solubility; use a better solvent; improve tray efficiency.",hint:"Link each action to A, solubility or effective stages.",steps:["Choose an operating or equipment change.","Name the affected term or driving force.","Explain why removal rises.","Repeat for a second change."],marking:["First valid change","First explanation","Second valid change","Second explanation"],source:"2024/25 Q6(c)"}),Ve({id:"a7",topic:"absorption",kind:"mcq",priority:"must",marks:2,prompt:"At minimum absorbent flow, what happens to required ideal stages?",options:["They tend to infinity","They become one","They become zero"],answer:"They tend to infinity",hint:"The operating line reaches a pinch.",steps:["Minimum flow makes the operating line touch equilibrium.","Driving force vanishes at the pinch."],marking:["Correct trend","Pinch reason"],source:"Lec16"}),Ve({id:"a8",topic:"absorption",kind:"short",priority:"stretch",marks:3,prompt:"Why use mole ratios X and Y for bulk absorption?",answer:"They express solute relative to solute-free carrier, whose flow is constant, so balances and operating lines remain manageable when solute transfer is not dilute.",hint:"What stays constant?",steps:["Define solute-free basis.","Carrier flows remain constant.","Useful when solute is not dilute."],marking:["Solute-free basis","Constant carrier flow","Bulk-system reason"],source:"Lec17"})],ce=(l,i,r,o,c="must")=>({topic:l,id:i,front:r,back:o,priority:c}),e3=[ce("vle","vf1","What do x, y and z mean?","Liquid, vapour and overall/feed mole fractions."),ce =1-beta. Each trial gives liquid compositions from the component balances. The correct beta makes the liquid fractions sum to one.",formula:String.raw`x_i=\frac{z_i}{1+\beta(K_i-1)},\qquad \sum_i x_i=1`},{heading:"Choose the next trial",body:"A positive Rachford-Rice residual means increase beta; a negative residual means decrease beta. Bracket the root and halve the interval. After three iterations, report the next midpoint rather than pretending the solution has converged.",steps:["Calculate K-values.","Evaluate residual at beta=0 and beta=1.","Take the midpoint.","Keep the half-interval containing the sign change.","Repeat three times and suggest the fourth beta."]}],examMove:"Show a compact iteration table containing beta, q, xA, yA and the residual; the table earns method marks even before convergence.",traps:["Calling beta the liquid fraction","Iterating without checking for a sign change","Forcing a two-phase answer when every K is above or below one"],source:"Lec4; Week 3 tutorial; 2023/24 B2(d)"}),Xi({id:"vle-five-mark-language",topic:"vle",title:"Five-mark VLE definitions",eyebrow:"VLE extension",minutes:16,priority:"stretch",objective:"Turn a one-line definition into the precise five-mark answer used in older papers.",blocks:[{heading:"Use the D-E-S-U pattern",body:"Give a definition, equation, labelled sketch and useful consequence. A correct term with no relationship or consequence rarely fills a five-mark allocation."},{heading:"Relative volatility",body:"Define it as the ratio of K-values, identify the more volatile component, and explain that larger alpha gives easier separation.",formula:String.raw`\alpha_{AB}=\frac{K_A}{K_B}`},{heading:"Raoult and azeotrope",body:"Raoult links liquid composition to partial pressure in an ideal liquid. At an azeotrope x=y, so ordinary distillation loses composition driving force."}],examMove:"For “define or discuss briefly,” write five separate marking points instead of one long paragraph.",traps:["Giving only an equation","Omitting assumptions","Confusing relative volatility with vapour fraction"],source:"2022/23 Section A; 2023/24 Section A"}),Xi({id:"dist-side-draws",topic:"distillation",title:"Side draws and extra operating sections",eyebrow:"Distillation extension",minutes:34,priority:"must",objective:"Derive the two rectifying operating lines created by a saturated-liquid side draw.",blocks:[{heading:"Every draw creates another section",body:"A liquid side stream S removes both total liquid and MVC. Draw separate control volumes above and below the draw; do not reuse one operating line through the whole rectifying section."},{heading:"Above the side draw",body:"The ordinary top-section balance is unchanged.",formula:"Vy=Lx+Dx_D"},{heading:"Below a saturated-liquid draw",body:"The descending liquid becomes Ls=L-S while V is unchanged. The accumulated top products are D and S.",formula:"Vy=(L-S)x+Dx_D+Sx_S"},{heading:"Continue through the feed",body:"At the feed, apply q to the liquid and vapour flows and derive the stripping line from a fresh control volume. Check the external balances F=D+B+S and FzF=DxD+BxB+SxS."}],examMove:"Shade the control volume and label which L and V belong to each section before writing a balance.",traps:["Using F=D+B when a side stream exists","Adding S to the downward liquid below a withdrawn liquid side stream","Using one rectifying line across the draw"],source:"Lec12-Lec13; 2024/25 Q4"}),Xi({id:"dist-definition-bank",topic:"distillation",title:"The distillation definition bank",eyebrow:"Distillation extension",minutes:20,priority:"stretch",objective:"Bank the recurring five-mark terms without stealing time from graph work.",blocks:[{heading:"CMO and Trouton",body:"Constant molar overflow means L and V remain constant within a section, producing straight operating lines. Trouton estimates similar molar entropy of vaporisation for many liquids and helps justify comparable latent heats.",formula:String.raw`\Delta H_{vap}/T_b\approx 85\text{-}88\;\mathrm{J\,mol^{-1}\,K^{-1}}`},{heading:"Reflux and boilup",body:"Reflux ratio is liquid returned from the condenser per distillate withdrawn, R=L/D. Boilup ratio is vapour raised from the reboiler per bottoms withdrawn."},{heading:"Batch distillation",body:"A charged still changes composition with time and has no steady feed. The instantaneous vapour follows equilibrium with the changing still liquid."}],examMove:"Attach one diagram consequence to each definition: straight line, operating-line slope, or changing still composition.",traps:["Saying CMO means liquid equals vapour","Defining reflux as all condenser liquid","Describing batch operation as steady state"],source:"Lecture 1; Lec5-Lec6; 2022/23 A1/A5/A8; 2023/24 A2/A7"}),Xi({id:"mc-paper-speed",topic:"mccabe",title:"A 30-mark construction under time pressure",eyebrow:"McCabe extension",minutes:32,priority:"must",objective:"Complete the full 2024/25-style construction while protecting method marks.",blocks:[{heading:"Calculate before plotting",body:"Solve product flows, rectifying slope/intercept, and q-line condition first. Write those values beside the graph so a ruler slip does not erase the algebra marks."},{heading:"Use the supplied table twice",body:"Plot y against x for equilibrium; later use T against x for a liquid tray temperature. A smooth curve should pass through (0,0) and (1,1)."},{heading:"Count visibly",body:"Number each horizontal equilibrium contact. Mark the first step using the stripping line as the feed stage. State separately theoretical stages, equipment stages, theoretical trays and actual trays."}],examMove:"Budget roughly one minute per raw mark, leaving the final minutes for stage convention, axes and units.",traps:["Drawing freehand axes that are not square","Reporting an unlabelled stage number","Applying efficiency to a total condenser"],source:"Lec20 pp. 13-16; 2024/25 Q5"}),Xi({id:"mc-rmin-variants",topic:"mccabe",title:"Minimum reflux for every feed condition",eyebrow:"McCabe extension",minutes:22,priority:"stretch",objective:"Find the limiting line when the q-line is vertical, horizontal or sloped.",blocks:[{heading:"Find the physical pinch",body:"Intersect the q-line with the equilibrium curve. For a saturated liquid this is simply x=zF; for a saturated vapour it lies where y=zF."},{heading:"Make the limiting rectifying line",body:"Connect the pinch to (xD,xD), measure its slope m or y-intercept b, then recover Rmin.",formula:String.raw`R_{min}=\frac{m}{1-m}=\frac{x_D}{b}-1`},{heading:"State the design consequence",body:"At Rmin the driving force vanishes at the pinch and the required ideal stages tend to infinity. A real design uses R above Rmin."}],examMove:"Label q-line, pinch, limiting line, slope/intercept and (xD,xD); those labels are the graphical working.",traps:["Using zF as the pinch for saturated vapour","Reading Rmin directly as the slope","Calling Rmin the minimum-energy condition"],source:"Lec10; Lec20 p. 13; 2023/24 B1(d); 2024/25 Q3"}),Xi({id:"abs-design-rating",topic:"absorption",title:"Kremser: design versus rating",eyebrow:"Absorption extension",minutes:30,priority:"must",objective:"Recognise which Kremser form is needed and convert a stage requirement into available columns.",blocks:[{heading:"Rating problem",body:"Equipment stages and flows are fixed; calculate the outlet or removal. Convert real trays to ideal stages before applying Kremser."},{heading:"Design problem",body:"The required removal and operating flow are fixed; solve for ideal stages. If available columns each contain a fixed number of ideal stages, divide and round the number of columns up.",formula:String.raw`N=\frac{\log\left[1+(A-1)y_B/y_T\right]}{\log A}-1\quad(x_T=0)`},{heading:"The A=1 limit",body:"Avoid a numerical 0/0. For clean solvent, yT/yB=1/(N+1) when A=1."}],examMove:"Write DESIGN or RATING at the top, list what is fixed, and convert real equipment to ideal stages before Kremser.",traps:["Rounding a number of columns down","Using percent removal as yT","Using real trays directly in an ideal-stage equation"],source:"Lec15-Lec16; aide-memoire; 2022/23 B2; 2024/25 Q6"}),Xi({id:"abs-stripping-bulk",topic:"absorption",title:"Stripping and bulk coordinates",eyebrow:"Absorption extension",minutes:24,priority:"stretch",objective:"Switch direction and concentration basis without losing the operating-line logic.",blocks:[{heading:"Stripping reverses transfer",body:"Solute moves from liquid to gas. Minimum gas rate is the limiting analogue of minimum solvent rate in absorption."},{heading:"Use solute-free ratios for rich streams",body:"X and Y keep the inert carrier flows constant even when transferred solute is not negligible.",formula:String.raw`X=x/(1-x),\qquad Y=y/(1-y)`},{heading:"Graphical stepping still works",body:"Draw equilibrium and operating lines in the same coordinate system, then step between them in the direction of the process. State clearly whether the axes use fractions or ratios."}],examMove:"Put arrows on the column and write “gas gains solute” or “liquid gains solute” before choosing an equation.",traps:["Mixing X,Y with x,y","Using an absorption factor as a stripping factor","Keeping dilute carrier-flow assumptions for a rich stream"],source:"Lec16-Lec17; reference notation guide"})],n3=[_e({id:"vx1",topic:"vle",kind:"mcq",priority:"must",marks:2,prompt:"For a two-phase binary flash, KA=1.8 and KB=0.55. Which statement is the correct first physical check?",options:["One K is above one and one below one, so a two-phase root may exist","Both components must be entirely vapour","The liquid fraction must equal KA/KB"],answer:"One K is above one and one below one, so a two-phase root may exist",hint:"Check the volatility of each component relative to the flash pressure.",steps:["Ki=Pi*/P.","A typical binary two-phase state has a volatile K>1 and a less volatile K<1."],marking:["Physical K-value check","Two-phase interpretation"],source:"Lec4",year:"Tutorial",skill:"flash feasibility",difficulty:"foundation"}),_e({id:"vx2",topic:"vle",kind:"numeric",priority:"must",marks:3,prompt:"For zA=0.50, KA=1.60, KB=0.60 and beta=0.50, calculate xA from the flash component balance.",answer:.3846,tolerance:.001,unit:"mole fraction",hint:"Use xA=zA/[1+beta(KA-1)].",steps:["Denominator=1+0.5(0.6)=1.3","xA=0.50/1.3=0.3846"],marking:["Equation","Substitution","Value"],source:"Lec4 iterative method",year:"2023/24",paperPart:"B2(d)",skill:"iterative flash",difficulty:"standard"}),_e({id:"vx3",topic:"vle",kind:"mcq",priority:"must",marks:2,prompt:"A positive Rachford-Rice residual at a trial vapour fraction means the next bisection trial should normally move which way?",options:["Toward a larger vapour fraction","Toward a smaller vapour fraction","Directly to zero liquid"],answer:"Toward a larger vapour fraction",hint:"For the normal bracket, the residual falls as beta rises.",steps:["Retain the half interval that contains the sign change."],marking:["Direction","Bisection logic"],source:"Lec4",year:"Tutorial",skill:"iteration control",difficulty:"standard"}),_e({id:"vx4",topic:"vle",kind:"short",priority:"stretch",marks:5,prompt:"Define relative volatility as a five-mark answer.",answer:"Relative volatility is the ratio of equilibrium K-values, alphaAB=KA/KB. It compares the tendency of A and B to enter vapour. If A is the MVC then alpha>1; larger alpha means a larger equilibrium separation and easier distillation. Alpha may vary with temperature and composition.",hint:"Definition, equation, component meaning and consequence.",steps:["Define K ratio.","Identify MVC condition.","Explain separation effect.","Mention possible variation."],marking:["Definition","Equation","MVC meaning","Magnitude consequence","Limits/variation"],source:"2022/23 A2",year:"2022/23",paperPart:"A2",skill:"definition",difficulty:"standard"}),_e({id:"vx5",topic:"vle",kind:"numeric",priority:"must",marks:3,prompt:"At 3 bar, a component has saturated vapour pressure 6.9 bar. Find its ideal K-value.",answer:2.3,tolerance:.01,hint:"Ki=Pi*/P.",steps:["K=6.9/3","K=2.3"],marking:["Equation","Substitution","Value"],source:"2023/24 B2(c) style",year:"2023/24",skill:"K-value",difficulty:"foundation"}),_e({id:"vx6",topic:"vle",kind:"mcq",priority:"must",marks:2,prompt:"On a constant-pressure Txy plot, where is an all-liquid state?",options:["Below the bubble-point curve","Above the dew-point curve","Only on the diagonal"],answer:"Below the bubble-point curve",hint:"Heating an all-liquid mixture reaches its bubble point first.",steps:["Below bubble curve is liquid.","Between curves is two phase.","Above dew curve is vapour."],marking:["Correct region","Phase logic"],source:"2024/25 Q1(b)",year:"2024/25",paperPart:"Q1(b)",skill:"Txy reading",difficulty:"foundation"}),_e({id:"vx7",topic:"vle",kind:"short",priority:"must",marks:4,prompt:"State four differences between flash distillation and batch distillation.",answer:"A flash is normally a continuous feed split at fixed T and P into equilibrium liquid and vapour in one stage. Batch distillation begins with a charged still, has no steady feed, removes vapour/distillate over time and the still composition changes continuously.",hint:"Compare feed mode, time dependence, products and composition.",steps:["Continuous versus charged batch.","Single simultaneous split versus removal over time.","Steady versus changing composition.","One equilibrium stage versus differential operation."],marking:["Feed mode","Time dependence","Product handling","Composition behaviour"],source:"2024/25 Q2(d)",year:"2024/25",paperPart:"Q2(d)",skill:"comparison",difficulty:"standard"}),_e({id:"vx8",topic:"vle",kind:"numeric",priority:"stretch",marks:3,prompt:"A flash gives xA=0.40, yA=0.70 and overall zA=0.52. Find V/F.",answer:.4,tolerance:.001,unit:"vapour fraction",hint:"First find q=(y-z)/(y-x), then beta=1-q.",steps:["q=(0.70-0.52)/(0.70-0.40)=0.60","V/F=1-q=0.40"],marking:["Lever rule","Liquid fraction","Vapour fraction"],source:"Lec4",year:"Tutorial",skill:"flash quality",difficulty:"standard"}),_e({id:"dx1",topic:"distillation",kind:"mcq",priority:"must",marks:2,prompt:"A saturated-liquid side stream S is withdrawn from a rectifying section. What is the liquid flow immediately below the draw?",options:["L-S","L+S","L"],answer:"L-S",hint:"The downward liquid entering the draw point splits into side product and continuing liquid.",steps:["Draw a balance around the side-draw stage.","L=Lbelow+S."],marking:["Correct flow","Balance logic"],source:"Lec12-Lec13",year:"2024/25",paperPart:"Q4",skill:"side draw",difficulty:"foundation"}),_e({id:"dx2",topic:"distillation",kind:"short",priority:"must",marks:4,prompt:"D=50 kmol/h, R=2, and a saturated-liquid side draw is S=20 kmol/h. Find L, V and liquid flow below the draw.",answer:"L=100 kmol/h, V=150 kmol/h, Lbelow=80 kmol/h.",hint:"L=RD, V=L+D and Lbelow=L-S.",steps:["L=2(50)=100","V=100+50=150","Lbelow=100-20=80"],marking:["Reflux flow","Vapour flow","Side-draw balance","Units"],source:"2024/25 Q4 style",year:"Current blueprint",skill:"side-draw flows",difficulty:"standard"}),_e({id:"dx3",topic:"distillation",kind:"short",priority:"must",marks:5,prompt:"Define constant molar overflow and state its McCabe-Thiele consequence.",answer:"Within each column section, molar liquid and vapour flow rates are constant from stage to stage. This follows approximately from similar latent heats, negligible heat loss and negligible sensible-heat effects. Constant L/V makes each operating line straight, although flows may change at feeds, side draws or heat duties.",hint:"Definition, assumptions, straight-line consequence and where flows can change.",steps:["State constant L and V per section.","Give two assumptions.","State straight operating lines.","Mention section boundaries."],marking:["Definition","Latent heat assumption","Heat/sensible assumption","Straight lines","Section qualification"],source:"2022/23 A1; 2023/24 A8",year:"2022/23",skill:"definition",difficulty:"standard"}),_e({id:"dx4",topic:"distillation",kind:"mcq",priority:"stretch",marks:2,prompt:"Which expression is the boilup ratio for the notation used in this course?",options:["Vprime/B","L/D","D/V"],answer:"Vprime/B",hint:"Boilup compares vapour raised at the bottom with bottoms product.",steps:["Reflux belongs to the top; boilup belongs to the bottom."],marking:["Correct ratio","Bottom-section meaning"],source:"2022/23 A8; notation guide",year:"2022/23",paperPart:"A8",skill:"definition",difficulty:"foundation"}),_e({id:"dx5",topic:"distillation",kind:"short",priority:"stretch",marks:5,prompt:"Give a five-mark explanation of Trouton’s rule and why it supports CMO.",answer:"Trouton’s rule states that many non-associating liquids have a similar molar entropy of vaporisation, so DeltaHvap/Tb is roughly 85-88 J mol-1 K-1. Components with comparable boiling points therefore often have comparable molar latent heats. Condensing one mole can approximately vaporise one mole, supporting constant molar overflow. It is an approximation and is weaker for strongly associating liquids.",hint:"Rule, numerical scale, latent-heat link, one-for-one exchange and limitation.",steps:["State entropy relation.","Give approximate value.","Connect to latent heats.","Connect to CMO.","Give limitation."],marking:["Rule","Value","Latent-heat implication","CMO consequence","Limitation"],source:"2022/23 A5",year:"2022/23",paperPart:"A5",skill:"definition",difficulty:"stretch"}),_e({id:"dx6",topic:"distillation",kind:"numeric",priority:"must",marks:3,prompt:"F=100, zF=0.50, D=40, xD=0.90 and a side draw S=10 at xS=0.70. Find B from the total balance.",answer:50,tolerance:.001,unit:"kmol/h",hint:"F=D+B+S.",steps:["B=F-D-S","B=100-40-10=50"],marking:["Correct external balance","Substitution","Value/unit"],source:"2024/25 Q4 style",year:"2024/25",skill:"side-draw balance",difficulty:"foundation"}),_e({id:"dx7",topic:"distillation",kind:"mcq",priority:"must",marks:2,prompt:"For a total condenser under CMO, the rectifying operating-line y-intercept is:",options:["xD/(R+1)","R/(R+1)","xB/(R+1)"],answer:"xD/(R+1)",hint:"The slope contains R; the intercept contains product composition.",steps:["y=R/(R+1)x+xD/(R+1)."],marking:["Correct intercept","Line recognition"],source:"Lec7",year:"Current blueprint",skill:"operating line",difficulty:"foundation"}),_e({id:"dx8",topic:"distillation",kind:"short",priority:"stretch",marks:5,prompt:"Define batch distillation and distinguish it from continuous distillation.",answer:"Batch distillation starts with a finite charge in a still, normally has no continuous feed, and withdraws vapour or distillate as time proceeds. The liquid amount and composition change with time, so operation is unsteady. Continuous distillation has steady feed and product streams and is designed around approximately steady internal flows and compositions.",hint:"Charge, feed, time dependence, composition and continuous contrast.",steps:["Finite charge.","No steady feed.","Changing holdup/composition.","Unsteady operation.","Contrast continuous column."],marking:["Charge","Feed mode","Changing holdup","Changing composition","Continuous contrast"],source:"2023/24 A7",year:"2023/24",paperPart:"A7",skill:"definition",difficulty:"standard"}),_e({id:"mx1",topic:"mccabe",kind:"numeric",priority:"must",marks:3,prompt:"For alpha=3, zF=0.50, xD=0.95 and saturated-liquid feed, calculate the pinch y-coordinate used for Rmin.",answer:.75,tolerance:.001,hint:"At q=1, pinch x=zF and y follows equilibrium.",steps:["yp=alpha zF/[1+(alpha-1)zF]","yp=1.5/2=0.75"],marking:["Pinch x","Equilibrium equation","Value"],source:"Lec10",year:"Current blueprint",skill:"minimum reflux",difficulty:"standard"}),_e({id:"mx2",topic:"mccabe",kind:"numeric",priority:"must",marks:3,prompt:"A limiting rectifying line passes through (0.95,0.95) and (0.50,0.75). Find Rmin.",answer:.8,tolerance:.01,hint:"Find m, then R=m/(1-m).",steps:["m=(0.95-0.75)/(0.95-0.50)=0.4444","Rmin=0.4444/0.5556=0.80"],marking:["Slope","R relation","Value"],source:"Lec10",year:"Current blueprint",skill:"minimum reflux",difficulty:"standard"}),_e({id:"mx3",topic:"mccabe",kind:"mcq",priority:"must",marks:2,prompt:"For a saturated-vapour feed, where is the q-line/equilibrium pinch located?",options:["At the equilibrium point where y=zF","At x=zF regardless of equilibrium","At the origin"],answer:"At the equilibrium point where y=zF",hint:"A saturated-vapour q-line is horizontal.",steps:["q=0 gives y=zF.","Intersect that line with equilibrium."],marking:["Horizontal q-line","Correct pinch"],source:"2024/25 Q3",year:"2024/25",paperPart:"Q3",skill:"minimum reflux",difficulty:"foundation"}),_e({id:"mx4",topic:"mccabe",kind:"short",priority:"must",marks:5,prompt:"List five labels or calculations that protect method marks on a McCabe-Thiele graph.",answer:"Square x-y axes and MVC; equilibrium curve and diagonal; xD,zF,xB; rectifying, q and stripping lines; numerical slopes/intercepts; labelled pinch if relevant; numbered stages; feed-stage switch; explicit condenser/reboiler counting convention.",hint:"Think axes, curves, lines, compositions and stage convention.",steps:["Axes/curve.","Compositions.","Lines.","Stage numbering/feed.","Equipment convention."],marking:["Any five defensible labelled items"],source:"Lec20; all three papers",year:"Current blueprint",skill:"graph execution",difficulty:"foundation"}),_e({id:"mx5",topic:"mccabe",kind:"numeric",priority:"must",marks:3,prompt:"A staircase gives 8 theoretical stages including a partial reboiler and partial condenser. At 70% tray efficiency, how many actual column trays are required?",answer:9,tolerance:0,unit:"trays",hint:"Remove both equilibrium equipment stages before applying tray efficiency.",steps:["Theoretical column trays=8-2=6","Actual trays=ceil(6/0.70)=ceil(8.57)=9"],marking:["Remove two equipment stages","Efficiency","Round up"],source:"2022/23 B1 style",year:"2022/23",skill:"stage convention",difficulty:"standard"}),_e({id:"mx6",topic:"mccabe",kind:"mcq",priority:"stretch",marks:2,prompt:"If a feed changes from saturated liquid to saturated vapour at fixed reflux, what must be checked first?",options:["Whether the new horizontal q-line causes a pinch","Whether xD automatically becomes one","Whether CMO disappears everywhere"],answer:"Whether the new horizontal q-line causes a pinch",hint:"The feed intersection and stripping line change.",steps:["Redraw q-line.","Check its intersection and driving force."],marking:["Pinch check","Feed-line consequence"],source:"Lec20 worked example",year:"Current blueprint",skill:"diagram diagnosis",difficulty:"standard"}),_e({id:"mx7",topic:"mccabe",kind:"numeric",priority:"must",marks:3,prompt:"VLE data give T=440 K at x=0.54 and T=430 K at x=0.70. Estimate tray liquid temperature at x=0.62.",answer:435,tolerance:.2,unit:"K",hint:"Linearly interpolate T against liquid x.",steps:["Fraction=(0.62-0.54)/(0.70-0.54)=0.5","T=440+0.5(430-440)=435 K"],marking:["Use x column","Interpolation fraction","Temperature"],source:"2024/25 Q5(d) style",year:"2024/25",paperPart:"Q5(d)",skill:"tray temperature",difficulty:"standard"}),_e({id:"mx8",topic:"mccabe",kind:"short",priority:"stretch",marks:4,prompt:"Explain the capital-energy trade-off when reflux ratio is increased.",answer:"Increasing reflux raises internal liquid and vapour flows, condenser/reboiler duties and operating cost. It moves operating lines toward the diagonal, increases stagewise driving force and reduces required stages, which can reduce column height. Larger flows may increase diameter and equipment duty, so an economic optimum lies between minimum reflux and total reflux.",hint:"Mention stages, energy, flows and economic optimum.",steps:["Higher internal flows.","Higher energy.","Fewer stages.","Economic/equipment trade-off."],marking:["Flow trend","Energy trend","Stage trend","Design trade-off"],source:"Lec9 reflux lecture",year:"Current blueprint",skill:"design explanation",difficulty:"stretch"}),_e({id:"ax1",topic:"absorption",kind:"numeric",priority:"must",marks:3,prompt:"An absorber uses L/G=0.60 with He=0.40. Find the absorption factor.",answer:1.5,tolerance:.001,hint:"A=(L/G)/He.",steps:["A=0.60/0.40","A=1.50"],marking:["Equation","Substitution","Value"],source:"Lec15",year:"Current blueprint",skill:"absorption factor",difficulty:"foundation"}),_e({id:"ax2",topic:"absorption",kind:"mcq",priority:"must",marks:2,prompt:"A Kremser calculation requires 36 ideal stages and each available column supplies 5 ideal stages. How many columns are required?",options:["8","7.2","7"],answer:"8",hint:"Equipment counts are rounded up.",steps:["36/5=7.2.","Eight complete columns are required."],marking:["Division","Round up"],source:"2024/25 Q6(b) style",year:"2024/25",paperPart:"Q6(b)",skill:"equipment count",difficulty:"foundation"}),_e({id:"ax3",topic:"absorption",kind:"numeric",priority:"must",marks:4,prompt:"A gas enters with yB=0.030 and 98% must be removed. Find yT.",answer:6e-4,tolerance:1e-6,unit:"mole fraction",hint:"Two percent remains.",steps:["Fraction remaining=1-0.98=0.02","yT=0.030(0.02)=0.000600"],marking:["Remaining fraction","Multiplication","Value","Units/basis"],source:"2024/25 Q6",year:"2024/25",paperPart:"Q6",skill:"removal specification",difficulty:"foundation"}),_e({id:"ax4",topic:"absorption",kind:"short",priority:"must",marks:5,prompt:"Define the absorption factor and explain its design meaning.",answer:"The absorption factor is A=L/(GHe), the absorber operating-line slope divided by the equilibrium-line slope for the dilute linear convention. It measures the relative capacity of liquid flow to carry solute. Larger A generally improves removal for a fixed number of stages; A=1 is a special Kremser limit; the definition changes if incompatible bases are used.",hint:"Equation, slope ratio, physical meaning, trend and limitation.",steps:["Give equation.","Relate two slopes.","Explain capacity.","State performance trend.","State basis/special limit."],marking:["Equation","Slope meaning","Physical meaning","Trend","Basis/limit"],source:"Lec15-Lec16",year:"Current blueprint",skill:"definition",difficulty:"standard"}),_e({id:"ax5",topic:"absorption",kind:"numeric",priority:"must",marks:3,prompt:"For clean solvent, yB=0.020, yT=0.002 and He=0.50. Find (L/G)min.",answer:.45,tolerance:.001,hint:"At minimum xB,max=yB/He.",steps:["xB,max=0.020/0.50=0.040","(L/G)min=(0.020-0.002)/0.040=0.45"],marking:["Equilibrium outlet","Minimum-flow balance","Value"],source:"Lec16",year:"Current blueprint",skill:"minimum solvent",difficulty:"standard"}),_e({id:"ax6",topic:"absorption",kind:"mcq",priority:"stretch",marks:2,prompt:"Which change normally improves physical absorption of a gas into a liquid?",options:["Lower temperature and higher pressure","Higher temperature and lower pressure","Lower solvent rate"],answer:"Lower temperature and higher pressure",hint:"Favour solubility and driving force.",steps:["Gas solubility usually increases with pressure and decreases with temperature."],marking:["Temperature trend","Pressure trend"],source:"2024/25 Q6(c)",year:"2024/25",paperPart:"Q6(c)",skill:"improvement",difficulty:"foundation"}),_e({id:"ax7",topic:"absorption",kind:"short",priority:"stretch",marks:5,prompt:"Explain why solute-free ratios X and Y are used for bulk absorption.",answer:"When solute transfer is appreciable, total gas and liquid flow rates change through the column. X=x/(1-x) and Y=y/(1-y) express solute per mole of inert liquid solvent or carrier gas. Those inert carrier flows remain constant, simplifying balances and making the operating line manageable. Equilibrium and operating relations must both use the same ratio basis.",hint:"Changing totals, constant carriers, definitions and compatible axes.",steps:["State dilute-assumption problem.","Define X.","Define Y.","Explain constant carriers.","Require compatible basis."],marking:["Changing total flows","X definition","Y definition","Carrier benefit","Consistent basis"],source:"Lec17",year:"Current blueprint",skill:"bulk absorption",difficulty:"stretch"}),_e({id:"ax8",topic:"absorption",kind:"short",priority:"stretch",marks:4,prompt:"Give four valid ways to improve removal in a fixed absorber and link each to the physics.",answer:"Increase solvent flow to raise operating slope/A; use a better solvent or lower temperature to improve equilibrium solubility; raise pressure where appropriate; improve tray efficiency or contact; reduce gas flow; or add another column/stages.",hint:"Each change needs a reason, not just a list.",steps:["Choose four valid changes.","Link each to A, equilibrium, driving force or effective stages."],marking:["One mark for each linked change, maximum four"],source:"2022/23 B2(c); 2024/25 Q6(c)",year:"2024/25",skill:"design strategy",difficulty:"standard"})],r3=[et("vle","vfx1","Ideal flash K-value","Ki=Pi*/P."),et("vle","vfx2","Flash vapour fraction symbol","beta=V/F; q=1-beta is liquid fraction."),et("vle","vfx3","Flash trial composition","xi=zi/[1+beta(Ki-1)]."),et("vle","vfx4","Positive flash residual","Increase beta within a bracketed root search."),et("vle","vfx5","All Ki > 1","Feed tends to a single vapour phase."),et("vle","vfx6","All Ki < 1","Feed tends to a single liquid phase."),et("vle","vfx7","Five-mark definition recipe","Definition, equation, sketch and useful consequence."),et("distillation","dfx1","Side-draw external balance","F=D+B+S."),et("distillation","dfx2","Liquid below a saturated-liquid side draw","Lbelow=L-S."),et("distillation","dfx3","Below-draw operating balance","Vy=(L-S)x+DxD+SxS."),et("distillation","dfx4","Boilup ratio","Vprime/B in the course notation."),et("distillation","dfx5","Trouton scale","DeltaHvap/Tb is roughly 85-88 J mol-1 K-1 for many liquids."),et("distillation","dfx6","Batch distillation state","Unsteady; still amount and composition change with time."),et("distillation","dfx7","Where CMO flows can change","At a feed, side draw, condenser/reboiler or added heat duty."),et("mccabe","mfx1","Saturated-vapour pinch","Horizontal q-line y=zF intersects equilibrium."),et("mccabe","mfx2","Rmin from limiting intercept b","Rmin=xD/b-1."),et("mccabe","mfx3","Partial condenser as a stage","Yes if it creates an equilibrium composition change."),et("mccabe","mfx4","Two partial equipment stages","Remove both before applying tray efficiency."),et("mccabe","mfx5","Higher reflux","Fewer stages but larger internal flows and duties."),et("mccabe","mfx6","Tray temperature","Interpolate T against liquid x."),et("absorption","afx1","Kremser design unknown","Required ideal stages."),et("absorption","afx2","Kremser rating unknown","Outlet/removal or flow for fixed equipment."),et("absorption","afx3","A=1 clean-solvent limit","yT/yB=1/(N+1)."),et("absorption","afx4","Required equipment count","Nrequired/Nper-column, rounded up."),et("absorption","afx5","Bulk coordinates","X=x/(1-x), Y=y/(1-y)."),et("absorption","afx6","Minimum-flow physical meaning","Pinch, zero local driving force and infinite stages.")],l3=[{group:"Flash - understand",name:"K-value",latex:String.raw`K_i=P_i^*/P,\quad y_i=K_ix_i`,use:"Build an ideal fixed-T,P flash."},{group:"Flash - understand",name:"Rachford-Rice",latex:String.raw`\sum_i\frac{z_i(K_i-1)}{1+\beta(K_i-1)}=0`,use:"Iterate vapour fraction beta=V/F."},{group:"Distillation - derive",name:"q from enthalpy",latex:String.raw`q=\frac{H_V-H_F}{H_V-H_L}`,use:"Classify the thermal condition of feed."},{group:"Distillation - derive",name:"Liquid side-draw line",latex:String.raw`y=\frac{L-S}{V}x+\frac{Dx_D+Sx_S}{V}`,use:"Rectifying section below a saturated-liquid side draw."},{group:"Distillation - recall",name:"Trouton rule",latex:String.raw`\Delta H_{vap}/T_b\approx85\text{-}88\;\mathrm{J\,mol^{-1}\,K^{-1}}`,use:"Approximate latent-heat similarity behind CMO."},{group:"McCabe - understand",name:"Minimum reflux from slope",latex:"R_{min}=m/(1-m)",use:"Limiting rectifying line through pinch and (xD,xD)."},{group:"McCabe - understand",name:"Overall tray efficiency",latex:"E_o=N_{ideal,trays}/N_{actual,trays}",use:"Remove equilibrium equipment stages, divide, then round up."},{group:"Absorption - provided",name:"Kremser design (clean solvent)",latex:String.raw`N=\frac{\log[1+(A-1)y_B/y_T]}{\log A}-1`,use:"Required ideal stages; use the A=1 limit separately."},{group:"Absorption - derive",name:"Minimum solvent ratio",latex:String.raw`(L/G)_{min}=\frac{y_B-y_T}{y_B/H_e-x_T}`,use:"Bottom pinch for linear equilibrium."},{group:"Absorption - understand",name:"Stripping factor",latex:"S=GH_e/L=1/A",use:"Reverse-transfer analogue on the same dilute basis."},{group:"Score conversion",name:"Raw mark normalisation",latex:String.raw`\%=100\times\mathrm{raw\ score}/105`,use:"Current revision deck totals 105 raw marks."}],pr="/SEPARATION%20PROCESSES%201%20AND%20HYSYS%20(ENG2111)%20-%20SEMR1%2020256%20-%20812026%20-%201104%20PM/",P0=[{id:"paper-22-23",year:"2022/23",title:"Definitions, full McCabe and absorber rating",structure:"Eight 5-mark definitions followed by a 40-mark VLE/distillation construction and a 20-mark absorber problem.",sourceHref:`${pr}ENG2111_22-23%20exam%20paper.pdf`,solutionHref:`${pr}ENG2111%20Exam%2022-23%20numerical%20solution.docx`,sections:[{title:"A1 · Constant equimolar overflow",marks:5,focus:"Define CMO, state why it can be assumed and give the graph consequence.",modelAnswer:"Constant equimolar overflow means that the molar liquid flow L and molar vapour flow V remain approximately constant from tray to tray inside one column section. It assumes negligible heat loss, negligible sensible-heat effects and similar molar latent heats, so condensing about one mole of vapour supplies the heat to vaporise about one mole of liquid. Therefore L/V is constant and each McCabe-Thiele operating line is straight. L and V may change at a feed, side draw, condenser or reboiler.",method:["Write: CMO means constant L and V within one section - not necessarily throughout the whole column.","State two assumptions: nearly adiabatic operation and similar latent heats / small sensible-heat effects.","Explain the one-mole-condenses / one-mole-vaporises idea.","Connect it to constant L/V.","Finish: constant L/V gives a straight operating line, but streams can change the flows at section boundaries."],marking:["Correct definition","Section qualification","Two physical assumptions","One-for-one molar exchange","Straight-line consequence"]},{title:"A2 · Relative volatility",marks:5,focus:"Define alpha and connect its size to separation difficulty.",modelAnswer:"The relative volatility of A to B is alpha_AB=K_A/K_B=(y_A/x_A)/(y_B/x_B). If A is the more volatile component, alpha_AB>1. It measures how much more strongly A enters the vapour than B. When alpha is large, the equilibrium curve lies farther above the diagonal and fewer stages are normally required. When alpha approaches 1, separation by ordinary distillation becomes difficult.",method:["Define Ki=yi/xi.","Write alpha_AB=KA/KB.","Identify A as the MVC and state alpha>1.","Explain that a larger alpha gives greater vapour enrichment.","State the design consequence: easier separation / fewer stages; alpha near 1 is difficult."],marking:["K-value meaning","Equation","MVC interpretation","Magnitude meaning","Design consequence"]},{title:"A3 · Stripping factor",marks:5,focus:"Define the stripping factor and explain what it predicts.",modelAnswer:"For dilute linear equilibrium y*=He x, the absorption factor is A=L/(GHe) and the stripping factor is S=GHe/L=1/A. It compares the equilibrium tendency to return solute to the gas with the liquid carrying capacity. A larger stripping factor favours transfer from liquid to gas; a smaller stripping factor favours absorption. The definition assumes compatible flow and composition bases.",method:["Write the equilibrium relation y*=He x.","Write S=GHe/L.","Show S=1/A.","Explain the transfer direction: large S favours stripping.","State the dilute, linear-equilibrium and consistent-basis assumptions."],marking:["Equation","Reciprocal relation","Physical meaning","Performance trend","Assumptions/basis"]},{title:"A4 · Kremser equation",marks:5,focus:"Explain what Kremser relates and when it may be used.",modelAnswer:"The Kremser equations are analytical stage relations for counter-current absorption or stripping with linear equilibrium, approximately constant solute-free carrier flows and ideal stages. They relate terminal compositions, the number of ideal stages and the absorption or stripping factor. In a rating problem N and the flows are known and the outlet is calculated; in a design problem the required outlet is known and N is calculated. The A=1 case must use its limiting form.",method:["State the process: counter-current staged absorption or stripping.","State the assumptions: linear equilibrium, constant carrier flows and ideal stages.","Name the quantities related: terminal compositions, A or S, and N.","Distinguish rating from design.","Mention the special A=1 limiting form and consistent composition basis."],marking:["Purpose","Assumptions","Variables related","Design/rating distinction","Special limit/basis"]},{title:"A5 · Trouton’s rule",marks:5,focus:"State Trouton’s rule and explain why it supports CMO.",modelAnswer:"Trouton’s rule states that many non-associating liquids have a similar molar entropy of vaporisation at their normal boiling point: DeltaHvap/Tb is roughly 85-88 J mol^-1 K^-1. Components with similar boiling temperatures therefore often have similar molar latent heats. Condensing one mole can then approximately vaporise one mole, which supports constant molar overflow. It is an approximation and is weaker for strongly associating liquids such as water or alcohols.",method:["Write DeltaSvap=DeltaHvap/Tb.","Give the approximate 85-88 J mol^-1 K^-1 range.","Link similar entropy and boiling temperature to similar latent heat.","Link similar latent heats to one-for-one molar exchange and CMO.","State one limitation: strongly associating liquids / approximation only."],marking:["Rule/equation","Approximate value and units","Latent-heat implication","CMO connection","Limitation"]},{title:"A6 · Raoult’s law",marks:5,focus:"Define partial pressure, state the ideal-mixture equation and combine it with Dalton.",modelAnswer:"For an ideal liquid mixture, the partial pressure of component i is p_i=x_i p_i*(T), where x_i is its liquid mole fraction and p_i* is its pure-component saturated vapour pressure at the same temperature. Dalton’s law gives P=sum p_i and y_i=p_i/P. Therefore y_i=x_i p_i*/P. Raoult’s law is most reliable for chemically similar components and an ideal liquid phase.",method:["Define every symbol before using it.","Write p_i=x_i p_i*.","Use Dalton: P=sum p_i.","Obtain y_i=p_i/P=x_i p_i*/P.","State the ideal-liquid / similar-component assumption."],marking:["Partial-pressure equation","Symbols","Total-pressure relation","Vapour-composition relation","Assumption"]},{title:"A7 · Total reflux",marks:5,focus:"Define the operating limit and state its stage and energy consequences.",modelAnswer:"At total reflux, all condensed overhead liquid is returned to the column and no distillate or bottoms products are withdrawn, so D=B=0 and R=L/D tends to infinity. The operating lines coincide with the diagonal y=x. The stagewise separation driving force is then at its maximum and the required theoretical-stage count is the minimum, Nmin. It is a limiting test condition, not a productive steady operation.",method:["State that all condensate is returned.","State D=B=0 and R tends to infinity.","State both operating lines become y=x.","State the result: minimum stages / maximum stagewise separation.","Explain that no product is made, so this is a limit rather than a normal design point."],marking:["All liquid returned","No products / infinite reflux ratio","Diagonal operating lines","Minimum stages","Limiting condition"]},{title:"A8 · Boilup",marks:5,focus:"Define boilup and distinguish it from reflux.",modelAnswer:"Boilup is the vapour generated in the reboiler and returned upward into the column. On the notation used in this course, the boilup ratio is Vprime/B, where Vprime is the bottom-section vapour flow and B is the bottoms-product flow. Increasing boilup raises internal vapour traffic and reboiler duty and usually strengthens stripping. It is the bottom-end analogue of top reflux R=L/D.",method:["State what physically boils and where the vapour goes.","Write the course ratio Vprime/B.","Define Vprime and B.","State the separation and energy trend when boilup rises.","Contrast it with reflux at the condenser."],marking:["Physical definition","Correct ratio","Symbols","Performance/energy consequence","Reflux contrast"]},{title:"B1(a-c) · Equilibrium curve and one-stage flash",marks:15,focus:"Build y-x data for alpha=4, use q=L/F=0.4 with z=0.65, and name the equipment.",modelAnswer:"Use y=4x/(1+3x) to build and plot the equilibrium curve above y=x. For the flash, z=q x+(1-q)y with z=0.65 and q=0.40. Solving 0.65=0.40x+0.60[4x/(1+3x)] gives x approximately 0.463 and y approximately 0.775; a coarse graph can read about x=0.48 and y=0.78 as printed in the supplied key. The equipment is a flash drum (single equilibrium-stage separator).",method:["Draw square axes: liquid MVC mole fraction x horizontally and vapour MVC mole fraction y vertically, both 0-1.","Calculate sample points using y=4x/[1+3x]; for example x=0.50 gives y=2/(2.5)=0.80.","Plot a smooth equilibrium curve through (0,0) and (1,1), plus the diagonal y=x.","Translate liquid fraction: q=L/F=0.40, so vapour fraction V/F=1-q=0.60.","Write the one-stage component balance: z=q x+(1-q)y.","Substitute z=0.65, q=0.40 and y=4x/(1+3x).","Solve to obtain x about 0.463, then y=4(0.463)/[1+3(0.463)] about 0.775.","On the graph, draw the tie-line and lever-rule split; label liquid L, vapour V and flash drum."],marking:["Equation and sample calculations","Correct labelled equilibrium curve","Material/lever-rule relation","Liquid composition","Vapour composition","Equipment name"],warning:"The supplied numerical key gives x=0.48 and y=0.78. Direct algebra using the printed alpha=4, z=0.65 and L/F=0.40 gives x=0.463 and y=0.775. Treat the key values as approximate graph readings and protect yourself by showing the equation and construction."},{title:"B1(d-g) · Product balances, lines, stages and real trays",marks:25,focus:"Use F=115, zF=0.65, xD=0.97, xB=0.10, q=1, R=4 and 60% tray efficiency.",modelAnswer:"The product flows are D=72.70 approximately 73 kmol/h and B=42.30 approximately 42 kmol/h. The saturated-liquid q-line is vertical at x=0.65. With R=4, the rectifying line is y=0.8x+0.194. Complete the stripping line through the feed intersection and (xB,xB), then step the stages. The supplied key gives five theoretical equilibrium stages. Because the paper specifies a partial condenser and partial reboiler, state the counting convention; removing both non-tray equipment stages leaves three ideal column trays, so Nactual=ceil(3/0.60)=5 real plates.",method:["Convert the bottoms specification: 90 mol% B means xB(A)=1-0.90=0.10.","Write F=D+B and FzF=DxD+BxB.","Eliminate B with B=F-D: D=F(zF-xB)/(xD-xB).","Substitute D=115(0.65-0.10)/(0.97-0.10)=72.70 kmol/h.","Calculate B=115-72.70=42.30 kmol/h and check D+B=115.","For bubble-point liquid q=1, draw the vertical q-line x=zF=0.65.","Use R=4: y=[R/(R+1)]x+xD/(R+1)=0.8x+0.194.","Join the rectifying/q-line intersection to (0.10,0.10) for the stripping line.","Step horizontally to equilibrium and vertically to the active operating line until xB is reached; label the five-stage checkpoint.","State whether the partial condenser and reboiler were counted, remove non-tray stages, divide by 0.60 and round upward to five real trays on the supplied-key convention."],marking:["Composition conversion","Two external balances","D and B with units","q-line","Rectifying line","Stripping line","Visible stage construction","Stage convention","Efficiency calculation and upward rounding"]},{title:"B2(a-b) · Can the old absorber meet 90% removal?",marks:17,focus:"Rate 12 real trays at 75% efficiency with G=130, L=50, yB=0.005 and y*=21x.",modelAnswer:"This is a rating problem. The tray section supplies N=12(0.75)=9 ideal stages. The absorption factor is A=L/(GHe)=50/[130(21)]=0.018315. For clean solvent, yT/yB=(A-1)/(A^(N+1)-1)=0.981685, so yT=0.005(0.981685)=0.004908 and removal is only about 1.83%, not 90%; therefore the column cannot meet the target at L=50 kmol/h. A liquid saturated against the entering gas has xB*=yB/He=0.005/21=2.38x10^-4, close to the supplied-key value 0.00026.",method:["Write RATING because the equipment and flows are fixed and the question asks what performance it gives.","Convert real trays to ideal stages: Nideal=Eo Nreal=0.75(12)=9.","Read the linear equilibrium slope directly from y*=21x, so He=21.","Calculate A=L/(GHe)=50/[130(21)]=0.018315.","Use the clean-solvent rating form yT/yB=(A-1)/(A^(N+1)-1).","Substitute N=9 and A=0.018315 to obtain yT/yB=0.981685.","Calculate yT=0.005(0.981685)=0.004908 and removal=1-yT/yB=0.018315=1.83%.","Compare 1.83% with the required 90% and answer NO.","For saturated exiting absorbent, use equilibrium at the rich end: xB*=yB/21=0.000238."],marking:["Design/rating identification","Efficiency conversion","Correct He","Absorption factor","Kremser form","Outlet calculation","Removal comparison and conclusion","Saturated-liquid calculation"],warning:"Do not replace He=21 by 0.21. The paper explicitly states Henry slope 21; using 0.21 predicts excellent removal and reverses the correct “No” answer."},{title:"B2(c) · Improve the fixed absorber",marks:3,focus:"Give changes and link each one to the physical reason removal improves.",modelAnswer:"Increase solvent rate L or reduce gas rate G to raise A=L/(GHe); choose a more soluble solvent, reduce temperature or increase pressure where appropriate to reduc
